<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>소현이의 나사 풀기 🔩</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
        font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
        background:linear-gradient(165deg,#2b1055 0%,#4a2b8a 60%,#6b4bb0 100%);
        user-select:none; -webkit-user-select:none; touch-action:manipulation;
        display:flex; flex-direction:column; align-items:center;
    }
    canvas { display:block; touch-action:none; }

    .hud {
        position:fixed; top:10px; left:10px; right:10px;
        display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
        z-index:10; pointer-events:none;
    }
    .box {
        background:rgba(255,255,255,.13); border:1px solid rgba(255,255,255,.26);
        border-radius:14px; padding:6px 14px; color:#fff; text-align:center;
        backdrop-filter:blur(5px);
    }
    .box .l { font-size:.62em; opacity:.82; }
    .box .v { font-size:1.15em; font-weight:800; }
    .btn-hud { pointer-events:auto; cursor:pointer; }

    .toast {
        position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(16px);
        background:rgba(20,10,50,.92); color:#ffd6e8; padding:11px 22px; border-radius:18px;
        font-size:.92em; font-weight:700; opacity:0; transition:opacity .25s, transform .25s;
        pointer-events:none; z-index:60; white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    .overlay {
        position:fixed; inset:0; background:rgba(12,7,36,.84);
        display:none; justify-content:center; align-items:center; z-index:100;
    }
    .overlay.show { display:flex; animation:fade .3s; }
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .card {
        background:linear-gradient(160deg,#fff5fa,#ffe8f0);
        border-radius:26px; padding:32px 30px; text-align:center; margin:20px;
        box-shadow:0 20px 60px rgba(0,0,0,.45); max-width:330px;
        animation:pop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop { 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
    .card .em { font-size:2.8em; margin-bottom:6px; }
    .card h2 { color:#d6336c; font-size:1.4em; margin-bottom:8px; }
    .card p { color:#9b6b80; font-size:.92em; line-height:1.6; margin-bottom:6px; }
    .btn {
        border:none; border-radius:15px; padding:14px 32px; font-size:1.05em; font-weight:800;
        cursor:pointer; color:#fff; margin:6px 4px 0;
        background:linear-gradient(135deg,#f857a6,#ff5858);
        box-shadow:0 6px 16px rgba(248,87,166,.4); transition:transform .13s;
        font-family:inherit;
    }
    .btn:active { transform:scale(.94); }
    .btn.grey { background:linear-gradient(135deg,#a18cd1,#fbc2eb); color:#4a2c6b; }
    .rule { background:rgba(248,87,166,.09); border-radius:13px; padding:12px 14px;
            text-align:left; font-size:.85em; color:#85566b; line-height:1.7; margin:12px 0 4px; }
</style>
</head>
<body>
<canvas id="cvs"></canvas>

<div class="hud">
    <div class="box"><div class="l">레벨</div><div class="v" id="lv">1</div></div>
    <div class="box"><div class="l">남은 나사</div><div class="v" id="left">0</div></div>
    <div class="box btn-hud" onclick="doUndo()"><div class="l">되돌리기</div><div class="v" id="undoN">2</div></div>
    <div class="box btn-hud" onclick="restart()"><div class="l">다시</div><div class="v">🔄</div></div>
    <div class="box btn-hud" onclick="toggleSound()"><div class="l">소리</div><div class="v" id="sndIcon">🔊</div></div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay show" id="startOv">
    <div class="card">
        <div class="em">🔩🐰</div>
        <h2>소현이의 나사 풀기</h2>
        <p>by 동훈 ❤️</p>
        <div class="rule">
            🔩 <b>나사를 눌러서</b> 아래 상자에 넣으세요<br>
            📦 같은 색 <b>3개</b>를 모으면 상자가 비워져요<br>
            🪵 판때기에 <b>가려진 나사</b>는 못 빼요!<br>
            &nbsp;&nbsp;&nbsp;위에 있는 판부터 치우세요<br>
            💀 상자 4칸이 전부 막히면 게임 오버!
        </div>
        <button class="btn" onclick="startGame()">🎮 시작!</button>
    </div>
</div>

<div class="overlay" id="clearOv">
    <div class="card">
        <div class="em">🎉🔩</div>
        <h2>레벨 클리어!</h2>
        <p id="clearMsg">소현이 최고! 💕</p>
        <button class="btn" onclick="nextLevel()">다음 레벨 ➡️</button>
    </div>
</div>

<div class="overlay" id="overOv">
    <div class="card">
        <div class="em">😵📦</div>
        <h2>게임 오버!</h2>
        <p>상자가 꽉 차서 나사를 넣을 곳이 없어요...</p>
        <button class="btn grey" onclick="undoFromOver()">↩️ 한 수 되돌리기</button>
        <button class="btn" onclick="restart()">🔄 다시 하기</button>
    </div>
</div>

<script>
// ───────── 저장 & 사운드 ─────────
function sLoad(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function sSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let audioCtx = null, soundOn = sLoad('screwSound', true);
function ac() {
    if (!audioCtx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; audioCtx = new A(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(f, dur, o) {
    if (!soundOn) return;
    const a = ac(); if (!a) return;
    o = o || {};
    const t0 = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t0 + dur);
    const v = o.vol || 0.1;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.04);
}
const S = {
    unscrew() { for (let i = 0; i < 5; i++) tone(300 + i * 60, 0.05, { delay: i * 0.035, type: 'square', vol: 0.035 }); },
    drop()    { tone(520, 0.08, { type: 'triangle', vol: 0.1 }); },
    complete(){ [660, 880, 1175].forEach((f, i) => tone(f, 0.14, { delay: i * 0.07, type: 'triangle', vol: 0.14 })); },
    plate()   { tone(180, 0.22, { slideTo: 90, type: 'sawtooth', vol: 0.09 }); },
    blocked() { tone(200, 0.12, { type: 'square', vol: 0.06 }); },
    undo()    { tone(500, 0.1, { slideTo: 300, vol: 0.09 }); },
    win()     { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.22, { delay: i * 0.1, type: 'triangle', vol: 0.15 })); },
    over()    { [392, 330, 262].forEach((f, i) => tone(f, 0.32, { delay: i * 0.28, type: 'triangle', vol: 0.14 })); }
};
function toggleSound() {
    soundOn = !soundOn; sSave('screwSound', soundOn);
    document.getElementById('sndIcon').textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) S.drop();
}
document.getElementById('sndIcon').textContent = soundOn ? '🔊' : '🔇';

// ───────── 캔버스 ─────────
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', () => { resize(); });
resize();

// ───────── 상수 ─────────
const COLORS = [
    { n: '빨강',   c: '#ff5c5c', d: '#c92a2a' },
    { n: '노랑',   c: '#ffd43b', d: '#e8a904' },
    { n: '초록',   c: '#69db7c', d: '#2f9e44' },
    { n: '파랑',   c: '#4dabf7', d: '#1971c2' },
    { n: '보라',   c: '#b197fc', d: '#7048e8' },
    { n: '분홍',   c: '#ff8fc7', d: '#e64980' },
    { n: '주황',   c: '#ffa94d', d: '#e8590c' },
    { n: '민트',   c: '#63e6be', d: '#0ca678' },
];
const BOX_N = 4;        // 상자 개수
const BOX_CAP = 3;      // 상자당 나사 3개
const SCREW_R = 15;     // 나사 반지름

// ───────── 게임 상태 ─────────
let G = null;
let running = false, lastT = 0;

function boardRect() {
    const top = 78, bottom = H - 150;
    return { x: 16, y: top, w: W - 32, h: Math.max(180, bottom - top) };
}

function makeLevel(level) {
    const R = boardRect();
    // 🔥 난이도 상향
    const plateCount = Math.min(5 + Math.floor(level * 1.1), 13);
    const colorCount = Math.min(3 + Math.floor(level / 1.4), 8);

    const plates = [];
    const screws = [];
    let sid = 0;

    // 판때기 배치 — 서로 확실히 겹치도록 길고 큼직하게 (겹쳐야 나사가 가려짐!)
    const cols = 2, rows = Math.ceil(plateCount / cols);
    const cellW = R.w / cols, cellH = R.h / rows;
    const long0 = Math.min(R.w * 0.66, 250);
    const thick = Math.max(46, Math.min(cellH * 0.62, 66));
    let idx = 0;
    for (let r = 0; r < rows && idx < plateCount; r++) {
        for (let c = 0; c < cols && idx < plateCount; c++, idx++) {
            const long = long0 * (0.82 + Math.random() * 0.24);
            // 홀수 판은 크게 기울여서 아래 판 위로 가로지르게
            const ang = (idx % 2 ? 1 : -1) * (0.35 + Math.random() * 0.75) * (Math.random() < 0.35 ? -1 : 1);
            // 회전된 판의 실제 경계상자를 계산해서, 어떤 각도/길이여도
            // 캔버스(R) 밖으로 튀어나가지 않도록 중심 좌표를 클램프한다.
            const halfExX = Math.abs(Math.cos(ang)) * long / 2 + Math.abs(Math.sin(ang)) * thick / 2;
            const halfExY = Math.abs(Math.sin(ang)) * long / 2 + Math.abs(Math.cos(ang)) * thick / 2;
            const targetCx = R.x + cellW * (c + 0.5) + (Math.random() - 0.5) * cellW * 0.3;
            const targetCy = R.y + thick * 0.7 + (R.h - thick * 1.4) * (rows === 1 ? 0.5 : r / (rows - 1))
                       + (Math.random() - 0.5) * cellH * 0.22;
            const cx = Math.min(R.x + R.w - halfExX - 4, Math.max(R.x + halfExX + 4, targetCx));
            const cy = Math.min(R.y + R.h - halfExY - 4, Math.max(R.y + halfExY + 4, targetCy));
            plates.push({
                cx, cy, w: long, h: thick, ang,
                z: idx, screws: [], falling: 0, gone: false,
                tone: 0.85 + Math.random() * 0.3
            });
        }
    }

    // 나사 배치 (판 위 2~3개)
    plates.forEach(p => {
        const n = 2 + (Math.random() < 0.45 ? 1 : 0);
        const usable = p.w / 2 - SCREW_R - 8;
        for (let k = 0; k < n; k++) {
            const t = n === 1 ? 0 : (-1 + 2 * k / (n - 1)) * usable;
            const lx = t, ly = (Math.random() - 0.5) * (p.h / 2 - SCREW_R - 4) * 1.2;
            const wx = p.cx + Math.cos(p.ang) * lx - Math.sin(p.ang) * ly;
            const wy = p.cy + Math.sin(p.ang) * lx + Math.cos(p.ang) * ly;
            const s = { id: sid++, x: wx, y: wy, plate: p, color: 0, gone: false, spin: Math.random() * 6, wob: 0 };
            p.screws.push(s);
            screws.push(s);
        }
    });

    // 나사 총 개수를 3의 배수로 맞추기
    while (screws.length % 3 !== 0) {
        const p = plates[Math.floor(Math.random() * plates.length)];
        const s = p.screws[p.screws.length - 1];
        p.screws.pop();
        screws.splice(screws.indexOf(s), 1);
    }

    // 색 배분: 3개씩 한 세트
    const pool = [];
    const sets = screws.length / 3;
    for (let i = 0; i < sets; i++) {
        const col = i < colorCount ? i : Math.floor(Math.random() * colorCount);
        pool.push(col, col, col);
    }
    for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    screws.forEach((s, i) => s.color = pool[i]);

    return { plates, screws };
}

function newGame(level) {
    const lv = makeLevel(level);
    return {
        level,
        plates: lv.plates,
        screws: lv.screws,
        boxes: Array.from({ length: BOX_N }, () => ({ color: -1, items: [], clearT: 0 })),
        flying: [],
        parts: [],
        undos: 2,
        history: [],
        busy: false,
        over: false,
        cleared: false,
        t: 0
    };
}

// ───────── 기하 ─────────
function plateContains(p, x, y) {
    if (p.gone) return false;
    const dx = x - p.cx, dy = y - p.cy;
    const ca = Math.cos(-p.ang), sa = Math.sin(-p.ang);
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    return Math.abs(lx) <= p.w / 2 && Math.abs(ly) <= p.h / 2;
}
// 나사가 노출됐나? (자기 판보다 위에 있는 판이 덮고 있으면 못 뺌)
function isExposed(s) {
    for (const p of G.plates) {
        if (p.gone || p === s.plate) continue;
        if (p.z > s.plate.z && plateContains(p, s.x, s.y)) return false;
    }
    return true;
}

// ───────── 상자 ─────────
function boxSlots() {
    const bw = Math.min((W - 40) / BOX_N - 10, 88);
    const gap = 10;
    const total = BOX_N * bw + (BOX_N - 1) * gap;
    const x0 = (W - total) / 2;
    const y = H - 118;
    return G.boxes.map((b, i) => ({ b, x: x0 + i * (bw + gap), y, w: bw, h: 74 }));
}
function findBoxFor(color) {
    let empty = -1;
    for (let i = 0; i < G.boxes.length; i++) {
        const b = G.boxes[i];
        if (b.clearT > 0) continue;
        if (b.color === color && b.items.length < BOX_CAP) return i;
        if (b.color === -1 && empty === -1) empty = i;
    }
    return empty;
}

function snapshot() {
    return {
        screws: G.screws.map(s => ({ id: s.id, gone: s.gone })),
        plates: G.plates.map(p => ({ gone: p.gone, falling: p.falling })),
        boxes: G.boxes.map(b => ({ color: b.color, items: [...b.items], clearT: 0 }))
    };
}
function restore(snap) {
    G.screws.forEach((s, i) => { s.gone = snap.screws[i].gone; });
    G.plates.forEach((p, i) => { p.gone = snap.plates[i].gone; p.falling = 0; });
    G.boxes = snap.boxes.map(b => ({ color: b.color, items: [...b.items], clearT: 0 }));
    G.flying.length = 0;
    G.over = false;
    document.getElementById('overOv').classList.remove('show');
    updateHud();
}

// ───────── 조작 ─────────
function onTap(px, py) {
    if (!G || G.busy || G.over || G.cleared) return;
    let hit = null, bestZ = -1;
    for (const s of G.screws) {
        if (s.gone) continue;
        const d = Math.hypot(s.x - px, s.y - py);
        if (d <= SCREW_R + 9 && s.plate.z > bestZ) { hit = s; bestZ = s.plate.z; }
    }
    if (!hit) return;

    if (!isExposed(hit)) {
        S.blocked();
        hit.wob = 0.4;
        toast('🪵 위에 있는 판을 먼저 치워요!');
        return;
    }
    const bi = findBoxFor(hit.color);
    if (bi === -1) {
        S.blocked();
        toast('📦 넣을 상자가 없어요! 다른 색을 완성하세요');
        return;
    }

    G.history.push(snapshot());
    if (G.history.length > 25) G.history.shift();

    hit.gone = true;
    S.unscrew();
    const slot = boxSlots()[bi];
    const n = G.boxes[bi].items.length;
    G.flying.push({
        s: hit, t: 0, dur: 0.42,
        x0: hit.x, y0: hit.y,
        x1: slot.x + slot.w / 2 + (n - 1) * 22,
        y1: slot.y + slot.h / 2 + 6,
        box: bi
    });
    updateHud();
}

function landScrew(f) {
    const b = G.boxes[f.box];
    if (b.color === -1) b.color = f.s.color;
    b.items.push(f.s.color);
    S.drop();
    // 판때기 확인: 나사가 다 빠졌으면 떨어짐
    const p = f.s.plate;
    if (!p.gone && p.screws.every(s => s.gone)) {
        p.falling = 0.001;
        S.plate();
    }
    // 상자 완성
    if (b.items.length >= BOX_CAP) {
        b.clearT = 0.45;
        S.complete();
        const slot = boxSlots()[f.box];
        burst(slot.x + slot.w / 2, slot.y + slot.h / 2, COLORS[b.color].c, 16);
    }
    checkState();
}

function checkState() {
    if (G.screws.every(s => s.gone) && G.flying.length === 0) {
        G.cleared = true;
        S.win();
        setTimeout(() => {
            document.getElementById('clearMsg').textContent =
                '레벨 ' + G.level + ' 클리어! 소현이 최고 💕';
            document.getElementById('clearOv').classList.add('show');
        }, 420);
        return;
    }
    // 게임오버: 노출된 나사가 있는데 아무것도 넣을 수 없을 때
    if (G.flying.length === 0) {
        const avail = G.screws.filter(s => !s.gone && isExposed(s));
        if (avail.length && avail.every(s => findBoxFor(s.color) === -1)) {
            const anyClearing = G.boxes.some(b => b.clearT > 0);
            if (!anyClearing) {
                G.over = true;
                S.over();
                setTimeout(() => document.getElementById('overOv').classList.add('show'), 350);
            }
        }
    }
}

function doUndo() {
    if (!G || G.cleared) return;
    if (G.undos <= 0) { toast('되돌리기를 다 썼어요 😢'); return; }
    if (!G.history.length) { toast('되돌릴 수가 없어요'); return; }
    G.undos--;
    restore(G.history.pop());
    S.undo();
    toast('↩️ 한 수 되돌렸어요');
}
function undoFromOver() {
    if (!G.history.length) { restart(); return; }
    restore(G.history.pop());
    S.undo();
}

// ───────── 이펙트 ─────────
function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
        G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, life: 0.55, color, r: 2 + Math.random() * 3 });
    }
}
let toastTimer = null;
function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}
function updateHud() {
    document.getElementById('lv').textContent = G.level;
    document.getElementById('left').textContent = G.screws.filter(s => !s.gone).length;
    document.getElementById('undoN').textContent = G.undos;
}

// ───────── 업데이트 ─────────
function update(dt) {
    G.t += dt;
    for (let i = G.flying.length - 1; i >= 0; i--) {
        const f = G.flying[i];
        f.t += dt;
        if (f.t >= f.dur) { G.flying.splice(i, 1); landScrew(f); }
    }
    G.plates.forEach(p => {
        if (p.falling > 0) {
            p.falling += dt;
            if (p.falling > 0.65) { p.gone = true; p.falling = 0; }
        }
    });
    G.boxes.forEach(b => {
        if (b.clearT > 0) {
            b.clearT -= dt;
            if (b.clearT <= 0) { b.clearT = 0; b.color = -1; b.items = []; checkState(); }
        }
    });
    for (let i = G.parts.length - 1; i >= 0; i--) {
        const p = G.parts[i];
        p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt;
        if (p.life <= 0) G.parts.splice(i, 1);
    }
    G.screws.forEach(s => { if (s.wob > 0) s.wob = Math.max(0, s.wob - dt * 1.6); });
}

// ───────── 그리기 ─────────
function roundRect(x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}
function drawScrew(x, y, color, scale, spin, dim) {
    const r = SCREW_R * (scale || 1);
    const c = COLORS[color];
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(spin || 0);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,.28)';
    ctx.beginPath(); ctx.arc(1.5, 2.5, r, 0, 7); ctx.fill();
    // 머리
    const g = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r);
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.35, c.c);
    g.addColorStop(1, c.d);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    // 테두리
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = Math.max(1.2, r * 0.12);
    ctx.beginPath(); ctx.arc(0, 0, r * 0.88, 0, 7); ctx.stroke();
    // 십자 홈
    ctx.strokeStyle = 'rgba(0,0,0,.42)';
    ctx.lineWidth = Math.max(2, r * 0.2);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.5, 0); ctx.lineTo(r * 0.5, 0);
    ctx.moveTo(0, -r * 0.5); ctx.lineTo(0, r * 0.5);
    ctx.stroke();
    if (dim) {
        ctx.fillStyle = 'rgba(10,5,30,.5)';
        ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
    }
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    if (!G) return;

    // 판때기 + 나사 (z 순서대로)
    const order = [...G.plates].sort((a, b) => a.z - b.z);
    order.forEach(p => {
        if (p.gone) return;
        ctx.save();
        let alpha = 1, drop = 0, rot = 0;
        if (p.falling > 0) {
            const k = Math.min(1, p.falling / 0.65);
            alpha = 1 - k; drop = k * k * 220; rot = k * 0.9;
        }
        ctx.globalAlpha = alpha;
        ctx.translate(p.cx, p.cy + drop);
        ctx.rotate(p.ang + rot);
        // 그림자
        ctx.fillStyle = 'rgba(0,0,0,.3)';
        roundRect(-p.w / 2 + 3, -p.h / 2 + 5, p.w, p.h, 12); ctx.fill();
        // 나무판
        const gg = ctx.createLinearGradient(0, -p.h / 2, 0, p.h / 2);
        const t = p.tone;
        gg.addColorStop(0, 'rgb(' + Math.round(206 * t) + ',' + Math.round(160 * t) + ',' + Math.round(112 * t) + ')');
        gg.addColorStop(1, 'rgb(' + Math.round(150 * t) + ',' + Math.round(105 * t) + ',' + Math.round(66 * t) + ')');
        ctx.fillStyle = gg;
        roundRect(-p.w / 2, -p.h / 2, p.w, p.h, 12); ctx.fill();
        // 나뭇결
        ctx.strokeStyle = 'rgba(90,55,25,.28)';
        ctx.lineWidth = 1.4;
        for (let i = 1; i <= 2; i++) {
            const yy = -p.h / 2 + (p.h * i) / 3;
            ctx.beginPath();
            ctx.moveTo(-p.w / 2 + 10, yy);
            ctx.lineTo(p.w / 2 - 10, yy);
            ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255,255,255,.22)';
        ctx.lineWidth = 2;
        roundRect(-p.w / 2 + 2, -p.h / 2 + 2, p.w - 4, p.h - 4, 10); ctx.stroke();
        ctx.restore();

        // 이 판의 나사
        ctx.globalAlpha = p.falling > 0 ? Math.max(0, 1 - p.falling / 0.65) : 1;
        p.screws.forEach(s => {
            if (s.gone) return;
            const blocked = !isExposed(s);
            const wob = s.wob > 0 ? Math.sin(s.wob * 40) * 3 : 0;
            drawScrew(s.x + wob, s.y + (p.falling > 0 ? Math.min(1, p.falling / 0.65) ** 2 * 220 : 0),
                      s.color, 1, 0, blocked);
        });
        ctx.globalAlpha = 1;
    });

    // 날아가는 나사
    G.flying.forEach(f => {
        const k = Math.min(1, f.t / f.dur);
        const e = 1 - Math.pow(1 - k, 2);
        const x = f.x0 + (f.x1 - f.x0) * e;
        const y = f.y0 + (f.y1 - f.y0) * e - Math.sin(k * Math.PI) * 70;
        drawScrew(x, y, f.s.color, 1 - k * 0.25, k * 14, false);
    });

    // 상자
    boxSlots().forEach((slot, i) => {
        const b = slot.b;
        const pop = b.clearT > 0 ? 1 + (0.45 - b.clearT) * 0.6 : 1;
        ctx.save();
        ctx.translate(slot.x + slot.w / 2, slot.y + slot.h / 2);
        ctx.scale(pop, pop);
        ctx.translate(-slot.w / 2, -slot.h / 2);
        // 상자 몸통
        const col = b.color >= 0 ? COLORS[b.color] : null;
        ctx.fillStyle = col ? 'rgba(255,255,255,.16)' : 'rgba(255,255,255,.09)';
        ctx.strokeStyle = col ? col.c : 'rgba(255,255,255,.3)';
        ctx.lineWidth = 2.5;
        roundRect(0, 0, slot.w, slot.h, 14);
        ctx.fill(); ctx.stroke();
        if (col) {
            ctx.shadowColor = col.c; ctx.shadowBlur = 10;
            roundRect(0, 0, slot.w, slot.h, 14); ctx.stroke();
            ctx.shadowBlur = 0;
        }
        // 담긴 나사
        for (let k = 0; k < b.items.length; k++) {
            drawScrew(slot.w / 2 + (k - 1) * 22, slot.h / 2 + 6, b.items[k], 0.62, 0, false);
        }
        // 남은 칸 표시
        for (let k = b.items.length; k < BOX_CAP; k++) {
            ctx.fillStyle = 'rgba(255,255,255,.13)';
            ctx.beginPath();
            ctx.arc(slot.w / 2 + (k - 1) * 22, slot.h / 2 + 6, SCREW_R * 0.6, 0, 7);
            ctx.fill();
        }
        ctx.restore();
    });

    // 파티클
    G.parts.forEach(p => {
        ctx.globalAlpha = Math.max(0, p.life * 1.8);
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    });
    ctx.globalAlpha = 1;
}

// ───────── 루프 ─────────
function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    if (G && !G.over && !G.cleared) update(dt);
    else if (G) update(Math.min(dt, 0.03));
    draw();
    requestAnimationFrame(loop);
}

let level = sLoad('screwLevel', 1);
function startGame() {
    document.getElementById('startOv').classList.remove('show');
    document.getElementById('clearOv').classList.remove('show');
    document.getElementById('overOv').classList.remove('show');
    G = newGame(level);
    updateHud();
    running = true;
    lastT = performance.now();
    ac();
    requestAnimationFrame(loop);
}
function restart() { startGame(); }
function nextLevel() {
    level++;
    sSave('screwLevel', level);
    startGame();
}

cvs.addEventListener('pointerdown', e => {
    const r = cvs.getBoundingClientRect();
    onTap(e.clientX - r.left, e.clientY - r.top);
});

draw();
</script>
