name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - 'claude/**'
    paths:
      - 'index.html'
      - 'shooter.html'
      - 'shooter3d.html'
      - 'screw.html'
      - 'android/**'
      - 'scripts/prepare_apk_assets.sh'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 게임 파일을 앱에 복사
        run: bash scripts/prepare_apk_assets.sh

      - name: APK 빌드
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=1.0.${{ github.run_number }}

      - name: APK 이름 정리
        id: apk
        run: |
          NAME="sohyun-games-1.0.${{ github.run_number }}.apk"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$NAME"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: sohyun-games-apk
          path: ${{ steps.apk.outputs.name }}
          retention-days: 90

      - name: 릴리스로 발행 (폰에서 바로 다운로드용)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-v${{ github.run_number }}" "${{ steps.apk.outputs.name }}" \
            --title "소현이의 게임 v1.0.${{ github.run_number }}" \
            --notes "물약 퍼즐 · 좀비 다리 대전 2D · 좀비 다리 대전 3D 가 들어있는 안드로이드 앱입니다.

          설치 방법
          1. 아래 apk 파일을 폰에서 다운로드
          2. 파일을 눌러 설치 (출처를 알 수 없는 앱 설치 허용 필요)
          3. 홈 화면에서 '소현이의 게임' 실행

          디버그 서명 APK라 플레이스토어 배포용은 아니고, 직접 설치용입니다." \
            || gh release upload "apk-v${{ github.run_number }}" "${{ steps.apk.outputs.name }}" --clobber
