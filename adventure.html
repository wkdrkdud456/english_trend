    const sk = SKILLS.find(x => x.id === id);
    const cost = skBookCost(sk) * 3;
    if (G.gold < cost) { S.deny(); toast('💰 돈이 ' + (cost - G.gold).toLocaleString() + '원 모자라요'); return; }
    G.gold -= cost;
    G.learned[id] = true;
    G.sk[id] = Math.max(1, skLv(id));
    S.levelup();
    msg('📕', '새 기술 습득!', '<b>' + sk.n + '</b><br><span style="opacity:.75">' + sk.d + '</span><br><br>레벨 제한 없이 책으로 배웠어요!');
    syncHud(); save(); openShop();
}
function openBag() {
    if (scene !== 'world') return;
    S.open();
    const c = city();
    let h = '<div class="rd" style="margin:2px 0 8px;font-weight:900;opacity:.9">🧺 재료</div>';
    const keys = Object.keys(G.mats).filter(k => G.mats[k] > 0);
    if (!keys.length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">아직 모은 재료가 없어요. 반짝이는 걸 주우러 가요!</div>';
    keys.forEach(k => {
        let icon = '📦';
        for (const cc of CITIES) { const m = cc.mats.find(x => x.n === k); if (m) icon = m.i; }
        h += rowHtml(icon, k, '', G.mats[k] + '개');
    });
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">💊 아이템</div>';
    ITEMS.forEach(it => h += rowHtml(it.i, it.n, it.d, (G.items[it.id] || 0) + '개'));
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🏪 진열대</div>';
    const sk = Object.keys(G.stock).filter(k => G.stock[k] > 0);
    if (!sk.length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">진열대가 비었어요. 가게에서 요리해두면 알아서 팔려요.</div>';
    sk.forEach(k => h += rowHtml('🍽️', k, '', G.stock[k] + '개'));
    panelOpen('🎒 가방', '💰 ' + G.gold + '원 · 💗 편지 조각 ' + Object.keys(G.hearts).length + '/15', h);
}

function openMenu() {
    if (scene !== 'world') return;
    S.open();
    const f = formOf();
    let h = rowHtml(f.i, f.n + ' Lv' + G.lv, 'HP ' + G.hp + '/' + maxHp() + ' · 기력 ' + G.mp + '/' + maxMp() +
        '<br>공격 ' + Math.round(atkOf()) + ' · 방어 ' + Math.round(defOf()) + ' · 경험치 ' + G.exp + '/' + expNeed(), '');
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">⚔️ 배운 기술</div>';
    mySkills().forEach(s => h += rowHtml('✦', s.n, s.d, s.mp ? '기력 ' + s.mp : '기력 0'));
    const next = SKILLS.find(s => s.lv > G.lv);
    if (next) h += '<div class="rd" style="opacity:.55;padding:4px 2px">🔒 Lv' + next.lv + ' — ' + next.n + '</div>';
    if (G.unlock && G.unlock.stall) {
        h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🧺 이동식 가판대</div>';
        h += rowHtml('🧺', '여기서 가게 열기', '어디서든 요리하고 사고팔 수 있어요<br><span style="opacity:.6">(체력 회복은 진짜 가게에서만)</span>', '열기', 'openStall()');
    }
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🐾 펫 (' + (G.pets || []).length + '/' + Object.keys(PET_DB).length + ')</div>';
    if (!(G.pets || []).length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">' + (G.unlock && G.unlock.catch ? '전투에서 적 체력을 40% 밑으로 깎고 🪄 포획을 눌러보세요.' : '교토의 보스를 이기면 몬스터를 잡을 수 있게 돼요.') + '</div>';
    (G.pets || []).forEach(pt => {
        const db = PET_DB[pt.kind], on = G.pet === pt.kind;
        h += rowHtml(on ? '🐾' : '·', pt.n + ' <span style="opacity:.6;font-size:.8em">Lv' + pt.lv + (on ? ' · 데리고 다니는 중' : '') + '</span>',
            db ? db.d : '', on ? '✓' : '선택', 'setPet(\'' + pt.kind + '\')', false);
    });
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🐾 동료</div>';
    if (!G.animals.length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">보스를 이기면 그 도시의 동물 친구가 합류해요.</div>';
    CITIES.forEach(c => { if (G.animals.includes(c.animal.id)) h += rowHtml(c.animal.i, c.animal.n, c.animal.desc, c.icon); });
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">📜 편지 (' + letterCount() + '/15)</div>';
    if (!letterCount()) h += '<div class="rd" style="opacity:.6;padding:6px 2px">아직 한 조각도 못 찾았어요. 도시마다 세 개씩 숨어 있어요.</div>';
    for (let i = 0; i < 15; i++) {
        h += '<div class="rd" style="padding:3px 4px;' + (i < letterCount() ? 'color:#c04a60;font-weight:800' : 'opacity:.35') + '">' +
             (i < letterCount() ? STORY.letter[i] : (i + 1) + '. ????????') + '</div>';
    }
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">⚙️ 설정</div>';
    h += rowHtml(soundOn ? '🔊' : '🔇', '소리 ' + (soundOn ? '켜짐' : '꺼짐'), '탭해서 바꿔요', '', 'toggleSound()');
    h += rowHtml('🗑️', '처음부터 다시', '모든 진행이 사라져요', '', 'wipe()');
    panelOpen('☰ 메뉴', '💗 편지 조각 ' + Object.keys(G.hearts).length + '/15 · ⏱️ ' + Math.floor(G.playT / 60) + '분 플레이', h);
}
function toggleSound() { soundOn = !soundOn; sSave('dhAdvSound', soundOn); S.open(); openMenu(); }
function setPet(k) { G.pet = (G.pet === k ? null : k); petP = null; S.pick(); save(); openMenu(); }
let stallMode = false;
function openStall() { stallMode = true; closePanel(); openShop('cook'); }
function wipe() {
    closePanel();
    ask('🗑️', '처음부터 다시?', '모은 돈 · 레벨 · 업그레이드 · 편지 조각이<br><b>전부 사라집니다.</b>', '정말 지울래요',
        () => { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); });
}

function openPort() {
    const c = city(), done = !!G.boss[c.id];
    let h = '';
    if (!done) {
        h += '<div class="rd" style="opacity:.8;padding:4px 2px;line-height:1.7">✈️ 이 도시의 <b>라이벌 커플</b>을 이겨야 다음 도시 티켓을 팔아요.<br>' +
             c.icon + ' <b>' + c.name + '</b>의 랜드마크에서 <b>' + c.boss.wife + ' & ' + c.boss.n + '</b> 커플이 기다리고 있어요!</div>';
    }
    CITIES.forEach((cc, i) => {
        const unlocked = i === 0 || !!G.boss[CITIES[i - 1].id];
        const cur = i === G.cityIdx;
        const cost = i > G.cityIdx ? CITIES[G.cityIdx].ticket : 0;
        const can = unlocked && !cur && G.gold >= cost;
        h += rowHtml(cc.icon, cc.name + (cur ? ' <span style="opacity:.6;font-size:.8em">지금 여기</span>' : ''),
            unlocked ? (cur ? '' : '비행기표 ' + cost + '원') : '🔒 앞 도시의 보스를 먼저 이겨요',
            unlocked && !cur ? '출발' : '', can ? 'fly(' + i + ')' : '', !can);
    });
    panelOpen('✈️ 공항', '💰 ' + G.gold + '원', h);
}
function fly(i) {
    const cost = i > G.cityIdx ? CITIES[G.cityIdx].ticket : 0;
    if (G.gold < cost) { S.deny(); return; }
    G.gold -= cost;
    S.fly(); closePanel();
    enterCity(i);
    save();
    msg(CITIES[i].icon, CITIES[i].name + ' 도착!', '새로운 재료와 몬스터가 기다리고 있어요.<br>가게도 새로 열었습니다!');
}


// ───────── 떠돌이 상인 (비밀 상점) ─────────
const MERCH = [
    { id:'charm', i:'🔮', n:'포획 부적',   d:'포획 확률 +12%, 전설 몬스터 출현 +5% (영구)', c:8000 },
    { id:'ring',  i:'💍', n:'강화 반지',   d:'공격력 +8% (영구 · 살 때마다 누적)',          c:6000 },
    { id:'book',  i:'📗', n:'희귀 스킬북', d:'배운 기술 하나가 한 번에 +2 레벨',            c:9000 },
    { id:'feed',  i:'🍖', n:'펫 먹이',     d:'지금 데리고 다니는 펫의 레벨 +1',             c:5000 },
    { id:'egg',   i:'🥚', n:'수상한 알',   d:'랜덤 펫 한 마리 (이미 있으면 레벨업)',        c:20000 },
];
function merchCost(m) { return Math.round(m.c * (1 + G.cityIdx * 2.1)); }
function merchKey(m) { return city().id + '_' + m.id; }
function openMerch() {
    let h = '<div class="rd" style="margin:2px 0 10px;opacity:.8">"…조용히 하게. 이건 아무한테나 안 파는 거야."<br>도시마다 한 번씩만 살 수 있네.</div>';
    MERCH.forEach((m, i) => {
        const sold = G.merch[merchKey(m)];
        const cost = merchCost(m);
        h += rowHtml(sold ? '✅' : m.i, m.n + (sold ? ' <span style="opacity:.6;font-size:.8em">구매함</span>' : ''),
            m.d + (m.id === 'ring' && G.ringLv ? '<br><b>현재 +' + (G.ringLv * 8) + '%</b>' : ''),
            sold ? '—' : cost.toLocaleString() + '원',
            sold ? '' : 'buyMerch(' + i + ')', sold || G.gold < cost);
    });
    panelOpen('🏺 떠돌이 상인', '💰 ' + G.gold.toLocaleString() + '원', h);
}
function buyMerch(i) {
    const m = MERCH[i], cost = merchCost(m);
    if (G.merch[merchKey(m)]) { S.deny(); return; }
    if (G.gold < cost) { S.deny(); toast('💰 돈이 ' + (cost - G.gold).toLocaleString() + '원 모자라요'); return; }
    G.gold -= cost; G.merch[merchKey(m)] = true;
    S.levelup();
    if (m.id === 'charm') { G.charm = true; toast('🔮 포획 부적을 얻었다!'); }
    else if (m.id === 'ring') { G.ringLv = (G.ringLv || 0) + 1; toast('💍 공격력 +' + (G.ringLv * 8) + '%'); }
    else if (m.id === 'book') {
        const list = mySkills(); const sk = list[(Math.random() * list.length) | 0];
        G.sk[sk.id] = skLv(sk.id) + 2;
        msg('📗', '희귀 스킬북!', '<b>' + sk.n + '</b> 이(가) Lv' + G.sk[sk.id] + ' 가 됐어요!');
    } else if (m.id === 'feed') {
        const ap = (G.pets || []).find(x => x.kind === G.pet);
        if (!ap) { toast('데리고 다니는 펫이 없어요'); }
        else { ap.lv++; toast('🍖 ' + ap.n + ' Lv' + ap.lv + '!'); }
    } else {
        const kinds = Object.keys(PET_DB);
        const k = kinds[(Math.random() * kinds.length) | 0];
        const have = (G.pets || []).find(x => x.kind === k);
        if (have) { have.lv++; msg('🥚', '알이 부화했다!', '<b>' + have.n + '</b> 이(가) Lv' + have.lv + ' 가 됐어요!'); }
        else {
            const np = { kind:k, n: PET_DB[k].n, lv:1, legend:false };
            G.pets.push(np); if (!G.pet) G.pet = k;
            msg('🥚', '알이 부화했다!', '<b>' + np.n + '</b> 이(가) 동료가 됐어요!<br><span style="opacity:.75">' + PET_DB[k].d + '</span>');
        }
    }
    syncHud(); save(); openMerch();
}

// ───────── 공용 UI ─────────
let toastTimer = null;
function toast(s) {
    const t = document.getElementById('toast');
    t.innerHTML = s; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}
function msg(em, title, body) {
    document.getElementById('mEm').textContent = em;
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBody').innerHTML = body;
    document.getElementById('ovMsg').classList.add('show');
}
function closeMsg() { document.getElementById('ovMsg').classList.remove('show'); S.open(); }
// confirm()은 아티팩트 같은 샌드박스 환경에서 막히므로 직접 만든다
function ask(em, title, body, yesLabel, onYes) {
    document.getElementById('aEm').textContent = em;
    document.getElementById('aTitle').textContent = title;
    document.getElementById('aBody').innerHTML = body;
    const btn = document.getElementById('aYes');
    btn.textContent = yesLabel;
    btn.onclick = function () { closeAsk(); onYes(); };
    document.getElementById('ovAsk').classList.add('show');
    S.open();
}
function closeAsk() { document.getElementById('ovAsk').classList.remove('show'); }

function syncHud() {
    if (!G) return;
    document.getElementById('hGold').textContent = G.gold;
    document.getElementById('hForm').textContent = formOf().n + ' Lv' + G.lv;
    document.getElementById('bHp').style.width = Math.max(0, G.hp / maxHp() * 100) + '%';
    document.getElementById('bMp').style.width = Math.max(0, G.mp / maxMp() * 100) + '%';
    document.getElementById('bXp').style.width = Math.min(100, G.exp / expNeed() * 100) + '%';
}

// ───────── 저장 / 시작 ─────────
function save() { if (G) sSave(SAVE_KEY, G); }
let saveT = 0;

function startGame() {
    G = newGame();
    document.getElementById('ovStart').classList.remove('show');
    enterCity(0);
    scene = 'world'; running = true; lastT = performance.now();
    ac(); save();
    requestAnimationFrame(loop);
    startCut(STORY.prologue.em, STORY.prologue.lines, () => toast('🕹️ 화면을 눌러서 밀면 걸어가요!'));
}
function continueGame() {
    const s = sLoad(SAVE_KEY, null);
    if (!s) return startGame();
    G = Object.assign(newGame(), s);
    document.getElementById('ovStart').classList.remove('show');
    enterCity(G.cityIdx, true);
    P.x = G.px || P.x; P.y = G.py || P.y;
    scene = 'world'; running = true; lastT = performance.now();
    ac();
    requestAnimationFrame(loop);
}

// ───────── 메인 루프 ─────────
function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts; gameT += dt;
    if (CUT) { cutTick(dt); requestAnimationFrame(loop); return; }
    if (scene === 'world') {
        if (TK) {
            const full = TK.npc.lines[TK.i];
            if (TK.ch < full.length) TK.ch = Math.min(full.length, TK.ch + dt * 42);
            updatePops(dt);
            document.getElementById('acts').style.display = 'none';
        } else updateWorld(dt);
        drawWorld();
        if (TK) drawTalkBox();
    }
    else if (scene === 'battle') { updateBattle(dt); if (B) drawBattle(); }
    saveT += dt;
    if (saveT > 6) { saveT = 0; save(); }
    requestAnimationFrame(loop);
}

// 이어하기 버튼은 저장이 있을 때만
if (sLoad(SAVE_KEY, null)) document.getElementById('btnContinue').style.display = '';
</script>
