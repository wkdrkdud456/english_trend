<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>소현이의 토끼 슈팅 3D 🐰</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            background: #1a0b3d;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #gameWrap { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }

        .hud {
            position: fixed;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }
        .hud-box {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            padding: 6px 14px;
            color: #fff;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .hud-box .label { font-size: 0.62em; opacity: 0.8; }
        .hud-box .value { font-size: 1.15em; font-weight: 800; }
        #soundBtn {
            pointer-events: auto;
            cursor: pointer;
            font-size: 1.2em;
            padding: 8px 12px;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 6, 40, 0.82);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .overlay.show { display: flex; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card {
            background: linear-gradient(160deg, #fff5fa, #ffe8f0);
            border-radius: 28px;
            padding: 36px 34px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 20px;
            max-width: 340px;
        }
        @keyframes popIn {
            0% { transform: scale(0.6); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .card .emoji { font-size: 3em; margin-bottom: 8px; }
        .card h1 { color: #d6336c; font-size: 1.5em; margin-bottom: 4px; }
        .card h2 { color: #d6336c; font-size: 1.4em; margin-bottom: 8px; }
        .card .sub { color: #b3688a; font-size: 0.85em; font-weight: 700; margin-bottom: 14px; }
        .card p { color: #9b6b80; font-size: 0.92em; line-height: 1.65; margin-bottom: 8px; }
        .card .rule {
            background: rgba(248, 87, 166, 0.08);
            border-radius: 14px;
            padding: 12px 14px;
            text-align: left;
            font-size: 0.88em;
            color: #85566b;
            line-height: 1.7;
            margin-bottom: 16px;
        }
        .card .score-big { font-size: 2em; font-weight: 900; color: #d6336c; margin: 6px 0; }
        .btn {
            border: none;
            border-radius: 16px;
            padding: 15px 38px;
            font-size: 1.1em;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: linear-gradient(135deg, #f857a6, #ff5858);
            box-shadow: 0 6px 16px rgba(248, 87, 166, 0.4);
            transition: transform 0.15s;
        }
        .btn:active { transform: scale(0.93); }
    </style>
</head>
<body>
    <div id="gameWrap"><canvas id="cvs"></canvas></div>

    <div class="hud">
        <div class="hud-box"><div class="label">점수</div><div class="value" id="score">0</div></div>
        <div class="hud-box"><div class="label">🐰 부대</div><div class="value" id="units">3</div></div>
        <div class="hud-box"><div class="label">최고점수</div><div class="value" id="best">0</div></div>
        <div class="hud-box" id="soundBtn" onclick="toggleSound()">🔊</div>
    </div>

    <div class="overlay show" id="startOverlay">
        <div class="card">
            <div class="emoji">🐰🥕</div>
            <h1>소현이의 토끼 슈팅 3D</h1>
            <div class="sub">by 동훈 ❤️</div>
            <div class="rule">
                🖐️ <b>좌우로 드래그</b>하면 부대가 따라와요<br>
                🥕 당근은 <b>자동 발사!</b><br>
                🔵 <b>파란 게이트</b> = 토끼 증가·파워업 😍<br>
                🔴 <b>빨간 게이트</b> = 토끼 감소 😱<br>
                👾 저 멀리서 떼로 몰려오는 몬스터를 쓸어버리세요!<br>
                💀 토끼가 다 없어지면 게임 오버!
            </div>
            <button class="btn" onclick="startGame()">🎮 시작!</button>
        </div>
    </div>

    <div class="overlay" id="overOverlay">
        <div class="card">
            <div class="emoji">😵🐰</div>
            <h2>게임 오버!</h2>
            <p>토끼 부대가 전멸했어요...</p>
            <div class="score-big" id="finalScore">0점</div>
            <p id="bestMsg"></p>
            <button class="btn" onclick="startGame()">🔄 다시 도전!</button>
        </div>
    </div>

    <script>
        // ── 저장 & 사운드 ──────────────────────
        function safeLoad(key, def) {
            try { const v = localStorage.getItem(key); return v === null ? def : JSON.parse(v); }
            catch (e) { return def; }
        }
        function safeSave(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
        }

        let audioCtx = null;
        let soundOn = safeLoad('shooterSound', true);
        function actx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function tone(freq, dur, opts) {
            if (!soundOn) return;
            const ac = actx(); if (!ac) return;
            opts = opts || {};
            const t0 = ac.currentTime + (opts.delay || 0);
            const o = ac.createOscillator();
            const gg = ac.createGain();
            o.type = opts.type || 'sine';
            o.frequency.setValueAtTime(freq, t0);
            if (opts.slideTo) o.frequency.exponentialRampToValueAtTime(opts.slideTo, t0 + dur);
            const vol = opts.vol || 0.1;
            gg.gain.setValueAtTime(0, t0);
            gg.gain.linearRampToValueAtTime(vol, t0 + 0.01);
            gg.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
            o.connect(gg); gg.connect(ac.destination);
            o.start(t0); o.stop(t0 + dur + 0.05);
        }
        const S = {
            shoot() { tone(880, 0.035, { type: 'triangle', vol: 0.02 }); },
            pop(combo) {  // 연속 처치할수록 소리가 높아짐 = 쾌감!
                const f = Math.min(1200, 320 + combo * 45);
                tone(f, 0.09, { slideTo: f * 1.8, type: 'triangle', vol: 0.09 });
            },
            good() { tone(660, 0.1, { type: 'triangle', vol: 0.14 }); tone(990, 0.14, { delay: 0.08, type: 'triangle', vol: 0.12 }); },
            bad() { tone(220, 0.18, { slideTo: 140, type: 'square', vol: 0.08 }); },
            hurt() { tone(160, 0.2, { type: 'square', vol: 0.1 }); },
            boss() { tone(110, 0.4, { type: 'sawtooth', vol: 0.09 }); tone(98, 0.4, { delay: 0.3, type: 'sawtooth', vol: 0.09 }); },
            over() {
                tone(392, 0.3, { type: 'triangle', vol: 0.14 });
                tone(330, 0.3, { delay: 0.28, type: 'triangle', vol: 0.14 });
                tone(262, 0.55, { delay: 0.56, type: 'triangle', vol: 0.15 });
            }
        };
        function toggleSound() {
            soundOn = !soundOn;
            safeSave('shooterSound', soundOn);
            document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
            if (soundOn) S.good();
        }
        document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';

        // ── 캔버스 & 3D 투영 ─────────────────────
        const cvs = document.getElementById('cvs');
        const ctx = cvs.getContext('2d');
        let W = 0, H = 0, DPR = 1;
        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = window.innerWidth;
            H = window.innerHeight;
            cvs.width = W * DPR;
            cvs.height = H * DPR;
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        window.addEventListener('resize', resize);
        resize();

        // 원근 투영: 세계 좌표 (wx: -1~1 좌우, z: 0 플레이어 앞 ~ 1 지평선)
        const horizonY = () => H * 0.30;
        const playerY = () => H - 150;
        const halfW = () => W * 0.55;
        function proj(wx, z) {
            const s = 1 / (1 + z * 3.4);           // 원근 스케일
            return {
                x: W / 2 + wx * halfW() * s,
                y: horizonY() + (playerY() - horizonY()) * s,
                s
            };
        }

        // 하늘 별
        const skyStars = [];
        for (let i = 0; i < 45; i++) {
            skyStars.push({ x: Math.random(), y: Math.random(), r: 0.5 + Math.random() * 1.4, tw: Math.random() * 6 });
        }

        // ── 게임 상태 ──────────────────────────
        let best = safeLoad('shooterBest', 0);
        document.getElementById('best').textContent = best;

        let g = null;
        let running = false;
        let lastTime = 0;

        const UNIT_CAP = 50;
        const VIS_CAP = 28;
        const SQUAD_MAXX = 0.86;

        function newGame() {
            return {
                t: 0, dist: 0,
                wx: 0, targetWx: 0,          // 부대 세계 x
                units: 3, dots: [],
                fireInt: 0.32, fireTimer: 0,
                bulletSpd: 2.1, dmg: 1,      // z단위/초
                bullets: [], enemies: [], gates: [], floats: [], parts: [], ghosts: [], pend: [],
                score: 0, scoreFrac: 0,
                waveT: 1.0, gateT: 2.2, bossT: 26,
                combo: 0, comboT: 0,
                shake: 0,
                over: false
            };
        }

        // 부대 대형 (세계 좌표 오프셋: wx 좌우, z 깊이)
        function unitOffsets(n) {
            const offs = [];
            const perRow = 7;
            const vis = Math.min(n, VIS_CAP);
            for (let i = 0; i < vis; i++) {
                const row = Math.floor(i / perRow);
                const total = Math.min(vis - row * perRow, perRow);
                const col = i % perRow;
                offs.push({ wx: (col - (total - 1) / 2) * 0.085, z: row * 0.05 });
            }
            return offs;
        }

        function syncDots(dt) {
            const vis = Math.min(g.units, VIS_CAP);
            while (g.dots.length < vis) {
                g.dots.push({ x: W / 2, y: playerY() + 60, ph: Math.random() * 6 });
            }
            if (g.dots.length > vis) g.dots.length = vis;
            const offs = unitOffsets(g.units);
            const k = Math.min(1, dt * 9);
            g.dots.forEach((d, i) => {
                const p = proj(g.wx + offs[i].wx, offs[i].z);
                d.x += (p.x - d.x) * k;
                d.y += (p.y - d.y) * k;
                d.s = p.s;
                d.wx = g.wx + offs[i].wx;
                d.z = offs[i].z;
            });
        }

        // ── 게이트 (저 멀리서 다가옴) ─────────────
        function spawnGatePair() {
            const goodPool = [
                () => ({ type: 'add', val: 2 + Math.floor(Math.random() * 3), label: '', color: 'blue' }),
                () => ({ type: 'mul', val: 2, label: '×2 토끼!', color: 'blue' }),
                () => ({ type: 'rapid', val: 0, label: '🥕 연사 UP', color: 'blue' }),
                () => ({ type: 'dmg', val: 1, label: '🥕 파워 UP', color: 'blue' }),
            ];
            const makeGood = () => {
                const e = goodPool[Math.floor(Math.random() * goodPool.length)]();
                if (e.type === 'add') e.label = '+' + e.val + ' 토끼';
                return e;
            };
            const makeBad = () => {
                const v = 2 + Math.floor(Math.random() * 5);
                return { type: 'sub', val: v, label: '-' + v + ' 토끼', color: 'red' };
            };
            let a, b;
            if (Math.random() < 0.65) { a = makeGood(); b = makeBad(); }
            else { a = makeGood(); b = makeGood(); }
            if (Math.random() < 0.5) [a, b] = [b, a];
            const spd = 0.22 + g.t * 0.0018;
            g.gates.push({ ...a, wx0: -0.95, wx1: -0.05, z: 1.15, spd, used: false });
            g.gates.push({ ...b, wx0: 0.05, wx1: 0.95, z: 1.15, spd, used: false });
        }

        function applyGate(gate) {
            gate.used = true;
            const p = proj((gate.wx0 + gate.wx1) / 2, 0.05);
            if (gate.type === 'add') {
                g.units = Math.min(UNIT_CAP, g.units + gate.val);
                S.good(); addFloat(p.x, p.y - 60, '+' + gate.val + ' 🐰', '#4dd0ff');
            } else if (gate.type === 'mul') {
                g.units = Math.min(UNIT_CAP, g.units * 2);
                S.good(); addFloat(p.x, p.y - 60, '×2 🐰🐰', '#4dd0ff');
            } else if (gate.type === 'rapid') {
                g.fireInt = Math.max(0.12, g.fireInt - 0.05);
                S.good(); addFloat(p.x, p.y - 60, '연사 UP! 🥕', '#4dd0ff');
            } else if (gate.type === 'dmg') {
                g.dmg += 1;
                S.good(); addFloat(p.x, p.y - 60, '파워 UP! 💥', '#4dd0ff');
            } else if (gate.type === 'sub') {
                g.units -= gate.val;
                S.bad(); addFloat(p.x, p.y - 60, '-' + gate.val + ' 😱', '#ff6b81');
                g.shake = 0.25;
                if (g.units <= 0) gameOver();
            }
            updateHud();
        }

        // ── 적 웨이브 (지평선에서 우르르!) ─────────
        function enemyStat(mult) {
            return Math.max(1, Math.round((1 + g.t / 20) * (mult || 1)));
        }
        function queueEnemy(delay, wx, z, opts) {
            g.pend.push({ d: delay, wx, z, ...opts });
        }
        function spawnWave() {
            const patterns = ['line', 'v', 'blob', 'stream', 'double'];
            const p = patterns[Math.floor(Math.random() * patterns.length)];
            const spd = 0.14 + g.t * 0.0016;   // z단위/초

            if (p === 'line') {                 // 가로 일렬 8~10마리
                const n = 8 + Math.floor(Math.random() * 3);
                for (let i = 0; i < n; i++) {
                    const wx = -0.8 + 1.6 * (i / (n - 1));
                    queueEnemy(i * 0.06, wx, 1.05 + Math.random() * 0.1, { hp: enemyStat(0.8), spd, emoji: '👾', rpx: 15 });
                }
            } else if (p === 'v') {             // V자 대형 9마리
                const cx = (Math.random() - 0.5) * 1.0;
                for (let i = 0; i < 9; i++) {
                    const side = i % 2 === 0 ? 1 : -1;
                    const rank = Math.ceil(i / 2);
                    queueEnemy(rank * 0.12, cx + side * rank * 0.14, 1.05 + rank * 0.09, { hp: enemyStat(1), spd, emoji: '👾', rpx: 15 });
                }
            } else if (p === 'blob') {          // 뭉탱이 10~14마리
                const cx = (Math.random() - 0.5) * 1.1;
                const n = 10 + Math.floor(Math.random() * 5);
                for (let i = 0; i < n; i++) {
                    const a = Math.random() * Math.PI * 2;
                    const r = Math.random() * 0.26;
                    queueEnemy(Math.random() * 0.4, cx + Math.cos(a) * r, 1.05 + Math.abs(Math.sin(a)) * 0.15, { hp: enemyStat(0.7), spd: spd * 1.05, emoji: '🧟', rpx: 14 });
                }
            } else if (p === 'stream') {        // 한 줄기 돌격 10마리 (플레이어 추적!)
                const wx = (Math.random() - 0.5) * 1.4;
                for (let i = 0; i < 10; i++) {
                    queueEnemy(i * 0.15, wx + (Math.random() - 0.5) * 0.1, 1.05, { hp: enemyStat(0.7), spd: spd * 1.3, emoji: '💀', rpx: 13, chase: true });
                }
            } else {                            // 양쪽 협공
                for (let i = 0; i < 6; i++) {
                    queueEnemy(i * 0.1, -0.75 + Math.random() * 0.2, 1.05 + i * 0.07, { hp: enemyStat(0.8), spd, emoji: '👾', rpx: 15 });
                    queueEnemy(i * 0.1, 0.75 - Math.random() * 0.2, 1.05 + i * 0.07, { hp: enemyStat(0.8), spd, emoji: '👾', rpx: 15 });
                }
            }
            if (g.t > 20 && Math.random() < 0.4) {   // 탱커
                queueEnemy(0.5, (Math.random() - 0.5) * 1.4, 1.1, { hp: enemyStat(4), spd: spd * 0.55, emoji: '🧟', rpx: 22 });
            }
        }

        function spawnBoss() {
            const hp = Math.round(45 + g.t * 2);
            g.enemies.push({
                wx: 0, z: 1.2, rpx: 36,
                hp, hp0: hp,
                spd: 0.075 + g.t * 0.0004,
                emoji: '👹', boss: true, wob: Math.random() * 6, hitT: 0, scale: 0
            });
            S.boss();
            addFloat(W / 2, horizonY() + 40, '👹 보스 등장!!', '#ffd43b');
        }

        function addFloat(x, y, txt, color) {
            g.floats.push({ x, y, txt, color, life: 1 });
        }
        function addParts(x, y, color, n, sc) {
            for (let i = 0; i < n; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = (40 + Math.random() * 140) * (sc || 1);
                g.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, color, r: (2 + Math.random() * 2.5) * (sc || 1) });
            }
        }

        // ── 진행 ────────────────────────────────
        function update(dt) {
            g.t += dt;
            g.dist += dt * 0.5;

            // 부대 이동: 부드러운 추적 (순간이동 금지)
            {
                const dx = g.targetWx - g.wx;
                const maxStep = 1.7 * dt;   // 최고 속도
                const step = Math.abs(dx) < 0.01 ? dx : Math.sign(dx) * Math.min(Math.abs(dx) * Math.min(1, dt * 8), maxStep);
                g.wx += step;
            }
            syncDots(dt);

            // 발사
            g.fireTimer -= dt;
            if (g.fireTimer <= 0) {
                g.fireTimer = g.fireInt;
                const emitters = g.dots.slice(0, Math.min(g.dots.length, 24));
                emitters.forEach(d => {
                    g.bullets.push({ wx: d.wx, z: d.z + 0.03, spd: g.bulletSpd });
                });
                S.shoot();
            }
            for (let i = g.bullets.length - 1; i >= 0; i--) {
                const b = g.bullets[i];
                b.z += b.spd * dt;
                if (b.z > 1.25) g.bullets.splice(i, 1);
            }

            // 게이트
            g.gateT -= dt;
            if (g.gateT <= 0) {
                g.gateT = Math.max(3.4, 6 - g.t * 0.03);
                spawnGatePair();
            }
            for (let i = g.gates.length - 1; i >= 0; i--) {
                const gt = g.gates[i];
                gt.z -= gt.spd * dt;
                if (!gt.used && gt.z <= 0.05 && gt.z > -0.1) {
                    if (g.wx >= gt.wx0 && g.wx <= gt.wx1) applyGate(gt);
                }
                if (gt.z < -0.15) g.gates.splice(i, 1);
            }

            // 웨이브
            g.waveT -= dt;
            if (g.waveT <= 0) {
                g.waveT = Math.max(1.6, 3.6 - g.t * 0.025);
                spawnWave();
            }
            g.bossT -= dt;
            if (g.bossT <= 0) { g.bossT = 28; spawnBoss(); }

            for (let i = g.pend.length - 1; i >= 0; i--) {
                const p = g.pend[i];
                p.d -= dt;
                if (p.d <= 0) {
                    g.enemies.push({
                        wx: p.wx, z: p.z, rpx: p.rpx,
                        hp: p.hp, hp0: p.hp,
                        spd: p.spd, emoji: p.emoji, chase: p.chase,
                        boss: false, wob: Math.random() * 6, hitT: 0, scale: 0
                    });
                    g.pend.splice(i, 1);
                }
            }

            g.comboT -= dt;
            if (g.comboT <= 0) g.combo = 0;

            // 적 이동 & 충돌
            const clusterHalf = Math.min(g.units, 7) * 0.085 / 2 + 0.07;
            for (let i = g.enemies.length - 1; i >= 0; i--) {
                const e = g.enemies[i];
                e.scale = Math.min(1, e.scale + dt * 5);
                e.z -= e.spd * dt;
                e.wx += Math.sin(g.t * 2.2 + e.wob) * 0.06 * dt;
                if (e.chase) e.wx += (g.wx - e.wx) * 0.5 * dt;   // 추적형
                e.hitT = Math.max(0, e.hitT - dt);

                const erw = e.rpx / halfW() * 2.6;   // 세계단위 반경
                for (let j = g.bullets.length - 1; j >= 0; j--) {
                    const b = g.bullets[j];
                    if (Math.abs(b.z - e.z) < 0.06 && Math.abs(b.wx - e.wx) < erw) {
                        g.bullets.splice(j, 1);
                        e.hp -= g.dmg;
                        e.hitT = 0.08;
                        if (e.hp <= 0) break;
                    }
                }
                if (e.hp <= 0) {
                    g.combo++; g.comboT = 1.1;
                    g.score += e.hp0 * 10 + g.combo;
                    const p = proj(e.wx, Math.max(0, e.z));
                    addParts(p.x, p.y, e.boss ? '#ffd43b' : '#ff8fab', e.boss ? 30 : 8, Math.max(0.5, p.s));
                    g.ghosts.push({ x: p.x, y: p.y, emoji: e.emoji, size: e.rpx * 2 * p.s, life: 0.28 });
                    if (e.boss) {
                        addFloat(p.x, p.y, '보스 처치! +🐰3', '#ffd43b');
                        g.units = Math.min(UNIT_CAP, g.units + 3);
                    } else if (g.combo > 0 && g.combo % 10 === 0) {
                        addFloat(p.x, p.y, g.combo + ' 콤보!! 🔥', '#ffd43b');
                    }
                    g.enemies.splice(i, 1);
                    S.pop(g.combo);
                    updateHud();
                    continue;
                }

                // 부대에 도달
                if (e.z <= 0.03) {
                    if (Math.abs(e.wx - g.wx) < clusterHalf + erw) {
                        g.units -= e.boss ? 8 : 1;
                        g.shake = e.boss ? 0.5 : 0.22;
                        const p = proj(e.wx, 0);
                        addParts(p.x, p.y, '#ff6b81', 12, 1);
                        g.enemies.splice(i, 1);
                        S.hurt();
                        updateHud();
                        if (g.units <= 0) { gameOver(); return; }
                        continue;
                    } else if (e.z < -0.08) {   // 옆으로 지나감
                        g.enemies.splice(i, 1);
                        continue;
                    }
                }
            }

            // 버티기 점수
            g.scoreFrac += dt * 10;
            if (g.scoreFrac >= 1) {
                const add = Math.floor(g.scoreFrac);
                g.score += add;
                g.scoreFrac -= add;
            }

            // 이펙트
            for (let i = g.floats.length - 1; i >= 0; i--) {
                const f = g.floats[i];
                f.y -= 45 * dt; f.life -= dt * 0.8;
                if (f.life <= 0) g.floats.splice(i, 1);
            }
            for (let i = g.parts.length - 1; i >= 0; i--) {
                const p = g.parts[i];
                p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
                if (p.life <= 0) g.parts.splice(i, 1);
            }
            for (let i = g.ghosts.length - 1; i >= 0; i--) {
                g.ghosts[i].life -= dt;
                if (g.ghosts[i].life <= 0) g.ghosts.splice(i, 1);
            }
            g.shake = Math.max(0, g.shake - dt);

            updateHud();
        }

        function updateHud() {
            document.getElementById('score').textContent = g.score;
            document.getElementById('units').textContent = g.units;
        }

        // ── 그리기 (3D 원근!) ────────────────────
        function draw() {
            const hy = horizonY();
            const t = g ? g.t : 0;
            const dist = g ? g.dist : 0;

            // 하늘
            const sky = ctx.createLinearGradient(0, 0, 0, hy);
            sky.addColorStop(0, '#150833');
            sky.addColorStop(1, '#3d1d70');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, hy);

            // 별
            skyStars.forEach(s => {
                ctx.globalAlpha = 0.4 + Math.sin(t * 2 + s.tw) * 0.3;
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x * W, s.y * hy * 0.95, s.r, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 지평선 글로우
            const glow = ctx.createLinearGradient(0, hy - 40, 0, hy + 30);
            glow.addColorStop(0, 'rgba(255, 105, 180, 0)');
            glow.addColorStop(0.55, 'rgba(255, 105, 180, 0.35)');
            glow.addColorStop(1, 'rgba(255, 105, 180, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, hy - 40, W, 70);

            // 바닥
            const ground = ctx.createLinearGradient(0, hy, 0, H);
            ground.addColorStop(0, '#3b1d6e');
            ground.addColorStop(1, '#6b3fa8');
            ctx.fillStyle = ground;
            ctx.fillRect(0, hy, W, H - hy);

            // 바닥 격자 (달려가는 느낌)
            const sp = 0.13;
            ctx.lineWidth = 1.5;
            for (let i = 0; i < 14; i++) {
                const z = i * sp + (sp - (dist % sp));
                if (z > 1.3) break;
                const pl = proj(-1.15, z), pr = proj(1.15, z);
                ctx.strokeStyle = `rgba(255, 160, 220, ${0.28 * pl.s})`;
                ctx.beginPath();
                ctx.moveTo(pl.x, pl.y);
                ctx.lineTo(pr.x, pr.y);
                ctx.stroke();
            }
            for (let wx = -1; wx <= 1.01; wx += 0.25) {
                const p0 = proj(wx * 1.15, 0), p1 = proj(wx * 1.15, 1.3);
                ctx.strokeStyle = 'rgba(255, 160, 220, 0.12)';
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                ctx.lineTo(p1.x, p1.y);
                ctx.stroke();
            }

            if (!g) return;

            let ox = 0, oy = 0;
            if (g.shake > 0) {
                ox = (Math.random() - 0.5) * 12 * g.shake;
                oy = (Math.random() - 0.5) * 12 * g.shake;
            }
            ctx.save();
            ctx.translate(ox, oy);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // 게이트 (멀리서 다가오는 포탈)
            g.gates.forEach(gt => {
                if (gt.used || gt.z < 0) return;
                const pl = proj(gt.wx0, gt.z), pr = proj(gt.wx1, gt.z);
                const gh = 64 * pl.s;
                const blue = gt.color === 'blue';
                const pulse = 0.7 + Math.sin(t * 5) * 0.3;
                ctx.fillStyle = blue ? 'rgba(70, 160, 255, 0.3)' : 'rgba(255, 70, 100, 0.3)';
                ctx.strokeStyle = blue ? `rgba(130, 205, 255, ${pulse})` : `rgba(255, 130, 150, ${pulse})`;
                ctx.lineWidth = Math.max(1.5, 3 * pl.s);
                ctx.shadowColor = blue ? 'rgba(80,180,255,0.8)' : 'rgba(255,80,110,0.8)';
                ctx.shadowBlur = 16 * pl.s * pulse;
                roundRect(pl.x, pl.y - gh, pr.x - pl.x, gh, 10 * pl.s);
                ctx.fill(); ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                const fs = Math.max(9, Math.round(17 * pl.s * 1.4));
                ctx.font = '800 ' + fs + 'px sans-serif';
                ctx.fillText(gt.label, (pl.x + pr.x) / 2, pl.y - gh / 2);
            });

            // 적 (멀리서 → 가까이, 깊이순 정렬)
            const sorted = [...g.enemies].sort((a, b) => b.z - a.z);
            sorted.forEach(e => {
                const p = proj(e.wx, Math.max(0, e.z));
                const sc = (e.scale < 1 ? 0.3 + e.scale * 0.7 : 1);
                const bob = 1 + Math.sin(t * 8 + e.wob) * 0.05;
                const size = Math.max(7, e.rpx * 2.6 * p.s * sc * bob);
                // 그림자
                ctx.fillStyle = `rgba(0,0,0,${0.3 * p.s})`;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y + size * 0.42, size * 0.4, size * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
                if (e.hitT > 0) ctx.globalAlpha = 0.55;
                ctx.font = Math.round(size) + 'px sans-serif';
                ctx.fillText(e.emoji, p.x, p.y);
                ctx.globalAlpha = 1;
                if (e.hp < e.hp0) {
                    const bw = size;
                    ctx.fillStyle = 'rgba(0,0,0,0.4)';
                    roundRect(p.x - bw / 2, p.y - size * 0.62 - 6, bw, 4, 2); ctx.fill();
                    ctx.fillStyle = e.boss ? '#ffd43b' : '#69db7c';
                    roundRect(p.x - bw / 2, p.y - size * 0.62 - 6, bw * Math.max(0, e.hp / e.hp0), 4, 2); ctx.fill();
                }
            });

            // 총알 (깊이감 있게 작아지며 날아감)
            g.bullets.forEach(b => {
                const p = proj(b.wx, b.z);
                const r = Math.max(1.5, 4 * p.s);
                ctx.fillStyle = `rgba(255,169,77,${0.35 * p.s + 0.2})`;
                ctx.beginPath(); ctx.arc(p.x, p.y + r * 2, r * 1.8, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ffc078';
                ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
            });

            // 죽는 연출 (커지며 사라짐)
            g.ghosts.forEach(gh => {
                const pr2 = 1 - gh.life / 0.28;
                ctx.globalAlpha = gh.life / 0.28;
                ctx.font = Math.round(gh.size * (1 + pr2 * 0.7)) + 'px sans-serif';
                ctx.fillText(gh.emoji, gh.x, gh.y);
            });
            ctx.globalAlpha = 1;

            // 토끼 부대 (뒤쪽 줄은 작게 = 깊이감)
            g.dots.forEach(d => {
                const hop = Math.abs(Math.sin(t * 7 + d.ph)) * 3.5;
                const size = 20 * (d.s || 1);
                ctx.fillStyle = 'rgba(0,0,0,0.28)';
                ctx.beginPath();
                ctx.ellipse(d.x, d.y + size * 0.42, size * 0.36, size * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = Math.round(size) + 'px sans-serif';
                ctx.fillText('🐰', d.x, d.y - hop);
            });
            if (g.units > VIS_CAP) {
                ctx.fillStyle = '#ffd6e8';
                ctx.font = '800 13px sans-serif';
                ctx.fillText('×' + g.units, W / 2 + g.wx * halfW() * 0.8, playerY() + 46);
            }

            // 파티클
            g.parts.forEach(p => {
                ctx.globalAlpha = Math.max(0, p.life * 2.2);
                ctx.fillStyle = p.color;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1;

            // 플로팅 텍스트
            g.floats.forEach(f => {
                ctx.globalAlpha = Math.max(0, f.life);
                ctx.fillStyle = f.color;
                ctx.font = '800 19px sans-serif';
                ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 4;
                ctx.fillText(f.txt, f.x, f.y);
                ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1;

            ctx.restore();
        }

        function roundRect(x, y, w, h, r) {
            r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
        }

        // ── 루프 ────────────────────────────────
        function loop(ts) {
            if (!running) return;
            const dt = Math.min(0.05, (ts - lastTime) / 1000);
            lastTime = ts;
            if (g && !g.over) update(dt);
            draw();
            requestAnimationFrame(loop);
        }

        function startGame() {
            document.getElementById('startOverlay').classList.remove('show');
            document.getElementById('overOverlay').classList.remove('show');
            g = newGame();
            updateHud();
            running = true;
            lastTime = performance.now();
            actx();
            requestAnimationFrame(loop);
        }

        function gameOver() {
            if (g.over) return;
            g.over = true;
            S.over();
            const isBest = g.score > best;
            if (isBest) { best = g.score; safeSave('shooterBest', best); }
            document.getElementById('best').textContent = best;
            document.getElementById('finalScore').textContent = g.score + '점';
            document.getElementById('bestMsg').textContent = isBest
                ? '🏆 신기록 달성! 소현이 최고!!'
                : '최고 기록: ' + best + '점 — 소현이라면 깰 수 있어!';
            setTimeout(() => {
                document.getElementById('overOverlay').classList.add('show');
                running = false;
                draw();
            }, 600);
        }

        // ── 조작: 부드러운 추적 이동 ──────────────
        let dragging = false;
        let keyDir = 0;
        cvs.addEventListener('pointerdown', e => { dragging = true; setTarget(e.clientX); });
        window.addEventListener('pointermove', e => { if (dragging) setTarget(e.clientX); });
        window.addEventListener('pointerup', () => { dragging = false; });
        function setTarget(x) {
            if (g && !g.over) {
                const wx = (x - W / 2) / (halfW() * 0.95);
                g.targetWx = Math.max(-SQUAD_MAXX, Math.min(SQUAD_MAXX, wx));
            }
        }
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') keyDir = -1;
            if (e.key === 'ArrowRight') keyDir = 1;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' && keyDir === -1) keyDir = 0;
            if (e.key === 'ArrowRight' && keyDir === 1) keyDir = 0;
        });
        setInterval(() => {
            if (g && !g.over && keyDir !== 0) {
                g.targetWx = Math.max(-SQUAD_MAXX, Math.min(SQUAD_MAXX, g.targetWx + keyDir * 0.045));
            }
        }, 16);

        draw();
    </script>
</body>
</html>
