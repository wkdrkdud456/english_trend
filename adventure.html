<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>가라! 동훈! — 소현이의 세계여행 🌍</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
        font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
        background:#10172e; color:#fff;
        user-select:none; -webkit-user-select:none; touch-action:none;
    }
    canvas { display:block; position:fixed; top:0; left:0; touch-action:none; }

    /* ───── 상단 HUD ───── */
    .hud {
        position:fixed; top:8px; left:8px; right:8px; z-index:10;
        display:flex; gap:6px; align-items:flex-start; pointer-events:none;
    }
    .chip {
        background:#fff8ef; border:2px solid #e8597a; color:#6b4030;
        border-radius:15px; padding:5px 11px; font-size:.72em; font-weight:800;
        white-space:nowrap; box-shadow:0 3px 0 rgba(160,90,110,.28);
    }
    .chip .s { display:block; font-size:.78em; opacity:.65; font-weight:700; }
    .chip.tap { pointer-events:auto; cursor:pointer; }
    .spacer { flex:1; }

    /* 체력/경험치 바 */
    .bars { position:fixed; top:46px; left:8px; z-index:10; width:132px; pointer-events:none; }
    .bar { height:9px; border-radius:5px; background:#fff8ef; overflow:hidden; margin-bottom:3px;
           border:2px solid rgba(107,64,48,.35); box-shadow:0 2px 0 rgba(160,90,110,.2); }
    .bar > i { display:block; height:100%; border-radius:3px; transition:width .25s; }
    .bar.hp > i { background:linear-gradient(90deg,#ff5c7a,#ff9770); }
    .bar.mp > i { background:linear-gradient(90deg,#4dabf7,#74f0d0); }
    .bar.xp > i { background:linear-gradient(90deg,#ffd43b,#ffa94d); }

    /* ───── 하단 액션 버튼 ───── */
    .acts { position:fixed; right:12px; bottom:22px; z-index:12; display:flex; flex-direction:column; gap:10px; }
    .act {
        width:60px; height:60px; border-radius:50%; cursor:pointer; color:#6b4030;
        background:#fff8ef; border:3px solid #e8597a;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        box-shadow:0 4px 0 rgba(160,90,110,.35); transition:transform .12s, opacity .2s;
    }
    .act:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(160,90,110,.35); }
    .act:active { transform:scale(.9); }
    .act .i { font-size:1.4em; line-height:1; }
    .act .t { font-size:.52em; font-weight:800; margin-top:2px; opacity:.9; }
    .act.hide { display:none; }
    .act.go { background:#fff4d6; border-color:#ffb340; animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,212,59,.5);} 50%{ box-shadow:0 0 0 10px rgba(255,212,59,0);} }

    /* ───── 토스트 ───── */
    .toast {
        position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(14px);
        background:#fff8ef; border:2.5px solid #e8597a; box-shadow:0 4px 0 rgba(160,90,110,.3);
        color:#6b4030; padding:10px 20px; border-radius:18px; font-size:.86em; font-weight:800;
        opacity:0; transition:opacity .22s, transform .22s; pointer-events:none; z-index:70;
        max-width:88vw; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ───── 패널(가게/가방/메뉴) ───── */
    .panel {
        position:fixed; top:0; left:0; right:0; bottom:0; z-index:80; color:#5d4038;
        background:linear-gradient(170deg,#fff6ec,#ffe9dd); display:none; flex-direction:column;
        padding:18px 14px calc(18px + env(safe-area-inset-bottom));
    }
    .panel.show { display:flex; animation:fade .22s; }
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .panel h2 { font-size:1.22em; margin-bottom:3px; color:#c04a60; }
    .panel .sub { font-size:.78em; opacity:.68; margin-bottom:12px; font-weight:700; }
    .plist { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .row {
        display:flex; align-items:center; gap:11px; padding:11px 12px; margin-bottom:9px;
        background:#fffdf8; border:2px solid rgba(200,140,120,.35); border-radius:16px;
        box-shadow:0 3px 0 rgba(180,120,110,.18);
    }
    .row.tap { cursor:pointer; }
    .row.tap:active { transform:scale(.98); }
    .row.off { opacity:.42; }
    .row .ri { font-size:1.6em; width:34px; text-align:center; flex-shrink:0; }
    .row .rm { flex:1; min-width:0; }
    .row .rn { font-weight:800; font-size:.93em; }
    .row .rd { font-size:.72em; opacity:.7; margin-top:2px; line-height:1.45; color:#8a6a62; }
    .row .rv { font-weight:900; font-size:.9em; color:#e08a1e; white-space:nowrap; }
    .pbtn {
        border:none; border-radius:17px; padding:15px; font-size:1em; font-weight:900;
        font-family:inherit; color:#fff; cursor:pointer; margin-top:10px; width:100%;
        background:linear-gradient(135deg,#ff7aa8,#ff6a6a);
        box-shadow:0 5px 0 rgba(170,60,85,.45);
    }
    .pbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(170,60,85,.45); }
    .pbtn.g { background:linear-gradient(135deg,#6f93ff,#53b8f7); box-shadow:0 5px 0 rgba(45,90,160,.45); }

    /* ───── 오버레이 카드 ───── */
    .ov { position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
          background:rgba(60,35,55,.6); backdrop-filter:blur(3px);
          display:none; justify-content:center; align-items:center; padding:20px; }
    .ov.show { display:flex; animation:fade .25s; }
    .card {
        background:linear-gradient(165deg,#fff9f0,#ffeede);
        border:3px solid #e8597a; color:#5d4038;
        border-radius:28px; padding:28px 24px; text-align:center; max-width:340px; width:100%;
        box-shadow:0 14px 0 rgba(170,60,85,.3), 0 24px 50px rgba(0,0,0,.4);
        animation:pop .36s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop { 0%{transform:scale(.7);opacity:0} 100%{transform:scale(1);opacity:1} }
    .card .em { font-size:3em; margin-bottom:4px; }
    .card h1 { font-size:1.55em; margin-bottom:6px; color:#c04a60; }
    .card h3 { font-size:1.18em; margin-bottom:8px; color:#c04a60; }
    .card p { font-size:.86em; color:#8a6a62; line-height:1.7; margin-bottom:8px; }
    .rule { background:#fff; border:2px solid rgba(232,89,122,.25); border-radius:16px;
            padding:13px 15px; text-align:left; font-size:.8em; line-height:1.8;
            margin:13px 0 4px; color:#7a5a52; }
</style>
</head>

<div class="ov show" id="ovStart">
    <div class="card">
        <div class="em">💍🌍</div>
        <h1>가라! 동훈!</h1>
        <p>소현이의 세계여행 — by 동훈 ❤️</p>
        <div class="rule">
            🕹️ <b>화면을 눌러서 밀면</b> 그 방향으로 걸어요<br>
            ✨ 반짝이는 건 <b>재료</b> — 지나가면 자동으로 주워요<br>
            🌿 풀숲·골목에선 <b>몬스터</b>가 튀어나와요<br>
            💍 그때 반지를 던지면 <b>남편이 나가서 싸웁니다</b><br>

<script>
// ═══════════════════════════════════════════════
//  가라! 동훈! — 소현이의 세계여행
//  by 동훈 ❤️  (한 파일로 돌아가는 2D 탐험 RPG)
// ═══════════════════════════════════════════════

// ───────── 저장 (폰 WebView에서 file:// 로 열면 localStorage가 던질 수 있어 전부 감싼다) ─────────
// 받침에 따라 조사를 골라 붙인다 ("비둘기이(가)" 같은 표기를 없애려고)
function jo(w, withBat, noBat) {
    const ch = w.charCodeAt(w.length - 1);
    const bat = (ch >= 0xAC00 && ch <= 0xD7A3) ? ((ch - 0xAC00) % 28 !== 0) : false;
    return w + (bat ? withBat : noBat);
}
function sLoad(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function sSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const SAVE_KEY = 'dhAdventure1';

// ───────── 사운드 (파일 없이 즉석 합성) ─────────
let audioCtx = null, soundOn = sLoad('dhAdvSound', true);
function ac() {
    if (!audioCtx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; audioCtx = new A(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(f, dur, o) {
    if (!soundOn) return;
    const a = ac(); if (!a) return;
    o = o || {};
    const t0 = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t0 + dur);
    const v = o.vol || 0.09;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.04);
}
const S = {
    step()    { tone(160 + Math.random()*40, 0.05, { type:'triangle', vol:0.025 }); },
    pick()    { tone(880, 0.07, { type:'triangle', vol:0.09 }); tone(1320, 0.09, { delay:0.05, type:'triangle', vol:0.07 }); },
    encount() { [392,523,659,784].forEach((f,i)=>tone(f,0.12,{delay:i*0.07,type:'square',vol:0.08})); },
    hit()     { tone(180, 0.12, { slideTo:80, type:'sawtooth', vol:0.1 }); },
    crit()    { tone(300, 0.2, { slideTo:1200, type:'square', vol:0.11 }); },
    heal()    { [659,880,1175].forEach((f,i)=>tone(f,0.16,{delay:i*0.06,type:'sine',vol:0.1})); },
    miss()    { tone(220, 0.1, { slideTo:160, type:'square', vol:0.05 }); },
    win()     { [523,659,784,1047].forEach((f,i)=>tone(f,0.2,{delay:i*0.1,type:'triangle',vol:0.13})); },
    lose()    { [392,330,262].forEach((f,i)=>tone(f,0.3,{delay:i*0.26,type:'triangle',vol:0.12})); },
    levelup() { [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.24,{delay:i*0.09,type:'triangle',vol:0.14})); },
    coin()    { tone(1047, 0.07, { type:'square', vol:0.07 }); tone(1568, 0.1, { delay:0.05, type:'square', vol:0.06 }); },
    open()    { tone(440, 0.1, { slideTo:660, type:'triangle', vol:0.08 }); },
    deny()    { tone(170, 0.14, { type:'square', vol:0.06 }); },
    fly()     { tone(200, 0.6, { slideTo:1400, type:'sawtooth', vol:0.07 }); },
};

// ───────── 캔버스 ─────────
// 장면은 저해상도 캔버스에 "픽셀로" 찍고, 그걸 nearest-neighbor로 뻥튀기한다.
// (매끈한 벡터 대신 게임보이 같은 도트 느낌을 내려고)
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
const pcv = document.createElement('canvas');
const px = pcv.getContext('2d');
let W = 0, H = 0, DPR = 1, Z = 2, VW = 0, VH = 0;
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    Z = Math.max(2, Math.round(W / 184));          // 화면폭 ≈ 11~12타일
    VW = Math.ceil(W / Z); VH = Math.ceil(H / Z);
    pcv.width = VW; pcv.height = VH;
    px.imageSmoothingEnabled = false;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();
function blit() {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pcv, 0, 0, VW, VH, 0, 0, VW * Z, VH * Z);
}
// 픽셀 찍기 도우미 (전부 정수 좌표로 — 반 픽셀이 생기면 흐려진다)
function R(x, y, w, h, c) { px.fillStyle = c; px.fillRect(x | 0, y | 0, w | 0, h | 0); }
function Ro(x, y, w, h, c, o) { R(x - 1, y - 1, w + 2, h + 2, o); R(x, y, w, h, c); }

// ───────── 도시 데이터 ─────────
// 지도는 시드로 절차 생성하므로, 도시를 추가하려면 이 배열에 항목만 더하면 된다.

    shop:{ n:'앨리 빵집', i:'🥐', menu:[
        { n:'크루아상', i:'🥐', need:{'밀가루':2,'버터':1}, price:45 },
        { n:'딸기 타르트', i:'🍰', need:{'밀가루':2,'딸기':2}, price:85 },
        { n:'쇼콜라 바게트', i:'🥖', need:{'밀가루':3,'초콜릿':2}, price:130 },
    ]},
    mobs:[
        { n:'에펠탑 유령', draw:'ghost', hp:65, atk:12, def:3, exp:33, gold:20 },
        { n:'바게트 도둑 비둘기', draw:'bird', hp:55, atk:13, def:2, exp:31, gold:17 },

           intro:'라이벌 커플 등장! 소피가 피에르를 내보냈다!',

    ticket:400,
},
{

    pal:{ sky:'#9ad8e8', g0:'#88c85c', g1:'#5ca03c', g2:'#356828', t0:'#6eb848', t1:'#407c30', t2:'#24501e', p0:'#e8d8b0', p1:'#ccb286', p2:'#9c8252', w0:'#e0b884', w1:'#b88a50', w2:'#72522c', r0:'#d06060', r1:'#a03838', r2:'#6a1e22', a0:'#86d4ec', a1:'#4098c8', a2:'#245c88', tr0:'#7ac456', tr1:'#448a3c', tr2:'#265424', f0:'#ffb4d8', f1:'#fff0a8', out:'#241a16' },

    shop:{ n:'앨리 초밥집', i:'🍣', menu:[

},
{

// ───────── 맵 생성 (시드 고정 → 저장/복원해도 같은 지도) ─────────
const T = { GROUND:0, ROAD:1, WALL:2, WATER:3, GRASS:4, DOOR:5, PORT:6, TREE:7 };
const MW = 48, MH = 38, TS = 16;
const WALKABLE = { 0:1, 1:1, 4:1, 5:1, 6:1 };

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

let MAP = null;
function tileAt(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return T.WALL;
    return MAP.g[ty * MW + tx];
}
function buildMap(c) {
    const rnd = mulberry32(c.seed);
    const g = new Uint8Array(MW * MH).fill(T.GROUND);
    const set = (x, y, v) => { if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) g[y * MW + x] = v; };
    const rect = (x, y, w, h, v) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) set(i, j, v); };

    // 바깥 테두리
    for (let i = 0; i < MW; i++) { g[i] = T.WALL; g[(MH - 1) * MW + i] = T.WALL; }
    for (let j = 0; j < MH; j++) { g[j * MW] = T.WALL; g[j * MW + MW - 1] = T.WALL; }

    // 큰 길 (십자 + 외곽 순환로)
    rect(1, Math.floor(MH / 2) - 1, MW - 2, 3, T.ROAD);
    rect(Math.floor(MW / 2) - 1, 1, 3, MH - 2, T.ROAD);
    rect(1, 4, MW - 2, 2, T.ROAD);
    rect(1, MH - 6, MW - 2, 2, T.ROAD);

    // 건물 블록
    const blocks = [];
    for (let k = 0; k < 16; k++) {
        const bw = 4 + Math.floor(rnd() * 4), bh = 3 + Math.floor(rnd() * 3);
        const bx = 2 + Math.floor(rnd() * (MW - bw - 4));
        const by = 7 + Math.floor(rnd() * (MH - bh - 14));
        let ok = true;
        for (let j = by - 1; j < by + bh + 1 && ok; j++)
            for (let i = bx - 1; i < bx + bw + 1 && ok; i++)
                if (tileOf(g, i, j) !== T.GROUND) ok = false;
        if (!ok) continue;
        rect(bx, by, bw, bh, T.WALL);
        blocks.push({ x: bx, y: by, w: bw, h: bh });
    }

    // 풀숲 / 골목 (몬스터 출현 구역)
    for (let k = 0; k < 20; k++) {
        const cx = 3 + Math.floor(rnd() * (MW - 6)), cy = 7 + Math.floor(rnd() * (MH - 14));
        const r = 1 + Math.floor(rnd() * 2.6);
        for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
            if (i * i + j * j > r * r + 1) continue;
            if (tileOf(g, cx + i, cy + j) === T.GROUND) set(cx + i, cy + j, T.GRASS);
        }
    }

    // 물웅덩이 (장식 + 길막)
    for (let k = 0; k < 3; k++) {
        const cx = 4 + Math.floor(rnd() * (MW - 8)), cy = 9 + Math.floor(rnd() * (MH - 18));
        const r = 2 + Math.floor(rnd() * 2);
        for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
            if (i * i * 1.6 + j * j > r * r) continue;
            if (tileOf(g, cx + i, cy + j) === T.GROUND || tileOf(g, cx + i, cy + j) === T.GRASS) set(cx + i, cy + j, T.WATER);
        }
    }

    // 가게 문 — 큰길에 접한 건물 하나를 골라 문을 낸다
    let door = null;
    for (const b of blocks) {
        const dx = b.x + Math.floor(b.w / 2), dy = b.y + b.h;
        if (tileOf(g, dx, dy) === T.ROAD || tileOf(g, dx, dy) === T.GROUND) { door = { x: dx, y: b.y + b.h - 1 }; break; }
    }
    if (!door) door = { x: Math.floor(MW / 2), y: 8 };
    set(door.x, door.y, T.DOOR);

    // 공항 (다음 도시로)
    const port = { x: MW - 5, y: 2 };
    rect(port.x - 1, port.y, 3, 2, T.PORT);

    // 시작 위치 — 십자로 한가운데
    const start = { x: Math.floor(MW / 2), y: Math.floor(MH / 2) };

    // 나무 — 주변 8칸이 전부 빈 땅인 자리에만 심는다.
    // 그런 칸은 하나 막혀도 돌아갈 길이 항상 남아서 지도가 끊길 수가 없다.
    const trees = [];
    for (let k = 0; k < 420 && trees.length < 34; k++) {
        const tx = 2 + Math.floor(rnd() * (MW - 4)), ty = 7 + Math.floor(rnd() * (MH - 14));
        let open = true;
        for (let j = -1; j <= 1 && open; j++) for (let i = -1; i <= 1 && open; i++)
            if (tileOf(g, tx + i, ty + j) !== T.GROUND) open = false;
        if (!open) continue;
        if (trees.some(t => Math.abs(t.x - tx) < 3 && Math.abs(t.y - ty) < 3)) continue;
        set(tx, ty, T.TREE);
        trees.push({ x: tx, y: ty, kind: rnd() });
    }

    return { g, door, port, start, blocks, trees };
}
function tileOf(g, x, y) { if (x < 0 || y < 0 || x >= MW || y >= MH) return T.WALL; return g[y * MW + x]; }

// 재료 노드 / 하트 / 상호작용 지점
let nodes = [], hearts = [];
function spawnNodes(c, n) {
    const rnd = mulberry32(c.seed + 99 + Math.floor(gameT * 7));
    while (nodes.length < n) {
        const tx = 1 + Math.floor(rnd() * (MW - 2)), ty = 6 + Math.floor(rnd() * (MH - 12));
        const t = tileAt(tx, ty);
        if (t !== T.GROUND && t !== T.GRASS) continue;
        const mi = Math.floor(rnd() * c.mats.length);
        nodes.push({ x: tx * TS + TS / 2, y: ty * TS + TS / 2, mat: c.mats[mi], k: mi, bob: rnd() * 6 });
    }
}
function buildHearts(c) {
    const rnd = mulberry32(c.seed + 555);
    hearts = [];
    let guard = 0;
    while (hearts.length < 3 && guard++ < 900) {
        const tx = 2 + Math.floor(rnd() * (MW - 4)), ty = 7 + Math.floor(rnd() * (MH - 14));
        if (!WALKABLE[tileAt(tx, ty)]) continue;
        const key = c.id + hearts.length;
        hearts.push({ x: tx * TS + TS / 2, y: ty * TS + TS / 2, key, got: !!G.hearts[key] });
    }
}

function enterCity(idx, keepPos) {
    G.cityIdx = idx;
    const c = city();
    MAP = buildMap(c);
    nodes = []; spawnNodes(c, 26);
    buildHearts(c);
    if (!keepPos) { G.px = MAP.start.x * TS + TS / 2; G.py = MAP.start.y * TS + TS / 2; }
    P.x = G.px; P.y = G.py; P.vx = P.vy = 0;
    document.getElementById('hCity').textContent = c.icon + ' ' + c.name;
    syncHud();
}

// ───────── 플레이어 & 조이스틱 ─────────
const P = { x:0, y:0, vx:0, vy:0, dir:0, walk:0, r:5 };
const stick = { on:false, id:null, ox:0, oy:0, x:0, y:0, dx:0, dy:0 };
const STICK_R = 54;   // 조이스틱은 CSS 픽셀 기준

function canWalk(x, y) {
    const r = P.r * 0.8;
    for (const [ox, oy] of [[-r,-r],[r,-r],[-r,r],[r,r],[0,r],[0,-r],[r,0],[-r,0]]) {
        if (!WALKABLE[tileAt(Math.floor((x + ox) / TS), Math.floor((y + oy) / TS))]) return false;
    }
    return true;
}

cvs.addEventListener('pointerdown', e => {
    if (scene === 'world') {
        if (stick.on) return;
        stick.on = true; stick.id = e.pointerId;
        stick.ox = stick.x = e.clientX; stick.oy = stick.y = e.clientY;
        stick.dx = stick.dy = 0;
        ac();
    } else if (scene === 'battle') {
        battleTap(e.clientX, e.clientY);
    }
});
window.addEventListener('pointermove', e => {
    if (!stick.on || e.pointerId !== stick.id) return;
    stick.x = e.clientX; stick.y = e.clientY;
    let dx = stick.x - stick.ox, dy = stick.y - stick.oy;
    const d = Math.hypot(dx, dy);
    if (d > STICK_R) { dx = dx / d * STICK_R; dy = dy / d * STICK_R; }
    stick.dx = dx / STICK_R; stick.dy = dy / STICK_R;
});
function endStick(e) {
    if (!stick.on || (e && e.pointerId !== stick.id)) return;
    stick.on = false; stick.id = null; stick.dx = stick.dy = 0;
}
window.addEventListener('pointerup', endStick);
window.addEventListener('pointercancel', endStick);

// ───────── 월드 업데이트 ─────────
let interact = null;          // 지금 상호작용 가능한 대상
let encounterGauge = 0;

function updateWorld(dt) {
    const sp = 66;
    let dx = stick.dx, dy = stick.dy;
    const mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; }
    if (mag > 0.12) {
        P.dir = Math.atan2(dy, dx);
        P.walk += dt * (4 + mag * 7);
        const nx = P.x + dx * sp * dt, ny = P.y + dy * sp * dt;
        // 축별로 따로 밀어서 벽에 비벼도 매끄럽게 미끄러지도록
        if (canWalk(nx, P.y)) P.x = nx;
        if (canWalk(P.x, ny)) P.y = ny;
        if (Math.floor(P.walk) !== Math.floor(P.walk - dt * 6)) S.step();
        G.steps += mag * dt * 3;

        // 풀숲을 걸으면 몬스터가 나온다
        const t = tileAt(Math.floor(P.x / TS), Math.floor(P.y / TS));
        if (t === T.GRASS) {
            encounterGauge += dt * mag * (0.42 + Math.random() * 0.3);
            if (encounterGauge > 1.15) { encounterGauge = 0; startBattle(null); return; }
        } else encounterGauge = Math.max(0, encounterGauge - dt * 0.25);
    } else P.walk *= 0.9;

    G.px = P.x; G.py = P.y;
    G.playT += dt;

    // 재료 줍기
    for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        if (Math.hypot(n.x - P.x, n.y - P.y) < 11) {
            G.mats[n.mat.n] = (G.mats[n.mat.n] || 0) + 1;
            nodes.splice(i, 1);
            S.pick();
            pop(n.x, n.y, n.mat.i + ' ' + n.mat.n, n.mat.c);
            toast(n.mat.i + ' ' + jo(n.mat.n, '을', '를') + ' 주웠다!');
        }
    }
    if (nodes.length < 26 && Math.random() < dt * 0.9) spawnNodes(city(), 26);

    // 숨겨진 하트
    for (const h of hearts) {
        if (h.got) continue;
        if (Math.hypot(h.x - P.x, h.y - P.y) < 11) {
            h.got = true; G.hearts[h.key] = true;
            S.levelup();
            const total = Object.keys(G.hearts).length;
            pop(h.x, h.y, '💗', '#ff8fc7');
            msg('💗', '편지 조각을 찾았다!', '동훈이가 숨겨둔 편지 조각 ' + total + '번째.<br>15개를 다 모으면 편지가 완성돼요.');
        }
    }

    // 상호작용 대상 찾기
    const d = MAP.door, p = MAP.port;
    const dd = Math.hypot(d.x * TS + TS/2 - P.x, (d.y + 1) * TS - P.y);
    const dp = Math.hypot(p.x * TS + TS/2 - P.x, (p.y + 2) * TS - P.y);
    // 랜드마크 앞에 라이벌 커플이 서 있다
    const dl = Math.hypot((MW / 2) * TS - P.x, 3 * TS + 17 - P.y);
    let nx = null;
    if (dl < 31 && !G.boss[city().id]) nx = { kind:'boss', i:'⚔️', t:'도전!' };
    else if (dd < 19) nx = { kind:'shop', i:city().shop.i, t:city().shop.n };
    else if (dp < 22) nx = { kind:'port', i:'✈️', t:'공항' };
    if ((nx && nx.kind) !== (interact && interact.kind)) {
        interact = nx;
        const el = document.getElementById('actGo');
        el.classList.toggle('hide', !nx);
        if (nx) { document.getElementById('actGoI').textContent = nx.i; document.getElementById('actGoT').textContent = nx.t; }
    }

    // 가게 자동 판매
    tickShop(dt);
    updatePops(dt);
}

function doInteract() {
    if (!interact) return;
    S.open();
    if (interact.kind === 'shop') openShop();
    else if (interact.kind === 'port') openPort();
    else if (interact.kind === 'boss') {
        const c = city();
        if (confirm(c.boss.wife + ' & ' + c.boss.n + ' 커플에게 도전할까요?\n\n(보스전은 도망칠 수 없어요!)')) startBattle(c.boss);
    }
}

// ───────── 떠오르는 글씨 ─────────
const pops = [];
function pop(x, y, txt, color) { pops.push({ x, y, txt, color: color || '#fff', life: 1.1 }); }
function updatePops(dt) {
    for (let i = pops.length - 1; i >= 0; i--) {
        pops[i].life -= dt; pops[i].y -= dt * 26;
        if (pops[i].life <= 0) pops.splice(i, 1);
    }
}

// ───────── 월드 렌더 ─────────
let cam = { x:0, y:0 };

// 타일마다 "항상 같은" 난수 — 꽃/돌멩이가 프레임마다 떨리지 않게
function th(tx, ty, salt) {
    let h = (tx * 374761393 + ty * 668265263 + (salt || 0) * 1274126177) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const cl = v => Math.max(0, Math.min(255, v));
    const r = cl((n >> 16) + amt), g = cl(((n >> 8) & 255) + amt), b = cl((n & 255) + amt);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
// 도트 스프라이트: 먼저 실루엣을 외곽선 색으로 한 겹 깔고 그 위에 칠한다
function sprite(parts, out, s, ox, oy) {
    s = s || 1; ox = ox || 0; oy = oy || 0;
    for (const q of parts) R(ox + (q[0] - 1) * s, oy + (q[1] - 1) * s, (q[2] + 2) * s, (q[3] + 2) * s, out);
    for (const q of parts) R(ox + q[0] * s, oy + q[1] * s, q[2] * s, q[3] * s, q[4]);
}

// ───────── 바닥 타일 (16×16 도트) ─────────
function drawGroundTile(tx, ty, p) {
    const t = tileAt(tx, ty), X = tx * TS, Y = ty * TS;
    const isP = v => v === T.ROAD || v === T.PORT || v === T.DOOR;

    if (t === T.WATER) {
        R(X, Y, 16, 16, p.a1);
        for (let i = 0; i < 3; i++) {
            const wy = Y + 3 + i * 5;
            const off = ((gameT * 6 + tx * 5 + i * 7) | 0) % 16;
            R(X + off, wy, 4, 1, p.a0);
            R(X + ((off + 8) % 16), wy + 2, 3, 1, p.a0);
        }
        if (tileAt(tx, ty - 1) !== T.WATER) R(X, Y, 16, 2, p.a2);
        if (tileAt(tx, ty + 1) !== T.WATER) R(X, Y + 14, 16, 2, p.a2);
        if (tileAt(tx - 1, ty) !== T.WATER) R(X, Y, 2, 16, p.a2);
        if (tileAt(tx + 1, ty) !== T.WATER) R(X + 14, Y, 2, 16, p.a2);
        return;
    }

    if (isP(t)) {
        R(X, Y, 16, 16, p.p1);
        // 모래/자갈 무늬 — 레퍼런스의 바닥 패턴처럼 작은 점을 규칙적으로
        for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
            const r = th(tx * 4 + i, ty * 4 + j, 11);
            const ax = X + i * 4 + 1, ay = Y + j * 4 + 1;
            if (r > 0.62) { R(ax, ay, 2, 1, p.p0); R(ax + 1, ay + 1, 1, 1, p.p0); }
            else if (r > 0.42) R(ax + 1, ay + 1, 1, 1, p.p2);
        }
        if (!isP(tileAt(tx, ty - 1))) R(X, Y, 16, 1, p.p2);
        if (!isP(tileAt(tx, ty + 1))) R(X, Y + 15, 16, 1, p.p2);
        if (!isP(tileAt(tx - 1, ty))) R(X, Y, 1, 16, p.p2);
        if (!isP(tileAt(tx + 1, ty))) R(X + 15, Y, 1, 16, p.p2);
        return;
    }

    if (t === T.GRASS) {
        R(X, Y, 16, 16, p.t2);
        // 수풀 포기 두 덩이 — 여기서 몬스터가 튀어나온다
        for (let k = 0; k < 2; k++) {
            const gx = X + 1 + k * 8, gy = Y + 5 + (k ? 3 : 0);
            const sw = Math.sin(gameT * 2 + tx + ty + k) > 0 ? 0 : 1;
            R(gx + sw, gy, 2, 3, p.t0); R(gx + 4 + sw, gy, 2, 3, p.t0);
            R(gx, gy + 3, 7, 4, p.t1);
            R(gx, gy + 6, 7, 1, p.t2);
            R(gx + 1, gy + 4, 2, 1, p.t0);
        }
        return;
    }

    // 평지 잔디
    R(X, Y, 16, 16, p.g1);
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
        const r = th(tx * 4 + i, ty * 4 + j, 3);
        if (r > 0.8) R(X + i * 4 + 1, Y + j * 4 + 1, 2, 1, p.g0);
        else if (r < 0.14) { R(X + i * 4 + 1, Y + j * 4 + 2, 1, 1, p.g2); R(X + i * 4 + 2, Y + j * 4 + 1, 1, 1, p.g2); }
    }
    const d = th(tx, ty, 7);
    if (d > 0.9) {   // 꽃
        const fx = X + 3 + ((th(tx, ty, 8) * 9) | 0), fy = Y + 4 + ((th(tx, ty, 9) * 8) | 0);
        const col = d > 0.95 ? p.f0 : p.f1;
        R(fx, fy + 2, 1, 2, p.g2);
        R(fx - 1, fy, 3, 1, col); R(fx, fy - 1, 1, 3, col);
        R(fx, fy, 1, 1, '#ffffff');
    }
}

// ───────── 나무 ─────────
function drawTree(t, p) {
    const X = t.x * TS, Y = t.y * TS;
    R(X + 4, Y + 14, 8, 2, 'rgba(0,0,0,.25)');
    sprite([
        [X + 6, Y + 1, 4, 14, '#7a5230'],
        [X + 4, Y - 18, 8, 4, p.tr1],
        [X + 2, Y - 15, 12, 5, p.tr1],
        [X + 1, Y - 11, 14, 7, p.tr1],
        [X + 2, Y - 5, 12, 5, p.tr1],
        [X + 4, Y - 1, 8, 3, p.tr1],
    ], p.out);
    R(X + 3, Y - 14, 4, 3, p.tr0); R(X + 2, Y - 10, 3, 3, p.tr0); R(X + 5, Y - 17, 3, 2, p.tr0);
    R(X + 9, Y - 4, 4, 3, p.tr2); R(X + 10, Y - 10, 3, 3, p.tr2);
    R(X + 7, Y + 5, 2, 9, '#5c3c22');
}

// ───────── 길가 소품 ─────────
function drawProp(pr, p) {
    const X = pr.x * TS, Y = pr.y * TS;
    if (pr.kind === 0) {           // 가로등
        sprite([[X + 7, Y + 2, 2, 13, '#6c7a8c'], [X + 5, Y - 4, 6, 6, '#fff0b0']], p.out);
        R(X + 6, Y - 3, 2, 2, '#ffffff');
        R(X + 4, Y + 14, 8, 2, 'rgba(0,0,0,.22)');
    } else if (pr.kind === 1) {    // 벤치
        sprite([[X + 2, Y + 7, 12, 3, '#b07a48'], [X + 2, Y + 2, 12, 2, '#b07a48'],
                [X + 3, Y + 10, 2, 4, '#7a5230'], [X + 11, Y + 10, 2, 4, '#7a5230']], p.out);
        R(X + 2, Y + 7, 12, 1, '#d09a68');
    } else {                       // 화분
        sprite([[X + 5, Y + 8, 6, 6, '#c87a52'], [X + 6, Y + 3, 4, 5, p.tr1]], p.out);
        R(X + 5, Y + 8, 6, 1, '#e8a070');
        R(X + 6, Y + 2, 2, 2, p.f0); R(X + 9, Y + 3, 2, 2, p.f0);
    }
}

// ───────── 건물 ─────────
function drawBuilding(b, p, c, isShop) {
    const X = b.x * TS, Y = b.y * TS, Wd = b.w * TS, Hd = b.h * TS;
    const rh = 12;
    R(X + 2, Y + Hd, Wd, 2, 'rgba(0,0,0,.22)');
    // 벽
    R(X - 1, Y - 1, Wd + 2, Hd + 2, p.out);
    R(X, Y, Wd, Hd, p.w1);
    R(X, Y, Wd, 2, p.w0);
    R(X, Y, 2, Hd, p.w0);
    for (let j = 4; j < Hd - 2; j += 6) R(X + 1, Y + j, Wd - 2, 1, p.w2);
    // 지붕 — 줄마다 넓어지는 사다리꼴. 외곽선은 양 끝에만 찍어야 지붕색이 살아남는다
    const rowW = [], rowX = [];
    for (let i = 0; i < rh; i++) {
        const t = i / (rh - 1);
        rowW[i] = Math.round(Wd * 0.46 + (Wd + 8) * 0.54 * t);
        rowX[i] = Math.round(X + Wd / 2 - rowW[i] / 2);
    }
    R(rowX[0] - 1, Y - rh - 1, rowW[0] + 2, 1, p.out);
    for (let i = 0; i < rh; i++) {
        const ry = Y - rh + i;
        R(rowX[i], ry, rowW[i], 1, i < 2 ? p.r0 : (i >= rh - 2 ? p.r2 : p.r1));
        if (i % 3 === 2) for (let k = 3; k < rowW[i] - 3; k += 5) R(rowX[i] + k, ry, 2, 1, p.r2);
        R(rowX[i] - 1, ry, 1, 1, p.out);
        R(rowX[i] + rowW[i], ry, 1, 1, p.out);
    }
    R(rowX[rh - 1] - 1, Y, rowW[rh - 1] + 2, 1, p.out);
    // 창문
    const cols = Math.max(1, Math.floor(b.w / 2)), rows = Math.max(1, b.h - 1);
    for (let r2 = 0; r2 < rows; r2++) for (let i = 0; i < cols; i++) {
        const wx = Math.round(X + (Wd / cols) * (i + 0.5) - 4);
        const wy = Math.round(Y + 5 + r2 * ((Hd - 10) / Math.max(1, rows - 0.5)));
        if (wy + 9 > Y + Hd - 3) continue;
        const lit = th(b.x + i, b.y + r2, 5) > 0.42;
        R(wx - 1, wy - 1, 10, 11, p.out);
        R(wx, wy, 8, 9, lit ? '#ffe08c' : p.a0);
        R(wx, wy, 8, 1, lit ? '#fff4c4' : '#ffffff');
        R(wx + 3, wy, 2, 9, p.out); R(wx, wy + 4, 8, 1, p.out);
        R(wx - 2, wy + 9, 12, 2, p.w2);
    }
    if (isShop) {
        const d = MAP.door, DX = d.x * TS, DY = d.y * TS;
        // 차양
        for (let i = 0; i < 10; i++) R(DX - 4 + i * 2, DY - 6, 2, 5, i % 2 ? '#fff4e2' : p.r1);
        R(DX - 5, DY - 7, 22, 1, p.out);
        R(DX - 5, DY - 1, 22, 1, p.out);
        // 문
        R(DX + 3, DY + 2, 10, 14, p.out);
        R(DX + 4, DY + 3, 8, 13, '#8a5a34');
        R(DX + 5, DY + 4, 6, 4, p.a0);
        R(DX + 10, DY + 10, 1, 2, '#ffd43b');
    }
}

// ───────── 재료 / 하트 / 라이벌 커플 ─────────
function drawNode(n) {
    const b = (Math.sin(gameT * 3 + n.bob) * 1.5) | 0;
    const X = Math.round(n.x) - 5, Y = Math.round(n.y) - 6 + b;
    const col = n.mat.c, dk = shade(col, -55), lt = shade(col, 55);
    R(X + 1, Y + 12 - b, 8, 2, 'rgba(0,0,0,.22)');
    let parts;
    switch (n.k & 3) {
        case 0:  // 자루
            parts = [[X + 1, Y + 4, 9, 7, col], [X + 2, Y + 2, 7, 3, dk],
                     [X + 3, Y + 1, 5, 2, dk], [X + 2, Y + 5, 3, 3, lt]];
            break;
        case 1:  // 네모 덩어리 (버터·치즈 같은 것)
            parts = [[X + 1, Y + 3, 9, 8, col], [X + 1, Y + 3, 9, 2, lt],
                     [X + 1, Y + 9, 9, 2, dk], [X + 3, Y + 6, 2, 2, lt]];
            break;
        case 2:  // 둥근 열매
            parts = [[X + 2, Y + 3, 7, 8, col], [X + 1, Y + 5, 9, 5, col],
                     [X + 3, Y + 5, 3, 2, lt], [X + 4, Y, 3, 3, '#5c9e3c'], [X + 6, Y + 1, 2, 2, '#8ace6a']];
            break;
        default: // 조각/잎
            parts = [[X + 1, Y + 3, 9, 8, col], [X + 5, Y + 3, 5, 8, dk],
                     [X + 2, Y + 4, 3, 3, lt], [X + 1, Y + 7, 9, 1, dk]];
    }
    sprite(parts, '#2a1c18');
    if (((gameT * 3 + n.bob) | 0) % 4 === 0) { R(X + 8, Y, 2, 1, '#ffffff'); R(X + 8, Y - 1, 1, 3, '#ffffff'); }
}
function drawHeart(h) {
    const b = (Math.sin(gameT * 2.4 + h.x) * 1.6) | 0;
    const X = Math.round(h.x) - 4, Y = Math.round(h.y) - 5 + b;
    sprite([[X + 1, Y, 2, 2, '#ff6fa8'], [X + 5, Y, 2, 2, '#ff6fa8'],
            [X, Y + 2, 8, 3, '#ff6fa8'], [X + 1, Y + 5, 6, 2, '#ff6fa8'], [X + 3, Y + 7, 2, 1, '#ff6fa8']], '#2a1c18');
    R(X + 1, Y + 2, 2, 2, '#ffc0da');
}
function drawCouple(c, bx, by) {
    R(bx - 10, by - 1, 20, 2, 'rgba(0,0,0,.2)');
    drawMobPix(c.boss.draw, bx + 6, by - 2, 1);
    drawNpcGirl(bx - 7, by - 2, '#b89cf0');
}

// ───────── 월드 ─────────
function drawWorld() {
    const c = city(), p = c.pal;
    px.fillStyle = p.sky; px.fillRect(0, 0, VW, VH);

    cam.x = Math.round(P.x - VW / 2);
    cam.y = Math.round(P.y - VH / 2);
    cam.x = Math.max(0, Math.min(MW * TS - VW, cam.x));
    cam.y = Math.max(0, Math.min(MH * TS - VH, cam.y));

    px.save();
    px.translate(-cam.x, -cam.y);

    const x0 = Math.max(0, (cam.x / TS | 0) - 1), x1 = Math.min(MW, ((cam.x + VW) / TS | 0) + 2);
    const y0 = Math.max(0, (cam.y / TS | 0) - 2), y1 = Math.min(MH, ((cam.y + VH) / TS | 0) + 3);

    const props = [];
    for (let ty = y0; ty < y1; ty++) for (let tx = x0; tx < x1; tx++) {
        drawGroundTile(tx, ty, p);
        if (tileAt(tx, ty) === T.ROAD && th(tx, ty, 60) > 0.955) {
            const near = tileAt(tx, ty + 1) === T.GRASS || tileAt(tx, ty + 1) === T.GROUND
                      || tileAt(tx - 1, ty) === T.GROUND || tileAt(tx + 1, ty) === T.GROUND;
            if (near) props.push({ x: tx, y: ty, kind: (th(tx, ty, 61) * 3) | 0 });
        }
    }

    drawLandmark(c, p);

    // 공항
    {
        const pt = MAP.port, X = pt.x * TS, Y = pt.y * TS;
        R(X - TS, Y, TS * 3, TS * 2, p.p0);
        R(X - TS, Y, TS * 3, 1, p.p2); R(X - TS, Y + TS * 2 - 1, TS * 3, 1, p.p2);
        for (let i = 0; i < 5; i++) R(X - TS + 3 + i * 9, Y + TS - 1, 5, 2, '#ffd43b');
        drawPlane(X + 2, Y + 4 + ((Math.sin(gameT * 2) * 1.5) | 0));
    }

    const items = [];
    const doorBlock = MAP.blocks.find(b => MAP.door.x >= b.x && MAP.door.x < b.x + b.w && MAP.door.y >= b.y && MAP.door.y < b.y + b.h);
    MAP.blocks.forEach(b => {
        if ((b.y + b.h) * TS < cam.y - TS * 3 || b.y * TS > cam.y + VH + TS * 3) return;
        items.push({ y: (b.y + b.h) * TS, f: () => drawBuilding(b, p, c, b === doorBlock) });
    });
    if (!doorBlock) items.push({ y: (MAP.door.y + 1) * TS, f: () => drawBuilding({ x: MAP.door.x - 1, y: MAP.door.y - 1, w: 3, h: 2 }, p, c, true) });
    (MAP.trees || []).forEach(t => {
        if (t.y * TS < cam.y - TS * 3 || t.y * TS > cam.y + VH + TS * 2) return;
        items.push({ y: (t.y + 1) * TS, f: () => drawTree(t, p) });
    });
    props.forEach(pr => items.push({ y: (pr.y + 1) * TS, f: () => drawProp(pr, p) }));
    for (const n of nodes) items.push({ y: n.y + 4, f: () => drawNode(n) });
    for (const h of hearts) if (!h.got) items.push({ y: h.y + 4, f: () => drawHeart(h) });
    if (!G.boss[c.id]) {
        const bx = (MW / 2) * TS, by = 3 * TS + 17;
        items.push({ y: by, f: () => drawCouple(c, bx, by) });
    }
    items.push({ y: P.y, f: () => drawHeroPix(P.x, P.y, P.dir, P.walk) });
    items.sort((a, b) => a.y - b.y);
    items.forEach(i => i.f());

    px.restore();
    blit();

    // ── 여기부터는 선명하게 보여야 하는 것들이라 원래 해상도로 덧그린다
    const toScr = (wx, wy) => [(wx - cam.x) * Z, (wy - cam.y) * Z];
    ctx.textAlign = 'center';
    if (!G.boss[c.id]) {
        const [lx, ly] = toScr((MW / 2) * TS, 3 * TS + 17);
        label(lx, ly - 46, '⚔️ ' + c.boss.wife + ' & ' + c.boss.n, '#c04a60');
    }
    {
        const db = MAP.blocks.find(b => MAP.door.x >= b.x && MAP.door.x < b.x + b.w);
        const sy = db ? db.y * TS - 14 : MAP.door.y * TS - 14;
        const [lx, ly] = toScr((db ? (db.x + db.w / 2) : MAP.door.x + 0.5) * TS, sy);
        label(lx, ly, c.shop.i + ' ' + c.shop.n, '#8a5a34');
    }
    for (const pp of pops) {
        const [sx, sy] = toScr(pp.x, pp.y - 10);
        ctx.globalAlpha = Math.min(1, pp.life * 1.5);
        ctx.font = 'bold 15px sans-serif';
        ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(40,25,45,.75)';
        ctx.strokeText(pp.txt, sx, sy); ctx.fillStyle = pp.color; ctx.fillText(pp.txt, sx, sy);
        ctx.globalAlpha = 1;
    }
    drawStick();
    drawMiniMap();
}
function label(x, y, text, col) {
    ctx.font = 'bold 12px sans-serif';
    const w = ctx.measureText(text).width + 16;
    ctx.fillStyle = 'rgba(42,28,24,.85)';
    rr(x - w / 2, y - 15, w, 20, 7); ctx.fill();
    ctx.fillStyle = '#fff6ec'; ctx.fillText(text, x, y - 1);
}
function drawPlane(X, Y) {

// ───────── 조이스틱 / 미니맵 (원래 해상도) ─────────
function drawStick() {
    if (!stick.on) return;
    ctx.save();
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.85; ctx.fillStyle = '#fff8ef';
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * STICK_R, stick.oy + stick.dy * STICK_R, 22, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = '#e8597a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * STICK_R, stick.oy + stick.dy * STICK_R, 22, 0, 7); ctx.stroke();
    ctx.restore();
}
function drawMiniMap() {
    const sc = 2.1, mw = MW * sc, mh = MH * sc, X = 12, Y = H - mh - 20;
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(42,28,24,.8)';
    rr(X - 6, Y - 6, mw + 12, mh + 12, 10); ctx.fill();
    ctx.strokeStyle = '#fff6ec'; ctx.lineWidth = 2;
    rr(X - 6, Y - 6, mw + 12, mh + 12, 10); ctx.stroke();
    const p = city().pal;
    for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
        const t = tileAt(tx, ty);
        if (t === T.GROUND) continue;
        ctx.fillStyle = t === T.WALL ? p.w2 : t === T.WATER ? p.a1 : t === T.TREE ? p.tr1
                      : t === T.GRASS ? p.t1 : t === T.ROAD ? p.p1 : '#ffd43b';
        ctx.fillRect(X + tx * sc, Y + ty * sc, sc, sc);
    }
    ctx.fillStyle = '#ff5c7a';
    ctx.fillRect(X + (P.x / TS) * sc - 2, Y + (P.y / TS) * sc - 2, 4.5, 4.5);
    ctx.restore();
}

// ───────── 도트 캐릭터 ─────────
const SK = { out:'#2a1c18', hair:'#5c3620', hairL:'#8a5434', skin:'#ffd2a6', skinD:'#d9a373',
             dress:'#ff7ab0', dressD:'#d44a86', shoe:'#46304e', eye:'#2a1c18', blush:'#ff9aa8' };
function mirror(parts, X, boxW) {
    return parts.map(q => [2 * X + boxW - q[0] - q[2], q[1], q[2], q[3], q[4]]);
}
function dir4(a) {
    if (a > Math.PI / 4 && a < 3 * Math.PI / 4) return 0;          // 아래
    if (a < -Math.PI / 4 && a > -3 * Math.PI / 4) return 1;        // 위
    if (Math.abs(a) >= 3 * Math.PI / 4) return 2;                  // 왼쪽
    return 3;                                                      // 오른쪽
}

function drawLandmark(c, p) {
    const X = (MW / 2) * TS, Y = 3 * TS;
    const O = p.out;
    if (c.landmark === 'eiffel') {
        const col = '#c8ae84', colD = '#8a7352';
        R(X - 2, Y - 74, 4, 10, O); R(X - 1, Y - 73, 2, 9, col);
        const N = 20;
        for (let i = 0; i < N; i++) {
            const t = i / (N - 1);
            const w = Math.round(4 + 42 * t * t * 1.15);
            const yy = Y + 2 - (N - i) * 3.4;
            R(X - w / 2 - 1, yy, w + 2, 4, O);
            R(X - w / 2, yy, w, 3, i % 3 === 0 ? colD : col);
            if (w > 11) R(X - w / 2 + 4, yy, w - 8, 3, p.sky);   // 가운데를 비워 다리 모양
        }
        R(X - 15, Y - 48, 30, 4, O); R(X - 14, Y - 47, 28, 2, col);
        R(X - 25, Y - 22, 50, 4, O); R(X - 24, Y - 21, 48, 2, col);
        for (let i = 0; i < 9; i++) R(X - 22 + i * 5, Y - 12, 3, 10, colD);
    } else if (c.landmark === 'torii') {
        sprite([[X - 26, Y - 46, 52, 6, '#c92a2a'], [X - 21, Y - 36, 42, 5, '#c92a2a'],
                [X - 18, Y - 40, 6, 46, '#c92a2a'], [X + 12, Y - 40, 6, 46, '#c92a2a'],
                [X - 29, Y - 52, 58, 5, '#8b1f1f']], O);
        R(X - 17, Y - 39, 2, 44, '#e05050'); R(X + 13, Y - 39, 2, 44, '#e05050');
    } else if (c.landmark === 'pyramid') {
        for (let i = 0; i < 11; i++) {
            const w = 6 + i * 7;
            R(X - w / 2 - 1, Y - 2 - (10 - i) * 5 - 1, w + 2, 7, O);
            R(X - w / 2, Y - 2 - (10 - i) * 5, w, 5, '#e0c178');
            R(X, Y - 2 - (10 - i) * 5, w / 2, 5, '#c4a45c');
        }
    } else if (c.landmark === 'colosseum') {
        R(X - 44, Y - 40, 88, 44, O);
        R(X - 43, Y - 39, 86, 42, '#d6c08f');
        for (let r2 = 0; r2 < 3; r2++) for (let i = 0; i < 9; i++) {
            R(X - 38 + i * 9, Y - 35 + r2 * 13, 6, 9, '#8a7a56');
            R(X - 37 + i * 9, Y - 34 + r2 * 13, 4, 7, '#b89f6e');
        }
    } else {
        sprite([[X - 7, Y - 34, 14, 36, '#5c8a78'], [X - 8, Y - 48, 16, 14, '#6b9a86'],
                [X - 18, Y - 58, 7, 24, '#5c8a78'], [X - 20, Y - 64, 10, 7, '#ffd43b'],
                [X - 16, Y + 2, 32, 6, '#7a6a4a']], O);
        for (let i = -3; i <= 3; i++) R(X + i * 4 - 1, Y - 58, 2, 6, '#6b9a86');
        R(X - 5, Y - 45, 3, 3, '#3f6a58'); R(X + 2, Y - 45, 3, 3, '#3f6a58');
    }
}

        const r = 0.88 + Math.random() * 0.3;
        const k = mobScale(c);
        const hp = Math.round(m.hp * r * k);
        e = { n: m.n, draw: m.draw, hp, max: hp, atk: Math.round(m.atk * k), def: Math.round(m.def * k),
              exp: Math.round(m.exp * (1 + (k - 1) * 0.5)), gold: Math.round(m.gold * (1 + (k - 1) * 0.5)), boss: false };
    }
    B = {
        e, phase: 'intro', t: 0, ringT: 0, menu: 'root', btns: [],
        log: [bossOf ? bossOf.intro : '앗! ' + jo(e.n, '이', '가') + ' 나타났다!'],
        guard: 0, edeb: 0, estun: 0, hurtP: 0, hurtE: 0, shake: 0, busy: 0, result: null,
    };
    scene = 'battle';
    S.encount();
    document.getElementById('hud').style.opacity = '0';
    document.getElementById('bars').style.opacity = '0';
    document.getElementById('acts').style.opacity = '0';
    endStick();
}
function endBattleUi() {
    document.getElementById('hud').style.opacity = '1';
    document.getElementById('bars').style.opacity = '1';
    document.getElementById('acts').style.opacity = '1';
}

function blog(s) { B.log.push(s); if (B.log.length > 3) B.log.shift(); }

function dmgCalc(a, pow, d, critBonus) {
    let v = a * pow * (0.9 + Math.random() * 0.2) - d * 0.35;
    v = Math.max(1, v);
    const cr = hasAnimal('crit');
    const isCrit = Math.random() < 0.06 + (critBonus || 0) + (cr ? cr.val : 0);
    if (isCrit) v *= 1.85;
    return { d: Math.max(1, Math.round(v)), crit: isCrit };
}

function useSkill(sk) {
    if (B.busy > 0 || B.phase !== 'menu') return;
    if (G.mp < sk.mp) { S.deny(); blog('기력이 모자라요!'); return; }
    if (sk.costGold && G.gold < sk.costGold) { S.deny(); blog('던질 돈이 없어요! 😭'); return; }
    G.mp -= sk.mp;
    if (sk.costGold) { G.gold -= sk.costGold; blog('💸 ' + sk.costGold + '원을 던졌다!'); }
    B.phase = 'anim'; B.busy = 0.5; B.menu = 'root';

    let txt = '동훈이의 ' + sk.n + '!';
    if (sk.pow > 0) {
        const hits = sk.hits || 1;
        let total = 0, anyCrit = false;
        for (let i = 0; i < hits; i++) {
            const r = dmgCalc(atkOf(), sk.pow, B.e.def, sk.crit);
            total += r.d; anyCrit = anyCrit || r.crit;
        }
        const ex = hasAnimal('extra');
        if (ex && Math.random() < ex.val) {
            const r = dmgCalc(atkOf(), sk.pow * 0.5, B.e.def, 0);
            total += r.d;
            txt += ' ' + ex.i + ' 추가타!';
        }
        B.e.hp = Math.max(0, B.e.hp - total);
        B.hurtE = 0.45; B.shake = 0.35;
        anyCrit ? S.crit() : S.hit();
        txt += (anyCrit ? ' 💥치명타! ' : ' ') + total + ' 데미지!';
    }
    if (sk.healP) {
        const h = Math.round(maxHp() * sk.healP);
        G.hp = Math.min(maxHp(), G.hp + h);
        S.heal(); txt += ' HP ' + h + ' 회복!';
    }
    if (sk.guard) { B.guard = sk.guard; txt += ' 방어 태세!'; }
    if (sk.debuff) { B.edeb = sk.debuff; txt += ' ' + B.e.n + '의 공격력이 뚝 떨어졌다!'; }
    if (sk.stun) {
        if (Math.random() < sk.stun) { B.estun = 1; txt += ' ' + jo(B.e.n, '이', '가') + ' 당황했다!'; }
        else txt += ' ...하지만 안 통했다.';
    }
    blog(txt);
    syncHud();
}

function useItem(it) {
    if (B && (B.busy > 0 || B.phase !== 'menu')) return;
    if (!G.items[it.id]) { S.deny(); return; }
    G.items[it.id]--;
    if (it.id === 'candy') { G.hp = Math.min(maxHp(), G.hp + Math.round(maxHp() * 0.4)); }
    else { G.mp = Math.min(maxMp(), G.mp + Math.round(maxMp() * 0.5)); }
    S.heal(); syncHud();
    if (B) { blog(it.i + ' ' + it.n + ' 사용!'); B.phase = 'anim'; B.busy = 0.5; B.menu = 'root'; }
}

function tryRun() {
    if (B.e.boss) { S.deny(); blog('보스전에서는 도망칠 수 없어요!'); return; }
    if (Math.random() < 0.72) { blog('무사히 도망쳤다!'); B.result = 'run'; B.phase = 'end'; B.busy = 0.8; }
    else { blog('도망치지 못했다!'); B.phase = 'anim'; B.busy = 0.5; B.menu = 'root'; }
}

function enemyTurn() {
    if (B.e.hp <= 0) return;
    if (B.estun > 0) { B.estun--; blog(jo(B.e.n, '은', '는') + ' 멍하니 서 있다...'); return; }
    const deb = 1 - B.edeb;
    let d = B.e.atk * deb * (0.9 + Math.random() * 0.2) - defOf() * 0.35;
    if (B.guard > 0) d *= 0.52;
    const gd = hasAnimal('guard');
    if (gd) d *= (1 - gd.val);
    d = Math.max(1, Math.round(d));
    G.hp = Math.max(0, G.hp - d);
    B.hurtP = 0.45; B.shake = 0.3;
    S.hit();
    blog(B.e.n + '의 공격! ' + d + ' 데미지!');
    syncHud();
}

function turnEnd() {
    if (B.guard > 0) B.guard--;
    if (B.edeb > 0) { B.edeb = Math.max(0, B.edeb - 0.12); }
    const rg = hasAnimal('regen');
    if (rg && G.hp > 0 && G.hp < maxHp()) { G.hp = Math.min(maxHp(), G.hp + rg.val); }
    const mn = hasAnimal('mana');
    if (mn && G.mp < maxMp()) { G.mp = Math.min(maxMp(), G.mp + mn.val); }
    syncHud();
}

function winBattle() {
    const e = B.e, c = city();
    G.gold += e.gold; G.exp += e.exp; G.kills++;
    const drops = [];
    const n = e.boss ? 5 : 1 + (Math.random() < 0.4 ? 1 : 0);
    for (let i = 0; i < n; i++) {
        const m = c.mats[Math.floor(Math.random() * c.mats.length)];
        G.mats[m.n] = (G.mats[m.n] || 0) + 1;
        drops.push(m.i + m.n);
    }
    S.win();
    let body = '💰 ' + e.gold + '원 &nbsp; ⭐ 경험치 ' + e.exp + '<br>🎁 ' + drops.join(' · ');
    let lvUp = '';
    while (G.exp >= expNeed()) {
        G.exp -= expNeed(); G.lv++;
        G.hp = maxHp(); G.mp = maxMp();
        const f = formOf();
        lvUp = '<br><br>🎊 <b>레벨 ' + G.lv + ' 달성!</b>';
        const ns = SKILLS.find(s => s.lv === G.lv);
        if (ns) lvUp += '<br>새 기술 <b>' + ns.n + '</b> 습득!';
        if (f.lv === G.lv) lvUp += '<br>✨ <b>' + f.n + '</b>(으)로 진화했다!';
        S.levelup();
    }
    if (e.boss) {
        G.boss[c.id] = true;
        if (!G.animals.includes(c.animal.id)) {
            G.animals.push(c.animal.id);
            lvUp += '<br><br>' + c.animal.i + ' <b>' + c.animal.n + '</b>' + (jo(c.animal.n, '이', '가').slice(-1)) + ' 동료가 됐다!<br><span style="opacity:.7">' + c.animal.desc + '</span>';
        }
        msg('🏆', c.boss.n + ' 격파!', c.boss.win + '<br><br>' + body + lvUp + '<br><br>✈️ 공항에서 다음 도시로 갈 수 있어요!');
    } else {
        msg('🎉', e.n + ' 격파!', body + lvUp);
    }
    syncHud(); save();
}

function loseBattle() {
    const lost = Math.round(G.gold * 0.25);
    G.gold -= lost;
    G.hp = Math.round(maxHp() * 0.5); G.mp = Math.round(maxMp() * 0.5);
    S.lose();
    msg('😵', '동훈이가 쓰러졌다...', '소현이가 동훈이를 업고 돌아왔어요.<br>치료비로 💰 ' + lost + '원을 썼습니다.<br><br><span style="opacity:.7">레벨을 더 올리거나 아이템을 챙겨가요!</span>');
    P.x = MAP.start.x * TS + TS / 2; P.y = MAP.start.y * TS + TS / 2;
    syncHud(); save();
}

function updateBattle(dt) {
    B.t += dt;
    B.hurtP = Math.max(0, B.hurtP - dt);
    B.hurtE = Math.max(0, B.hurtE - dt);
    B.shake = Math.max(0, B.shake - dt);
    if (B.busy > 0) {
        B.busy -= dt;
        if (B.busy <= 0) {
            if (B.phase === 'end') {
                scene = 'world'; endBattleUi();
                if (B.result === 'win') winBattle();
                else if (B.result === 'lose') loseBattle();
                B = null; return;
            }
            if (B.e.hp <= 0) { B.result = 'win'; B.phase = 'end'; B.busy = 0.6; blog(jo(B.e.n, '을', '를') + ' 쓰러뜨렸다!'); return; }
            enemyTurn();
            if (G.hp <= 0) { B.result = 'lose'; B.phase = 'end'; B.busy = 1.0; blog('동훈이가 쓰러졌다...'); return; }
            turnEnd();
            B.phase = 'menu';
        }
    }
    if (B.phase === 'intro') {
        B.ringT += dt;
        if (B.ringT > 1.25) { B.phase = 'menu'; blog('💍 "가라! 동훈!"'); }
    }
}

function battleTap(x, y) {
    if (!B || B.phase !== 'menu') return;
    for (const b of B.btns) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { S.open(); b.fn(); return; }
    }
}

function drawBattleScene(c, p, vPanelY) {
    const hor = Math.round(vPanelY * 0.52);
    // 하늘 — 그라데이션 대신 띠로 나눠서 도트 느낌 유지
    R(0, 0, VW, hor, p.a0);
    R(0, Math.round(hor * 0.34), VW, hor, shade(p.sky, 14));
    R(0, Math.round(hor * 0.58), VW, hor, p.sky);
    // 해
    const sx = Math.round(VW * 0.78), sy = Math.round(hor * 0.26);
    R(sx - 9, sy - 7, 18, 14, '#fff0a8'); R(sx - 7, sy - 9, 14, 18, '#fff0a8');
    R(sx - 6, sy - 5, 8, 6, '#fffce0');
    // 구름
    for (let i = 0; i < 3; i++) {
        const cx = Math.round(((gameT * (3 + i * 1.6) + i * 90) % (VW + 70)) - 35);
        const cy = Math.round(hor * (0.14 + i * 0.16));
        R(cx - 11, cy, 22, 5, '#ffffff'); R(cx - 7, cy - 4, 14, 5, '#ffffff');
        R(cx - 13, cy + 3, 26, 3, '#e6f2ff');
    }
    // 랜드마크 실루엣
    px.save(); px.translate(Math.round(VW * 0.22) - (MW / 2) * TS, hor - 3 * TS - 6);
    px.globalAlpha = 0.55; drawLandmark(c, p); px.globalAlpha = 1; px.restore();
    // 언덕 두 겹
    for (let x = 0; x < VW; x++) {
        const h1 = Math.round(Math.sin(x * 0.06) * 6 + 10);
        R(x, hor - h1, 1, h1 + 4, p.g2);
    }
    for (let x = 0; x < VW; x++) {
        const h2 = Math.round(Math.cos(x * 0.045 + 1.2) * 5 + 6);
        R(x, hor - h2 + 6, 1, h2 + 6, p.t1);
    }
    // 땅
    R(0, hor + 8, VW, vPanelY - hor, p.g1);
    R(0, hor + 8, VW, 2, p.g0);
    for (let j = 0; j < 20; j++) for (let i = 0; i < 24; i++) {
        const r = th(i, j, 21);
        const gx = Math.round(i * (VW / 24)) + 2, gy = hor + 14 + j * 7;
        if (gy > vPanelY - 2) continue;
        if (r > 0.86) { R(gx, gy, 2, 1, p.f0); R(gx + 1, gy - 1, 1, 1, p.f0); }
        else if (r > 0.6) R(gx, gy, 2, 1, p.g0);
        else if (r < 0.12) R(gx, gy, 1, 1, p.g2);
    }
}
function platformPix(x, y, w, p) {
    x = Math.round(x); y = Math.round(y);
    R(x - w / 2, y, w, 3, p.g2);
    R(x - w / 2 + 3, y - 2, w - 6, 3, p.g0);
    R(x - w / 2 + 1, y + 2, w - 2, 2, p.t2);
}

function card(x, y, w, h, r, edge) {
    ctx.fillStyle = 'rgba(80,50,60,.22)';
    rr(x + 3, y + 4, w, h, r); ctx.fill();
    ctx.fillStyle = '#fff8ef';
    rr(x, y, w, h, r); ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 2.6;
    rr(x, y, w, h, r); ctx.stroke();
}

function drawBattle() {
    const c = city(), p = c.pal;
    const panelH = Math.min(268, H * 0.37);
    const panelY = H - panelH;
    const vPanelY = Math.round(panelY / Z);
    const sh = B.shake > 0 ? ((Math.random() - 0.5) * 5 * B.shake) | 0 : 0;

    px.save(); px.translate(sh, 0);
    drawBattleScene(c, p, vPanelY);

    const ex = Math.round(VW * 0.66), ey = Math.round(vPanelY * (B.e.boss ? 0.5 : 0.44));
    const pxx = Math.round(VW * 0.32), pyy = Math.round(vPanelY * 0.86);
    const es = B.e.boss ? 3 : 2, ps = 2;

    platformPix(ex, ey + 3, 44 * (es / 2), p);
    platformPix(pxx, pyy + 3, 42, p);

    if (B.e.hp > 0 || B.result !== 'win') drawMobPix(B.e.draw, ex, ey, es, B.t, B.hurtE);

    if (B.phase === 'intro') {
        const k = Math.min(1, B.ringT / 0.75);
        const rx = Math.round(-10 + (pxx + 10) * k);
        const ry = Math.round(vPanelY * 0.95 - Math.sin(k * Math.PI) * vPanelY * 0.5);
        const w = ((B.ringT * 14) | 0) % 2 ? 7 : 4;
        R(rx - w / 2 - 1, ry - 4, w + 2, 9, '#2a1c18');
        R(rx - w / 2, ry - 3, w, 7, '#ffd43b');
        R(rx - w / 2 + 1, ry - 2, Math.max(1, w - 2), 5, p.sky);
        if (B.ringT > 0.75) {
            const q = (B.ringT - 0.75) / 0.5;
            if (q > 0.25 || ((B.ringT * 20) | 0) % 2) drawDonghoonPix(pxx, pyy, ps, formOf(), B.t, 0);
        }
    } else if (!(B.result === 'lose' && B.busy < 0.4)) {
        drawDonghoonPix(pxx, pyy, ps, formOf(), B.t, B.hurtP);
    }
    px.restore();
    blit();

    // ── UI는 또렷해야 하니 원래 해상도로
    if (B.phase === 'intro' && B.ringT > 0.75) {
        const q = (B.ringT - 0.75) / 0.5;
        ctx.globalAlpha = Math.max(0, 1 - q);
        ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 7; ctx.strokeStyle = '#fff8ef';
        ctx.strokeText('가라! 동훈!', W / 2, H * 0.24);
        ctx.fillStyle = '#e8597a'; ctx.fillText('가라! 동훈!', W / 2, H * 0.24);
        ctx.globalAlpha = 1;
    }
    const bw = Math.min(214, W * 0.54);
    card(W - bw - 14, 14, bw, 50, 14, p.r2);
    ctx.fillStyle = '#5d4038'; ctx.font = 'bold 13.5px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(B.e.n + (B.e.boss ? ' 👑' : ''), W - bw - 2, 34);
    bar(W - bw - 2, 42, bw - 24, 10, B.e.hp / B.e.max, '#ff6b8a', '#ffb067');
    if (B.edeb > 0) { ctx.fillStyle = '#b06a1f'; ctx.font = 'bold 10px sans-serif'; ctx.fillText('공격력↓', W - bw - 2, 62); }

    const pw = Math.min(222, W * 0.6);
    card(14, panelY - 80, pw, 66, 14, '#e8597a');
    ctx.fillStyle = '#5d4038'; ctx.font = 'bold 13.5px sans-serif';
    ctx.fillText(formOf().n + ' Lv' + G.lv + (B.guard > 0 ? ' 🛡️' : ''), 26, panelY - 60);
    bar(26, panelY - 52, pw - 70, 10, G.hp / maxHp(), '#ff5c7a', '#ff9770');
    bar(26, panelY - 37, pw - 70, 8, G.mp / maxMp(), '#4dabf7', '#74f0d0');
    ctx.fillStyle = '#8a6a62'; ctx.font = 'bold 10.5px sans-serif';
    ctx.fillText(G.hp + '/' + maxHp(), 26 + pw - 64, panelY - 44);

    card(8, panelY, W - 16, H - panelY - 6, 20, p.r2);
    ctx.textAlign = 'left'; ctx.font = 'bold 13px sans-serif';
    B.log.forEach((l, i) => {
        ctx.fillStyle = i === B.log.length - 1 ? '#6b4030' : 'rgba(120,90,80,.55)';
        wrapText(l, 24, panelY + 26, W - 48, i);
    });

    B.btns = [];
    if (B.phase !== 'menu') return;
    const by = panelY + 66, bh = Math.min(48, (H - by - 20) / 2.3);
    const COLS = [['#ffe3ea', '#e8597a', '#9c2f4c'], ['#e4f0ff', '#4dabf7', '#1b5e9c'], ['#fff2d9', '#ffb340', '#8a5a12']];
    const mk = (x, y, w, h, label2, sub, fn, off, ci) => {
        const col = COLS[ci % 3];
        ctx.fillStyle = off ? '#efe6dd' : col[1];
        rr(x, y, w, h, 13); ctx.fill();
        ctx.fillStyle = off ? '#e4dbd2' : col[0];
        rr(x + 2.5, y + 2.5, w - 5, h - 6, 11); ctx.fill();
        ctx.textAlign = 'center';
        ctx.fillStyle = off ? '#a79b92' : col[2];
        ctx.font = 'bold ' + (sub ? 13.5 : 15.5) + 'px sans-serif';
        ctx.fillText(label2, x + w / 2, y + (sub ? h / 2 : h / 2 + 5.5));
        if (sub) { ctx.font = 'bold 10px sans-serif'; ctx.fillStyle = off ? '#b5a99f' : col[1]; ctx.fillText(sub, x + w / 2, y + h / 2 + 13); }
        if (!off) B.btns.push({ x, y, w, h, fn });
    };
    const gap = 9, fullW = W - 36;
    if (B.menu === 'root') {
        const w3 = (fullW - gap * 2) / 3;
        mk(18, by, w3, bh, '⚔️ 싸운다', null, () => { B.menu = 'skill'; }, false, 0);
        mk(18 + w3 + gap, by, w3, bh, '🎒 아이템', null, () => { B.menu = 'item'; }, false, 1);
        mk(18 + (w3 + gap) * 2, by, w3, bh, '🏃 도망', null, tryRun, false, 2);
    } else if (B.menu === 'skill') {
        const sk = mySkills(), w2 = (fullW - gap) / 2, rh = bh * 0.78;
        sk.slice(0, 6).forEach((s2, i) => {
            const x = 18 + (i % 2) * (w2 + gap), y = by + Math.floor(i / 2) * (rh + 6);
            const off = G.mp < s2.mp || (s2.costGold && G.gold < s2.costGold);
            mk(x, y, w2, rh, s2.n, s2.mp ? '기력 ' + s2.mp : '기력 0', () => useSkill(s2), off, i % 3);
        });
        const yb = by + Math.ceil(Math.min(6, sk.length) / 2) * (rh + 6);
        if (yb + 34 < H - 14) mk(18, yb, fullW, 30, '↩ 뒤로', null, () => { B.menu = 'root'; }, false, 2);
        else B.btns.push({ x: 0, y: 0, w: W, h: panelY, fn: () => { B.menu = 'root'; } });
    } else {
        const w2 = (fullW - gap) / 2;
        ITEMS.forEach((it, i) => {
            const have = G.items[it.id] || 0;
            mk(18 + i * (w2 + gap), by, w2, bh, it.i + ' ' + it.n, 'x' + have, () => useItem(it), have <= 0, i);
        });
        mk(18, by + bh + 8, fullW, 30, '↩ 뒤로', null, () => { B.menu = 'root'; }, false, 2);
    }
}
function rr(x, y, w, h, r, fill) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function bar(x, y, w, h, p, c1, c2) {
    rr(x, y, w, h, h / 2, 'rgba(0,0,0,.5)');
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    rr(x, y, Math.max(2, w * Math.max(0, Math.min(1, p))), h, h / 2, null);
    ctx.fillStyle = g; ctx.fill();
}
// 로그는 줄바꿈이 생길 수 있어서, 앞 줄이 몇 줄을 썼는지 누적해서 y를 잡는다
let _wrapY = 0;
function wrapText(txt, x, y, maxW, idx) {
    if (idx === 0) _wrapY = y;
    const lines = [];
    let line = '';
    for (const ch of txt) {
        if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
        else line += ch;
    }
    lines.push(line);
    for (const l of lines) { ctx.fillText(l, x, _wrapY); _wrapY += 17; }
}

// ───────── 가게 (자동 판매) ─────────
function stockTotal() { let n = 0; for (const k in G.stock) n += G.stock[k]; return n; }
function tickShop(dt) {
    if (stockTotal() <= 0) return;
    G.shopAt += dt;
    const period = 5.5;
    while (G.shopAt >= period) {
        G.shopAt -= period;
        const keys = Object.keys(G.stock).filter(k => G.stock[k] > 0);
        if (!keys.length) { G.shopAt = 0; return; }
        const k = keys[Math.floor(Math.random() * keys.length)];
        G.stock[k]--;
        if (G.stock[k] <= 0) delete G.stock[k];
        let price = 0, icon = '🍽️';
        for (const c of CITIES) for (const m of c.shop.menu) if (m.n === k) { price = m.price; icon = m.i; }
        G.gold += price;
        S.coin();
        toast(icon + ' ' + jo(k, '이', '가') + ' 팔렸어요! +' + price + '원');
        syncHud();
    }
}

// ───────── 패널 (가게 / 가방 / 메뉴 / 공항) ─────────
const PANEL = document.getElementById('panel');
function closePanel() { PANEL.classList.remove('show'); S.open(); }
function panelOpen(title, sub, rows, closeLabel) {
    document.getElementById('pTitle').textContent = title;
    document.getElementById('pSub').innerHTML = sub;
    document.getElementById('pList').innerHTML = rows;
    document.getElementById('pClose').textContent = closeLabel || '닫기';
    PANEL.classList.add('show');
}
function rowHtml(icon, name, desc, val, fn, off) {
    return '<div class="row' + (fn ? ' tap' : '') + (off ? ' off' : '') + '"' + (fn ? ' onclick="' + fn + '"' : '') + '>' +
        '<div class="ri">' + icon + '</div><div class="rm"><div class="rn">' + name + '</div>' +
        (desc ? '<div class="rd">' + desc + '</div>' : '') + '</div>' +
        (val ? '<div class="rv">' + val + '</div>' : '') + '</div>';
}

function openShop() {
    const c = city();
    // 가게 = 거점. 밖에서 회복할 방법이 없으면 탐험이 성립하지 않는다.
    if (G.hp < maxHp() || G.mp < maxMp()) {
        G.hp = maxHp(); G.mp = maxMp();
        S.heal(); syncHud();
        toast('🛋️ 가게에서 한숨 돌렸어요! 체력·기력 전부 회복');
    }
    let h = '<div class="rd" style="margin:2px 0 8px;opacity:.75">재료로 요리하면 진열대에 올라가고, 돌아다니는 동안 손님이 사 갑니다.</div>';
    h += '<div class="rd" style="margin:10px 0 6px;font-weight:900;opacity:.9">🍳 요리하기</div>';
    c.shop.menu.forEach((m, i) => {
        const need = Object.entries(m.need).map(([k, v]) => {
            const have = G.mats[k] || 0;
            const mi = c.mats.find(x => x.n === k);
            return '<span style="color:' + (have >= v ? '#8ce99a' : '#ff8787') + '">' + (mi ? mi.i : '') + k + ' ' + have + '/' + v + '</span>';
        }).join(' · ');
        const can = Object.entries(m.need).every(([k, v]) => (G.mats[k] || 0) >= v);
        h += rowHtml(m.i, m.n + (G.stock[m.n] ? ' <span style="opacity:.6;font-size:.8em">진열 ' + G.stock[m.n] + '</span>' : ''),
                     need, m.price + '원', 'cook(' + i + ')', !can);
    });
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🛒 사기</div>';
    ITEMS.forEach((it, i) => {
        h += rowHtml(it.i, it.n + ' <span style="opacity:.6;font-size:.8em">보유 ' + (G.items[it.id] || 0) + '</span>',
                     it.d, itemPrice(it) + '원', 'buy(' + i + ')', G.gold < itemPrice(it));
    });
    panelOpen(c.shop.i + ' ' + c.shop.n,
        '💰 ' + G.gold + '원 · 진열대 ' + stockTotal() + '개', h);
}
function cook(i) {
    const m = city().shop.menu[i];
    if (!Object.entries(m.need).every(([k, v]) => (G.mats[k] || 0) >= v)) { S.deny(); return; }
    for (const [k, v] of Object.entries(m.need)) G.mats[k] -= v;
    G.stock[m.n] = (G.stock[m.n] || 0) + 1;
    S.pick(); toast(m.i + ' ' + m.n + ' 완성! 진열대에 올렸어요');
    syncHud(); save(); openShop();
}
function buy(i) {
    const it = ITEMS[i];
    const pr = itemPrice(it);
    if (G.gold < pr) { S.deny(); return; }
    G.gold -= pr; G.items[it.id] = (G.items[it.id] || 0) + 1;
    S.coin(); syncHud(); save(); openShop();
}

function openBag() {
    if (scene !== 'world') return;
    S.open();
    const c = city();
    let h = '<div class="rd" style="margin:2px 0 8px;font-weight:900;opacity:.9">🧺 재료</div>';
    const keys = Object.keys(G.mats).filter(k => G.mats[k] > 0);
    if (!keys.length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">아직 모은 재료가 없어요. 반짝이는 걸 주우러 가요!</div>';
    keys.forEach(k => {
        let icon = '📦';
        for (const cc of CITIES) { const m = cc.mats.find(x => x.n === k); if (m) icon = m.i; }
        h += rowHtml(icon, k, '', G.mats[k] + '개');
    });
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">💊 아이템</div>';
    ITEMS.forEach(it => h += rowHtml(it.i, it.n, it.d, (G.items[it.id] || 0) + '개'));
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🏪 진열대</div>';
    const sk = Object.keys(G.stock).filter(k => G.stock[k] > 0);
    if (!sk.length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">진열대가 비었어요. 가게에서 요리해두면 알아서 팔려요.</div>';
    sk.forEach(k => h += rowHtml('🍽️', k, '', G.stock[k] + '개'));
    panelOpen('🎒 가방', '💰 ' + G.gold + '원 · 💗 편지 조각 ' + Object.keys(G.hearts).length + '/15', h);
}

function openMenu() {
    if (scene !== 'world') return;
    S.open();
    const f = formOf();
    let h = rowHtml(f.i, f.n + ' Lv' + G.lv, 'HP ' + G.hp + '/' + maxHp() + ' · 기력 ' + G.mp + '/' + maxMp() +
        '<br>공격 ' + Math.round(atkOf()) + ' · 방어 ' + Math.round(defOf()) + ' · 경험치 ' + G.exp + '/' + expNeed(), '');
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">⚔️ 배운 기술</div>';
    mySkills().forEach(s => h += rowHtml('✦', s.n, s.d, s.mp ? '기력 ' + s.mp : '기력 0'));
    const next = SKILLS.find(s => s.lv > G.lv);
    if (next) h += '<div class="rd" style="opacity:.55;padding:4px 2px">🔒 Lv' + next.lv + ' — ' + next.n + '</div>';
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">🐾 동료</div>';
    if (!G.animals.length) h += '<div class="rd" style="opacity:.6;padding:6px 2px">보스를 이기면 그 도시의 동물 친구가 합류해요.</div>';
    CITIES.forEach(c => { if (G.animals.includes(c.animal.id)) h += rowHtml(c.animal.i, c.animal.n, c.animal.desc, c.icon); });
    h += '<div class="rd" style="margin:14px 0 6px;font-weight:900;opacity:.9">⚙️ 설정</div>';
    h += rowHtml(soundOn ? '🔊' : '🔇', '소리 ' + (soundOn ? '켜짐' : '꺼짐'), '탭해서 바꿔요', '', 'toggleSound()');
    h += rowHtml('🗑️', '처음부터 다시', '모든 진행이 사라져요', '', 'wipe()');
    panelOpen('☰ 메뉴', '💗 편지 조각 ' + Object.keys(G.hearts).length + '/15 · ⏱️ ' + Math.floor(G.playT / 60) + '분 플레이', h);
}
function toggleSound() { soundOn = !soundOn; sSave('dhAdvSound', soundOn); S.open(); openMenu(); }
function wipe() {
    if (!confirm('정말 처음부터 다시 시작할까요?')) return;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    location.reload();
}

function openPort() {
    const c = city(), done = !!G.boss[c.id];
    let h = '';
    if (!done) {
        h += '<div class="rd" style="opacity:.8;padding:4px 2px;line-height:1.7">✈️ 이 도시의 <b>라이벌 커플</b>을 이겨야 다음 도시 티켓을 팔아요.<br>' +
             c.icon + ' <b>' + c.name + '</b>의 랜드마크에서 <b>' + c.boss.wife + ' & ' + c.boss.n + '</b> 커플이 기다리고 있어요!</div>';
    }
    CITIES.forEach((cc, i) => {
        const unlocked = i === 0 || !!G.boss[CITIES[i - 1].id];
        const cur = i === G.cityIdx;
        const cost = i > G.cityIdx ? CITIES[G.cityIdx].ticket : 0;
        const can = unlocked && !cur && G.gold >= cost;
        h += rowHtml(cc.icon, cc.name + (cur ? ' <span style="opacity:.6;font-size:.8em">지금 여기</span>' : ''),
            unlocked ? (cur ? '' : '비행기표 ' + cost + '원') : '🔒 앞 도시의 보스를 먼저 이겨요',
            unlocked && !cur ? '출발' : '', can ? 'fly(' + i + ')' : '', !can);
    });
    panelOpen('✈️ 공항', '💰 ' + G.gold + '원', h);
}
function fly(i) {
    const cost = i > G.cityIdx ? CITIES[G.cityIdx].ticket : 0;
    if (G.gold < cost) { S.deny(); return; }
    G.gold -= cost;
    S.fly(); closePanel();
    enterCity(i);
    save();
    msg(CITIES[i].icon, CITIES[i].name + ' 도착!', '새로운 재료와 몬스터가 기다리고 있어요.<br>가게도 새로 열었습니다!');
}

// ───────── 공용 UI ─────────
let toastTimer = null;
function toast(s) {
    const t = document.getElementById('toast');
    t.innerHTML = s; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}
function msg(em, title, body) {
    document.getElementById('mEm').textContent = em;
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBody').innerHTML = body;
    document.getElementById('ovMsg').classList.add('show');
}
function closeMsg() { document.getElementById('ovMsg').classList.remove('show'); S.open(); }

function syncHud() {
    if (!G) return;
    document.getElementById('hGold').textContent = G.gold;
    document.getElementById('hForm').textContent = formOf().n + ' Lv' + G.lv;
    document.getElementById('bHp').style.width = Math.max(0, G.hp / maxHp() * 100) + '%';
    document.getElementById('bMp').style.width = Math.max(0, G.mp / maxMp() * 100) + '%';
    document.getElementById('bXp').style.width = Math.min(100, G.exp / expNeed() * 100) + '%';
}

// ───────── 저장 / 시작 ─────────
function save() { if (G) sSave(SAVE_KEY, G); }
let saveT = 0;

function startGame() {
    G = newGame();
    document.getElementById('ovStart').classList.remove('show');
    enterCity(0);
    scene = 'world'; running = true; lastT = performance.now();
    ac(); save();
    requestAnimationFrame(loop);
    toast('🕹️ 화면을 눌러서 밀면 걸어가요!');
}
function continueGame() {
    const s = sLoad(SAVE_KEY, null);
    if (!s) return startGame();
    G = Object.assign(newGame(), s);
    document.getElementById('ovStart').classList.remove('show');
    enterCity(G.cityIdx, true);
    P.x = G.px || P.x; P.y = G.py || P.y;
    scene = 'world'; running = true; lastT = performance.now();
    ac();
    requestAnimationFrame(loop);
}

// ───────── 메인 루프 ─────────
function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts; gameT += dt;
    if (scene === 'world') { updateWorld(dt); drawWorld(); }
    else if (scene === 'battle') { updateBattle(dt); if (B) drawBattle(); }
    saveT += dt;
    if (saveT > 6) { saveT = 0; save(); }
    requestAnimationFrame(loop);
}

// 이어하기 버튼은 저장이 있을 때만
if (sLoad(SAVE_KEY, null)) document.getElementById('btnContinue').style.display = '';
</script>
