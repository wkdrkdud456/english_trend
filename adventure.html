<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>가라! 동훈! — 소현이의 세계여행 🌍</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body {
        font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
        background:#10172e; color:#fff;
        user-select:none; -webkit-user-select:none; touch-action:none;
    }
    canvas { display:block; position:fixed; top:0; left:0; touch-action:none; }

    /* ───── 상단 HUD ───── */
    .hud {
        position:fixed; top:8px; left:8px; right:8px; z-index:10;
        display:flex; gap:6px; align-items:flex-start; pointer-events:none;
    }
    .chip {
        background:#fff8ef; border:2px solid #e8597a; color:#6b4030;
        border-radius:15px; padding:5px 11px; font-size:.72em; font-weight:800;
        white-space:nowrap; box-shadow:0 3px 0 rgba(160,90,110,.28);
    }
    .chip .s { display:block; font-size:.78em; opacity:.65; font-weight:700; }
    .chip.tap { pointer-events:auto; cursor:pointer; }
    .spacer { flex:1; }

    /* 체력/경험치 바 */
    .bars { position:fixed; top:46px; left:8px; z-index:10; width:132px; pointer-events:none; }
    .bar { height:9px; border-radius:5px; background:#fff8ef; overflow:hidden; margin-bottom:3px;
           border:2px solid rgba(107,64,48,.35); box-shadow:0 2px 0 rgba(160,90,110,.2); }
    .bar > i { display:block; height:100%; border-radius:3px; transition:width .25s; }
    .bar.hp > i { background:linear-gradient(90deg,#ff5c7a,#ff9770); }
    .bar.mp > i { background:linear-gradient(90deg,#4dabf7,#74f0d0); }
    .bar.xp > i { background:linear-gradient(90deg,#ffd43b,#ffa94d); }

    /* ───── 하단 액션 버튼 ───── */
    .acts { position:fixed; right:12px; bottom:22px; z-index:12; display:flex; flex-direction:column; gap:10px; }
    .act {
        width:60px; height:60px; border-radius:50%; cursor:pointer; color:#6b4030;
        background:#fff8ef; border:3px solid #e8597a;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        box-shadow:0 4px 0 rgba(160,90,110,.35); transition:transform .12s, opacity .2s;
    }
    .act:active { transform:translateY(3px); box-shadow:0 1px 0 rgba(160,90,110,.35); }
    .act:active { transform:scale(.9); }
    .act .i { font-size:1.4em; line-height:1; }
    .act .t { font-size:.52em; font-weight:800; margin-top:2px; opacity:.9; }
    .act.hide { display:none; }
    .act.go { background:#fff4d6; border-color:#ffb340; animation:pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(255,212,59,.5);} 50%{ box-shadow:0 0 0 10px rgba(255,212,59,0);} }

    /* ───── 토스트 ───── */
    .toast {
        position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(14px);
        background:#fff8ef; border:2.5px solid #e8597a; box-shadow:0 4px 0 rgba(160,90,110,.3);
        color:#6b4030; padding:10px 20px; border-radius:18px; font-size:.86em; font-weight:800;
        opacity:0; transition:opacity .22s, transform .22s; pointer-events:none; z-index:70;
        max-width:88vw; text-align:center;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ───── 패널(가게/가방/메뉴) ───── */
    .panel {
        position:fixed; top:0; left:0; right:0; bottom:0; z-index:80; color:#5d4038;
        background:linear-gradient(170deg,#fff6ec,#ffe9dd); display:none; flex-direction:column;
        padding:18px 14px calc(18px + env(safe-area-inset-bottom));
    }
    .panel.show { display:flex; animation:fade .22s; }
    @keyframes fade { from{opacity:0} to{opacity:1} }
    .panel h2 { font-size:1.22em; margin-bottom:3px; color:#c04a60; }
    .panel .sub { font-size:.78em; opacity:.68; margin-bottom:12px; font-weight:700; }
    .plist { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .row {
        display:flex; align-items:center; gap:11px; padding:11px 12px; margin-bottom:9px;
        background:#fffdf8; border:2px solid rgba(200,140,120,.35); border-radius:16px;
        box-shadow:0 3px 0 rgba(180,120,110,.18);
    }
    .row.tap { cursor:pointer; }
    .row.tap:active { transform:scale(.98); }
    .row.off { opacity:.42; }
    .row .ri { font-size:1.6em; width:34px; text-align:center; flex-shrink:0; }
    .row .rm { flex:1; min-width:0; }
    .row .rn { font-weight:800; font-size:.93em; }
    .row .rd { font-size:.72em; opacity:.7; margin-top:2px; line-height:1.45; color:#8a6a62; }
    .row .rv { font-weight:900; font-size:.9em; color:#e08a1e; white-space:nowrap; }
    .pbtn {
        border:none; border-radius:17px; padding:15px; font-size:1em; font-weight:900;
        font-family:inherit; color:#fff; cursor:pointer; margin-top:10px; width:100%;
        background:linear-gradient(135deg,#ff7aa8,#ff6a6a);
        box-shadow:0 5px 0 rgba(170,60,85,.45);
    }
    .pbtn:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(170,60,85,.45); }
    .pbtn.g { background:linear-gradient(135deg,#6f93ff,#53b8f7); box-shadow:0 5px 0 rgba(45,90,160,.45); }

    /* ───── 오버레이 카드 ───── */
    .ov { position:fixed; top:0; left:0; right:0; bottom:0; z-index:100;
          background:rgba(60,35,55,.66);
          display:none; justify-content:center; align-items:center; padding:20px; }
    .ov.show { display:flex; animation:fade .25s; }
    .card {
        background:linear-gradient(165deg,#fff9f0,#ffeede);
        border:3px solid #e8597a; color:#5d4038;
        border-radius:28px; padding:28px 24px; text-align:center; max-width:340px; width:100%;
        box-shadow:0 14px 0 rgba(170,60,85,.3), 0 24px 50px rgba(0,0,0,.4);
        animation:pop .36s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes pop { 0%{transform:scale(.7);opacity:0} 100%{transform:scale(1);opacity:1} }
    .card .em { font-size:3em; margin-bottom:4px; }
    .card h1 { font-size:1.55em; margin-bottom:6px; color:#c04a60; }
    .card h3 { font-size:1.18em; margin-bottom:8px; color:#c04a60; }
    .card p { font-size:.86em; color:#8a6a62; line-height:1.7; margin-bottom:8px; }
    .rule { background:#fff; border:2px solid rgba(232,89,122,.25); border-radius:16px;
            padding:13px 15px; text-align:left; font-size:.8em; line-height:1.8;
            margin:13px 0 4px; color:#7a5a52; }
</style>
</head>
<body>

<div class="ov show" id="ovStart">

            💍 그때 반지를 던지면 <b>남편이 나가서 싸웁니다</b><br>
            🥐 모은 재료로 <b>가게에서 요리</b>하면 돌아다니는 동안 팔려요<br>

        </div>
        <button class="pbtn" onclick="startGame()">🎮 여행 시작!</button>
        <button class="pbtn g" id="btnContinue" onclick="continueGame()" style="display:none">▶️ 이어하기</button>
    </div>
</div>

<div class="ov" id="ovCut" style="background:rgba(10,8,20,.94)" onclick="cutAdvance()">
    <div style="max-width:360px;width:100%;text-align:center;padding:10px">
        <div id="cutEm" style="font-size:2.6em;margin-bottom:14px"></div>

<div class="ov" id="ovAsk">

        <div class="em" id="aEm">⚔️</div>

        <button class="pbtn" id="aYes">네!</button>
        <button class="pbtn g" onclick="closeAsk()">아니요</button>

</div>

<div class="ov" id="ovMsg">

        <div class="em" id="mEm">🎉</div>

        <p id="mBody">내용</p>
        <button class="pbtn" id="mBtn" onclick="closeMsg()">확인</button>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════
//  가라! 동훈! — 소현이의 세계여행
//  by 동훈 ❤️  (한 파일로 돌아가는 2D 탐험 RPG)
// ═══════════════════════════════════════════════

// ───────── 저장 (폰 WebView에서 file:// 로 열면 localStorage가 던질 수 있어 전부 감싼다) ─────────
// 받침에 따라 조사를 골라 붙인다 ("비둘기이(가)" 같은 표기를 없애려고)
function jo(w, withBat, noBat) {
    const ch = w.charCodeAt(w.length - 1);
    const bat = (ch >= 0xAC00 && ch <= 0xD7A3) ? ((ch - 0xAC00) % 28 !== 0) : false;
    return w + (bat ? withBat : noBat);
}
function sLoad(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function sSave(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const SAVE_KEY = 'dhAdventure1';

// ───────── 사운드 (파일 없이 즉석 합성) ─────────
let audioCtx = null, soundOn = sLoad('dhAdvSound', true);
function ac() {
    if (!audioCtx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; audioCtx = new A(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}
function tone(f, dur, o) {
    if (!soundOn) return;
    const a = ac(); if (!a) return;
    o = o || {};
    const t0 = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t0);
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(o.slideTo, t0 + dur);
    const v = o.vol || 0.09;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.04);
}
const S = {
    step()    { tone(160 + Math.random()*40, 0.05, { type:'triangle', vol:0.025 }); },
    pick()    { tone(880, 0.07, { type:'triangle', vol:0.09 }); tone(1320, 0.09, { delay:0.05, type:'triangle', vol:0.07 }); },
    encount() { [392,523,659,784].forEach((f,i)=>tone(f,0.12,{delay:i*0.07,type:'square',vol:0.08})); },
    hit()     { tone(180, 0.12, { slideTo:80, type:'sawtooth', vol:0.1 }); },
    crit()    { tone(300, 0.2, { slideTo:1200, type:'square', vol:0.11 }); },
    heal()    { [659,880,1175].forEach((f,i)=>tone(f,0.16,{delay:i*0.06,type:'sine',vol:0.1})); },
    miss()    { tone(220, 0.1, { slideTo:160, type:'square', vol:0.05 }); },
    win()     { [523,659,784,1047].forEach((f,i)=>tone(f,0.2,{delay:i*0.1,type:'triangle',vol:0.13})); },
    lose()    { [392,330,262].forEach((f,i)=>tone(f,0.3,{delay:i*0.26,type:'triangle',vol:0.12})); },
    levelup() { [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.24,{delay:i*0.09,type:'triangle',vol:0.14})); },
    coin()    { tone(1047, 0.07, { type:'square', vol:0.07 }); tone(1568, 0.1, { delay:0.05, type:'square', vol:0.06 }); },
    open()    { tone(440, 0.1, { slideTo:660, type:'triangle', vol:0.08 }); },
    deny()    { tone(170, 0.14, { type:'square', vol:0.06 }); },
    fly()     { tone(200, 0.6, { slideTo:1400, type:'sawtooth', vol:0.07 }); },
};

// ───────── 캔버스 ─────────
// 장면은 저해상도 캔버스에 "픽셀로" 찍고, 그걸 nearest-neighbor로 뻥튀기한다.
// (매끈한 벡터 대신 게임보이 같은 도트 느낌을 내려고)
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
const pcv = document.createElement('canvas');
const px = pcv.getContext('2d');
let W = 0, H = 0, DPR = 1, Z = 2, VW = 0, VH = 0;
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    Z = Math.max(2, Math.round(W / 184));          // 화면폭 ≈ 11~12타일
    VW = Math.ceil(W / Z); VH = Math.ceil(H / Z);
    pcv.width = VW; pcv.height = VH;
    px.imageSmoothingEnabled = false;
    cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
    cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();
function blit() {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pcv, 0, 0, VW, VH, 0, 0, VW * Z, VH * Z);
}
// 픽셀 찍기 도우미 (전부 정수 좌표로 — 반 픽셀이 생기면 흐려진다)
function R(x, y, w, h, c) { px.fillStyle = c; px.fillRect(x | 0, y | 0, w | 0, h | 0); }
function Ro(x, y, w, h, c, o) { R(x - 1, y - 1, w + 2, h + 2, o); R(x, y, w, h, c); }

// ───────── 도시 데이터 ─────────
// 지도는 시드로 절차 생성하므로, 도시를 추가하려면 이 배열에 항목만 더하면 된다.
const CITIES = [
{
    id:'paris', name:'파리', icon:'🗼', landmark:'eiffel', seed:1337, lv0:1,
    pal:{ sky:'#8fd0f0', g0:'#9ad468', g1:'#6cb44c', g2:'#3f7a32', t0:'#7ec455', t1:'#4a8a38', t2:'#2c5c26', p0:'#f0e2bc', p1:'#d8c192', p2:'#a88e5c', w0:'#fff4e2', w1:'#e4d2b8', w2:'#8a7254', r0:'#f08898', r1:'#c85068', r2:'#8a2c44', a0:'#8fdcf4', a1:'#4aa8d8', a2:'#2a6898', tr0:'#86cc5e', tr1:'#4e9440', tr2:'#2c5c28', f0:'#ff9ec8', f1:'#ffe36c', out:'#2a1c18' },
    mats:[ {n:'밀가루',i:'🌾',c:'#e8d5a0'}, {n:'버터',i:'🧈',c:'#ffe066'}, {n:'딸기',i:'🍓',c:'#ff6b81'}, {n:'초콜릿',i:'🍫',c:'#8b5a3c'} ],
    shop:{ n:'앨리 빵집', i:'🥐', menu:[
        { n:'크루아상', i:'🥐', need:{'밀가루':2,'버터':1}, price:45 },
        { n:'딸기 타르트', i:'🍰', need:{'밀가루':2,'딸기':2}, price:85 },
        { n:'쇼콜라 바게트', i:'🥖', need:{'밀가루':3,'초콜릿':2}, price:130 },
        { n:'캉파뉴', i:'🍞', need:{'밀가루':4,'버터':2}, price:290, t:1 },
        { n:'크렘 브륄레', i:'🍮', need:{'버터':3,'초콜릿':2,'딸기':2}, price:560, t:2 },
        { n:'웨딩 케이크', i:'🎂', need:{'밀가루':5,'버터':4,'딸기':4,'초콜릿':3}, price:1400, t:3 },
    ]},
    mobs:[
        { n:'에펠탑 유령', draw:'ghost', hp:65, atk:12, def:3, exp:33, gold:20 },
        { n:'바게트 도둑 비둘기', draw:'bird', hp:55, atk:13, def:2, exp:31, gold:17 },
        { n:'무서운 마임', draw:'mime', hp:85, atk:13, def:5, exp:38, gold:26 },
    ],
    boss:{ n:'피에르', wife:'소피', draw:'pierre', hp:420, atk:26, def:10, exp:200, gold:500,
           intro:'라이벌 커플 등장! 소피가 피에르를 내보냈다!',
           win:'소피: "당신 남편... 설거지 실력이 보통이 아니네요."' },
    animal:{ id:'cat', n:'파리 고양이', i:'🐈‍⬛', eff:'regen', val:5, desc:'매 턴 HP를 조금씩 회복시켜줘요' },
    ticket:400,
},
{
    id:'kyoto', name:'교토', icon:'⛩️', landmark:'torii', seed:4242, lv0:8,
    pal:{ sky:'#9ad8e8', g0:'#88c85c', g1:'#5ca03c', g2:'#356828', t0:'#6eb848', t1:'#407c30', t2:'#24501e', p0:'#e8d8b0', p1:'#ccb286', p2:'#9c8252', w0:'#e0b884', w1:'#b88a50', w2:'#72522c', r0:'#d06060', r1:'#a03838', r2:'#6a1e22', a0:'#86d4ec', a1:'#4098c8', a2:'#245c88', tr0:'#7ac456', tr1:'#448a3c', tr2:'#265424', f0:'#ffb4d8', f1:'#fff0a8', out:'#241a16' },
    mats:[ {n:'쌀',i:'🍚',c:'#f8f4e8'}, {n:'생선',i:'🐟',c:'#74c0fc'}, {n:'간장',i:'🍶',c:'#6b4423'}, {n:'말차',i:'🍵',c:'#8ac926'} ],
    shop:{ n:'앨리 초밥집', i:'🍣', menu:[
        { n:'연어 초밥', i:'🍣', need:{'쌀':2,'생선':2}, price:110 },
        { n:'말차 모찌', i:'🍡', need:{'쌀':2,'말차':2}, price:140 },
        { n:'장어 덮밥', i:'🍱', need:{'쌀':3,'생선':2,'간장':2}, price:230 },
        { n:'돈코츠 라멘', i:'🍜', need:{'쌀':2,'간장':3,'생선':1}, price:620, t:1 },

function petOf(kind) { return PET_DB[kind]; }
function activePet() {
    if (!G.pet) return null;
    const p = (G.pets || []).find(x => x.kind === G.pet);
    if (!p) return null;
    const db = PET_DB[p.kind];
    return db ? { kind: p.kind, n: p.n, legend: p.legend, e: db.e, v: db.v * (p.legend ? 2 : 1) * (1 + (p.lv - 1) * 0.2), d: db.d, lv: p.lv } : null;
}
function petBonus(e) { const a = activePet(); return a && a.e === e ? a.v : 0; }

// 전설 몬스터 — 낮은 확률로 뜨는 "오늘 운 좋네" 순간
function legendRate() { return 0.035 + G.cityIdx * 0.012 + (G.charm ? 0.05 : 0) + (G.unlock && G.unlock.lucky ? 0.07 : 0); }
const LEGEND_PRE = ['✨전설의 ', '👑황금 ', '🌟신화의 '];

function catchChance(e) {
    const hpR = e.hp / e.max;
    let c = 0.2 + (1 - hpR) * 0.62;
    if (e.legend) c *= 0.4;
    if (G.charm) c += 0.12;
    return Math.max(0.05, Math.min(0.95, c));
}
function tryCatch() {
    if (!B || B.phase !== 'menu' || B.busy > 0) return;
    if (B.e.boss) { S.deny(); blog('보스는 잡을 수 없어요!'); return; }
    if (B.e.hp / B.e.max > 0.4) { S.deny(); blog('아직 기운이 넘쳐요! 체력을 40% 밑으로 깎아야 해요'); return; }
    B.phase = 'anim'; B.busy = 0.9; B.menu = 'root';
    B.ring = 0.9;
    S.encount();
    const ok = Math.random() < catchChance(B.e);
    if (ok) {
        const db = PET_DB[B.e.draw];
        const have = (G.pets || []).find(x => x.kind === B.e.draw);
        if (have) { have.lv++; blog('🪄 또 잡았다! ' + have.n + ' Lv' + have.lv + '!'); }
        else {
            const np = { kind: B.e.draw, n: (B.e.legend ? '✨' : '') + (db ? db.n : B.e.n), lv: 1, legend: !!B.e.legend };
            G.pets.push(np);
            if (!G.pet) G.pet = np.kind;
            blog('🪄 ' + np.n + ' 을(를) 잡았다!');
        }
        B.caught = true; B.result = 'catch'; B.phase = 'end'; B.busy = 1.1;
        save();
    } else {
        blog('🪄 ...아슬아슬하게 빠져나갔다! (성공률 ' + Math.round(catchChance(B.e) * 100) + '%)');
    }
}

// 숫자가 안 뜨고 이펙트가 없으면 "눌렀는데 뭐가 일어났는지" 알 수가 없다.
const FX = [];          // 도트 파티클 (가상 해상도 좌표)
const DMG = [];         // 데미지 숫자 (화면 좌표, 또렷하게)
function fx(x, y, kind, n) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, sp = 10 + Math.random() * 40;
        FX.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20, life: 0.5 + Math.random() * 0.5, kind, r: Math.random() });
    }
}
function dmgPop(x, y, txt, col, big) { DMG.push({ x, y, txt, col, big, life: 0.95, vy: -46 }); }
function updateFx(dt) {
    for (let i = FX.length - 1; i >= 0; i--) {
        const f = FX[i];
        f.x += f.vx * dt; f.y += f.vy * dt;
        f.vy += (f.kind === 'bubble' ? -22 : 90) * dt;
        f.life -= dt;
        if (f.life <= 0) FX.splice(i, 1);
    }
    for (let i = DMG.length - 1; i >= 0; i--) {
        const d = DMG[i];
        d.y += d.vy * dt; d.vy += 90 * dt; d.life -= dt;
        if (d.life <= 0) DMG.splice(i, 1);
    }
}
function drawFx() {
    for (const f of FX) {
        const a = Math.min(1, f.life * 2.2);
        if (a < 0.35 && ((gameT * 20) | 0) % 2) continue;
        const X = f.x | 0, Y = f.y | 0;
        switch (f.kind) {
            case 'bubble': R(X, Y, 3, 3, '#ffffff'); R(X, Y, 1, 1, '#cfe9f5'); break;
            case 'coin':   R(X, Y, 4, 4, '#ffd43b'); R(X + 1, Y + 1, 1, 2, '#b88a20'); break;
            case 'heart':  R(X + 1, Y, 1, 1, '#ff6fa8'); R(X + 3, Y, 1, 1, '#ff6fa8'); R(X, Y + 1, 5, 2, '#ff6fa8'); R(X + 2, Y + 3, 1, 1, '#ff6fa8'); break;
            case 'star':   R(X + 2, Y, 2, 6, '#fff4a8'); R(X, Y + 2, 6, 2, '#fff4a8'); break;
            case 'sweat':  R(X, Y, 2, 3, '#8fd0f0'); break;
            case 'spark':  R(X, Y, 2, 2, f.r > 0.5 ? '#ffd0e8' : '#ffffff'); break;
            case 'cloud':  R(X, Y, 5, 3, '#c8c8d8'); break;
            default:       R(X, Y, 3, 3, '#ff8a5c');
        }
    }
}
function drawDmg() {
    ctx.textAlign = 'center';
    for (const d of DMG) {
        ctx.globalAlpha = Math.min(1, d.life * 1.8);
        ctx.font = 'bold ' + (d.big ? 30 : 21) + 'px sans-serif';
        ctx.lineWidth = d.big ? 7 : 5; ctx.strokeStyle = 'rgba(40,25,45,.85)';
        ctx.strokeText(d.txt, d.x, d.y);
        ctx.fillStyle = d.col; ctx.fillText(d.txt, d.x, d.y);
    }
    ctx.globalAlpha = 1;

let CUT = null;
function startCut(em, lines, after) {
    CUT = { em, lines, i: 0, ch: 0, after: after || null };
    ['hud','bars','acts'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = 'none'; });
    const ov = document.getElementById('ovCut');
    document.getElementById('cutEm').textContent = em;
    document.getElementById('cutTx').textContent = '';
    document.getElementById('cutHint').style.opacity = '0';
    ov.classList.add('show');
    S.open();
    endStick();
}
function cutTick(dt) {
    if (!CUT) return;
    const full = CUT.lines[CUT.i];
    if (CUT.ch < full.length) {
        CUT.ch = Math.min(full.length, CUT.ch + dt * 34);
        document.getElementById('cutTx').textContent = full.slice(0, CUT.ch | 0);
        if (CUT.ch >= full.length) document.getElementById('cutHint').style.opacity = '1';
    }
}
function cutAdvance() {
    if (!CUT) return;
    const full = CUT.lines[CUT.i];
    if (CUT.ch < full.length) { CUT.ch = full.length; document.getElementById('cutTx').textContent = full; document.getElementById('cutHint').style.opacity = '1'; return; }
    if (CUT.i < CUT.lines.length - 1) {
        CUT.i++; CUT.ch = 0;
        document.getElementById('cutTx').textContent = '';
        document.getElementById('cutHint').style.opacity = '0';
        S.step();
        return;
    }
    const after = CUT.after;
    CUT = null;
    document.getElementById('ovCut').classList.remove('show');
    ['hud','bars','acts'].forEach(id => { const el = document.getElementById(id); if (el) el.style.display = ''; });
    if (after) after();
}
function letterCount() { return Object.keys(G.hearts || {}).length; }
function cityHearts(c) { return hearts.filter(h => h.got).length; }
function checkEnding() {
    if (G.story.ended) return;
    const allBoss = CITIES.every(c => G.boss[c.id]);
    if (allBoss && letterCount() >= 15) {
        G.story.ended = true; save();
        setTimeout(() => startCut(STORY.ending.em, STORY.ending.lines), 600);
    }
}

let TK = null;   // 대화 중 상태
function startTalk(npc) {
    TK = { npc, i: 0, ch: 0, t: 0, done: false };
    document.getElementById('acts').style.display = 'none';
    S.open();
    endStick();
}
function talkAdvance() {
    if (!TK) return;
    document.getElementById('acts').style.display = '';
    const full = TK.npc.lines[TK.i];
    if (TK.ch < full.length) { TK.ch = full.length; return; }   // 아직 타이핑 중이면 한 번에 완성
    if (TK.i < TK.npc.lines.length - 1) { TK.i++; TK.ch = 0; S.step(); return; }
    // 마지막 줄 — 선물 처리
    const npc = TK.npc;
    TK = null;
    if (npc.gift && !G.talked[npc.n]) {
        G.talked[npc.n] = true;
        if (npc.gift.gold) G.gold += npc.gift.gold;
        if (npc.gift.item) G.items[npc.gift.item] = (G.items[npc.gift.item] || 0) + npc.gift.n;
        S.coin(); toast('🎁 ' + npc.gift.msg);
        syncHud(); save();
    }
}
function drawTalkBox() {
    const npc = TK.npc;
    const bh = Math.min(150, H * 0.22), by = H - bh - 16;
    ctx.fillStyle = 'rgba(80,50,60,.28)';
    rr(14, by + 5, W - 28, bh, 18); ctx.fill();
    ctx.fillStyle = '#fff8ef';
    rr(10, by, W - 20, bh, 18); ctx.fill();
    ctx.strokeStyle = '#5d4038'; ctx.lineWidth = 3.5;
    rr(10, by, W - 20, bh, 18); ctx.stroke();
    ctx.strokeStyle = '#e8597a'; ctx.lineWidth = 1.6;
    rr(16, by + 6, W - 32, bh - 12, 13); ctx.stroke();
    // 이름표
    ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'left';
    const nw = ctx.measureText(npc.n).width + 22;
    ctx.fillStyle = '#e8597a';
    rr(26, by - 13, nw, 26, 11); ctx.fill();
    ctx.fillStyle = '#fff8ef'; ctx.fillText(npc.n, 37, by + 4);
    // 본문 (타자기 효과)
    ctx.fillStyle = '#5d4038'; ctx.font = 'bold 14.5px sans-serif';
    const shown = npc.lines[TK.i].slice(0, TK.ch | 0);
    let line = '', yy = by + 36;
    for (const chr of shown) {
        if (ctx.measureText(line + chr).width > W - 70) { ctx.fillText(line, 32, yy); line = chr; yy += 22; }
        else line += chr;
    }
    ctx.fillText(line, 32, yy);
    // ▼
    if (TK.ch >= npc.lines[TK.i].length && ((gameT * 3) | 0) % 2) {
        ctx.fillStyle = '#e8597a'; ctx.textAlign = 'center';
        ctx.font = 'bold 15px sans-serif';
        ctx.fillText('▼', W - 38, by + bh - 16);
    }
    ctx.textAlign = 'left';
}

// ───────── 맵 생성 (시드 고정 → 저장/복원해도 같은 지도) ─────────
const T = { GROUND:0, ROAD:1, WALL:2, WATER:3, GRASS:4, DOOR:5, PORT:6, TREE:7, PLAZA:8, DECO:9 };
const MW = 48, MH = 38, TS = 16;
const WALKABLE = { 0:1, 1:1, 4:1, 5:1, 6:1, 8:1 };

// 도시마다 지형 테마가 다르다 (나무 종류 · 수풀 종류 · 바닥 · 장식물)
const THEME = {
    paris: { tree:'broad',   enc:'grass',  ground:'grass', pave:'stone' },
    kyoto: { tree:'sakura',  enc:'bamboo', ground:'grass', pave:'gravel' },
    cairo: { tree:'palm',    enc:'dune',   ground:'sand',  pave:'sand' },
    roma:  { tree:'cypress', enc:'ruin',   ground:'grass', pave:'stone' },
    ny:    { tree:'pine',    enc:'bush',   ground:'grass', pave:'asphalt' },
};

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

let MAP = null;
function tileAt(tx, ty) {
    if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return T.WALL;
    return MAP.g[ty * MW + tx];
}

// ───────── 도시별 지형 생성 ─────────
function buildMap(c) {
    const rnd = mulberry32(c.seed);
    const g = new Uint8Array(MW * MH).fill(T.GROUND);
    const M = {
        g, rnd, blocks: [], trees: [], decos: [], npcSpots: [],
        set(x, y, v) { if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) g[y * MW + x] = v; },
        rect(x, y, w, h, v) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) M.set(i, j, v); },
        at(x, y) { return tileOf(g, x, y); },
        // 집터 자체는 빈 땅이어야 하지만, 바로 옆이 길/광장인 건 오히려 자연스럽다
        free(x, y, w, h) {
            if (x < 1 || y < 1 || x + w > MW - 1 || y + h > MH - 1) return false;
            for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++)
                if (tileOf(g, i, j) !== T.GROUND) return false;
            for (let j = y - 1; j < y + h + 1; j++) for (let i = x - 1; i < x + w + 1; i++) {
                const t2 = tileOf(g, i, j);
                if (t2 === T.WALL || t2 === T.DOOR || t2 === T.PORT) return false;
            }
            return true;
        },
        // 길을 따라 집을 줄지어 세운다 (도시처럼 보이게)
        rowHouses(x0, x1, y, h, rnd2) {
            let x = x0;
            while (x < x1 - 3) {
                const w = 3 + (rnd2() * 3 | 0);
                if (x + w > x1) break;
                if (M.house(x, y, w, h)) x += w + 1;
                else x += 2;
            }
        },
        house(x, y, w, h) { if (!M.free(x, y, w, h)) return false; M.rect(x, y, w, h, T.WALL); M.blocks.push({ x, y, w, h }); return true; },
        deco(x, y, kind, solid) { M.decos.push({ x, y, kind }); if (solid) M.set(x, y, T.DECO); },
        // 수풀(몬스터 구역) 덩어리
        patch(cx, cy, r) {
            for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
                if (i * i + j * j > r * r + 1) continue;
                if (M.at(cx + i, cy + j) === T.GROUND) M.set(cx + i, cy + j, T.GRASS);
            }
        },
        pond(cx, cy, rx, ry) {
            for (let j = -ry; j <= ry; j++) for (let i = -rx; i <= rx; i++) {
                if ((i * i) / (rx * rx) + (j * j) / (ry * ry) > 1) continue;
                const t = M.at(cx + i, cy + j);
                if (t === T.GROUND || t === T.GRASS) M.set(cx + i, cy + j, T.WATER);
            }
        },
        // 8방이 전부 빈 땅인 곳에만 나무 — 길이 막힐 수가 없다
        plantTree(tx, ty, kind) {
            for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++)
                if (tileOf(g, tx + i, ty + j) !== T.GROUND) return false;
            if (M.trees.some(t => Math.abs(t.x - tx) < 2 && Math.abs(t.y - ty) < 2)) return false;
            M.set(tx, ty, T.TREE); M.trees.push({ x: tx, y: ty, kind: kind || 0 });
            return true;
        },
        scatterTrees(n, pad) {
            for (let k = 0; k < n * 14 && M.trees.length < n; k++)
                M.plantTree(2 + ((rnd() * (MW - 4)) | 0), (pad || 7) + ((rnd() * (MH - (pad || 7) - 7)) | 0), rnd());
        },
    };
    for (let i = 0; i < MW; i++) { g[i] = T.WALL; g[(MH - 1) * MW + i] = T.WALL; }
    for (let j = 0; j < MH; j++) { g[j * MW] = T.WALL; g[j * MW + MW - 1] = T.WALL; }

    (MAPGEN[c.id] || MAPGEN.paris)(M, c, rnd);

    // 가게 문 — 길에 접한 집 하나에 낸다
    let door = null;
    for (const b of M.blocks) {
        const dx = b.x + (b.w / 2 | 0), dy = b.y + b.h;
        if (M.at(dx, dy) === T.ROAD || M.at(dx, dy) === T.PLAZA || M.at(dx, dy) === T.GROUND) { door = { x: dx, y: b.y + b.h - 1 }; break; }
    }
    if (!door) { door = { x: MW / 2 | 0, y: 9 }; M.rect(door.x - 1, door.y - 1, 3, 2, T.WALL); M.blocks.push({ x: door.x - 1, y: door.y - 1, w: 3, h: 2 }); }
    M.set(door.x, door.y, T.DOOR);

    const port = { x: MW - 5, y: 2 };
    M.rect(port.x - 1, port.y, 3, 2, T.PORT);

    const start = { x: MW / 2 | 0, y: MH / 2 | 0 };
    for (let r = 0; r < 6; r++) { if (WALKABLE[M.at(start.x, start.y)]) break; start.y++; }

    return { g, door, port, start, blocks: M.blocks, trees: M.trees, decos: M.decos, npcSpots: M.npcSpots };
}

const MAPGEN = {
    // 🗼 파리 — 센강이 가로지르고 다리가 놓인 대로의 도시
    paris(M, c, rnd) {
        const riverY = 22;
        M.rect(1, 4, MW - 2, 2, T.ROAD);                 // 북쪽 대로
        M.rect(MW / 2 - 2 | 0, 1, 4, MH - 2, T.ROAD);    // 샹젤리제
        M.rect(1, MH - 7, MW - 2, 2, T.ROAD);
        M.rect(6, riverY, MW - 12, 3, T.WATER);          // 센강
        [12, MW / 2 | 0, MW - 14].forEach(bx => M.rect(bx - 1, riverY, 4, 3, T.ROAD));  // 다리 셋
        M.rect(MW / 2 - 5 | 0, 6, 11, 6, T.PLAZA);       // 에펠탑 광장
        for (let i = 0; i < 6; i++) { M.deco(MW / 2 - 5 + i * 2 | 0, 12, 'lamp', true); }
        // 가로수길
        for (let x = 4; x < MW - 4; x += 3) { M.plantTree(x, 7, 0); M.plantTree(x, MH - 9, 0); }
        // 대로변 아파트 — 길 위아래로 줄지어
        M.rowHouses(3, MW / 2 - 4 | 0, 14, 3, rnd);
        M.rowHouses(MW / 2 + 4 | 0, MW - 3, 14, 3, rnd);
        M.rowHouses(3, MW / 2 - 4 | 0, 18, 3, rnd);
        M.rowHouses(MW / 2 + 4 | 0, MW - 3, 18, 3, rnd);
        M.rowHouses(3, MW / 2 - 4 | 0, 27, 4, rnd);
        M.rowHouses(MW / 2 + 4 | 0, MW - 3, 27, 4, rnd);
        for (let k = 0; k < 7; k++) M.patch(5 + (rnd() * (MW - 10) | 0), 26 + (rnd() * 8 | 0), 2 + (rnd() * 2 | 0));
        for (let k = 0; k < 5; k++) M.patch(5 + (rnd() * (MW - 10) | 0), 14 + (rnd() * 6 | 0), 2);
        M.scatterTrees(20, 14);
        for (let k = 0; k < 9; k++) M.deco(4 + (rnd() * (MW - 8) | 0), 15 + (rnd() * (MH - 24) | 0), rnd() < 0.5 ? 'bench' : 'pot', false);
        M.npcSpots = [[MW / 2 - 6 | 0, 13], [14, 9], [MW - 16, 9], [11, riverY + 5], [MW / 2 + 7 | 0, MH - 10]];
    },

    // ⛩️ 교토 — 토리이가 늘어선 참배로와 대나무숲, 연못 정원
    kyoto(M, c, rnd) {
        M.rect(MW / 2 - 2 | 0, 1, 4, MH - 2, T.ROAD);    // 참배로
        M.rect(1, 5, MW - 2, 2, T.ROAD);
        M.rect(1, MH - 8, MW - 2, 2, T.ROAD);
        for (let y = 9; y < MH - 10; y += 4) M.deco(MW / 2 - 2 | 0, y, 'torii', false);  // 참배로를 덮는 토리이 행렬
        M.pond(12, 24, 6, 4);                            // 정원 연못
        M.pond(13, 23, 2, 1);                            // 가운데 섬 (물 위에 땅)
        M.rect(12, 23, 3, 1, T.GROUND);
        M.plantTree(13, 23, 0.9);
        M.rowHouses(3, MW / 2 - 5 | 0, 9, 3, rnd);
        M.rowHouses(MW / 2 + 5 | 0, MW - 3, 9, 3, rnd);
        M.rowHouses(3, MW / 2 - 5 | 0, 14, 3, rnd);
        M.rowHouses(MW / 2 + 5 | 0, MW - 3, 14, 3, rnd);
        M.rowHouses(22, MW - 3, 20, 3, rnd);
        M.rowHouses(3, MW / 2 - 5 | 0, 29, 3, rnd);
        M.rowHouses(MW / 2 + 5 | 0, MW - 3, 29, 3, rnd);
        // 대나무숲 — 넓게
        for (let k = 0; k < 11; k++) M.patch(4 + (rnd() * (MW - 8) | 0), 10 + (rnd() * (MH - 20) | 0), 2 + (rnd() * 3 | 0));
        M.scatterTrees(22, 9);
        for (let k = 0; k < 8; k++) M.deco(4 + (rnd() * (MW - 8) | 0), 10 + (rnd() * (MH - 20) | 0), 'lantern', false);
        M.npcSpots = [[MW / 2 - 5 | 0, 12], [MW / 2 + 4 | 0, 20], [18, 27], [MW - 12, 14], [9, 9]];
    },

    // 🐫 카이로 — 모래벌판, 오아시스, 천막 시장
    cairo(M, c, rnd) {
        M.rect(1, 6, MW - 2, 3, T.ROAD);                 // 대상로
        M.rect(MW / 2 - 2 | 0, 1, 4, MH - 2, T.ROAD);
        M.rect(MW / 2 - 6 | 0, 10, 13, 6, T.PLAZA);      // 피라미드 앞 광장
        M.pond(10, 27, 5, 3);                            // 오아시스
        for (let k = 0; k < 7; k++) M.plantTree(6 + (rnd() * 10 | 0), 23 + (rnd() * 8 | 0), 0.9);
        M.pond(MW - 12, 20, 3, 2);
        // 천막 시장 — 길 양옆으로
        const onMainRoad = x => Math.abs(x - (MW / 2 | 0)) < 4;   // 세로 큰길은 비워둔다
        for (let x = 6; x < MW - 6; x += 4) {
            if (!onMainRoad(x)) M.deco(x, 10, 'tent', true);
            if (!onMainRoad(x + 2)) M.deco(x + 2, 4, 'tent', true);
        }
        M.rowHouses(3, MW / 2 - 4 | 0, 17, 3, rnd);
        M.rowHouses(MW / 2 + 4 | 0, MW - 3, 17, 3, rnd);
        M.rowHouses(20, MW - 3, 22, 3, rnd);
        M.rowHouses(3, MW - 3, 33, 3, rnd);
        for (let k = 0; k < 13; k++) M.patch(4 + (rnd() * (MW - 8) | 0), 12 + (rnd() * (MH - 20) | 0), 2 + (rnd() * 3 | 0));
        M.scatterTrees(10, 14);
        for (let k = 0; k < 7; k++) M.deco(4 + (rnd() * (MW - 8) | 0), 14 + (rnd() * (MH - 22) | 0), 'pot', false);
        M.npcSpots = [[MW / 2 - 7 | 0, 17], [12, 12], [MW - 14, 12], [13, 24], [MW / 2 + 6 | 0, 30]];
    },

    // 🏛️ 로마 — 돌광장과 분수, 무너진 기둥, 사이프러스
    roma(M, c, rnd) {
        M.rect(1, 5, MW - 2, 2, T.ROAD);
        M.rect(MW / 2 - 2 | 0, 1, 4, MH - 2, T.ROAD);
        M.rect(1, MH - 8, MW - 2, 2, T.ROAD);
        M.rect(MW / 2 - 8 | 0, 16, 17, 10, T.PLAZA);     // 중앙 포룸
        M.deco(MW / 2 | 0, 21, 'fountain', true);
        for (let i = 0; i < 5; i++) {                    // 무너진 기둥 두 줄
            M.deco(MW / 2 - 7 + i * 3 | 0, 17, 'column', true);
            M.deco(MW / 2 - 7 + i * 3 | 0, 24, 'column', true);
        }
        M.rowHouses(3, MW / 2 - 4 | 0, 9, 3, rnd);
        M.rowHouses(MW / 2 + 4 | 0, MW - 3, 9, 3, rnd);
        M.rowHouses(3, MW / 2 - 10 | 0, 13, 3, rnd);
        M.rowHouses(MW / 2 + 10 | 0, MW - 3, 13, 3, rnd);
        M.rowHouses(3, MW / 2 - 10 | 0, 28, 4, rnd);
        M.rowHouses(MW / 2 + 10 | 0, MW - 3, 28, 4, rnd);
        for (let k = 0; k < 9; k++) M.patch(4 + (rnd() * (MW - 8) | 0), 9 + (rnd() * (MH - 18) | 0), 2 + (rnd() * 2 | 0));
        for (let x = 5; x < MW - 5; x += 4) { M.plantTree(x, 8, 0.2); M.plantTree(x + 2, MH - 10, 0.2); }
        M.scatterTrees(16, 9);
        for (let k = 0; k < 6; k++) M.deco(4 + (rnd() * (MW - 8) | 0), 10 + (rnd() * (MH - 20) | 0), 'bench', false);
        M.npcSpots = [[MW / 2 - 9 | 0, 21], [MW / 2 + 9 | 0, 21], [14, 11], [MW - 13, 29], [10, 30]];
    },

    // 🗽 뉴욕 — 격자 도로, 고층 블록, 센트럴파크
    ny(M, c, rnd) {
        for (let y = 5; y < MH - 4; y += 7) M.rect(1, y, MW - 2, 3, T.ROAD);      // 가로 애비뉴
        for (let x = 5; x < MW - 4; x += 9) M.rect(x, 1, 3, MH - 2, T.ROAD);      // 세로 스트리트
        // 센트럴파크 — 이 도시의 유일한 녹지 (나무를 먼저 심어야 자리가 남는다)
        M.rect(16, 12, 13, 17, T.GROUND);
        for (let k = 0; k < 120; k++) M.plantTree(17 + (rnd() * 11 | 0), 13 + (rnd() * 15 | 0), rnd());

let nodes = [], hearts = [];
function spawnNodes(c, n) {

    while (nodes.length < n) {
        const tx = 1 + Math.floor(rnd() * (MW - 2)), ty = 6 + Math.floor(rnd() * (MH - 12));
        const t = tileAt(tx, ty);
        if (t !== T.GROUND && t !== T.GRASS) continue;
        const mi = Math.floor(rnd() * c.mats.length);
        nodes.push({ x: tx * TS + TS / 2, y: ty * TS + TS / 2, mat: c.mats[mi], k: mi, bob: rnd() * 6 });

}
function buildHearts(c) {

    while (hearts.length < 3 && guard++ < 900) {
        const tx = 2 + Math.floor(rnd() * (MW - 4)), ty = 7 + Math.floor(rnd() * (MH - 14));
        if (!WALKABLE[tileAt(tx, ty)]) continue;
        const key = c.id + hearts.length;

}

let npcs = [];
function placeNpcs(c) {
    npcs = [];

    (MAP.npcSpots || []).forEach((sp, i) => {
        if (!list[i]) return;
        let best = null;
        for (let r = 0; r < 7 && !best; r++)
            for (let j = -r; j <= r && !best; j++) for (let k = -r; k <= r && !best; k++) {
                const tx = sp[0] + k, ty = sp[1] + j;
                if (WALKABLE[tileAt(tx, ty)] && tileAt(tx, ty) !== T.DOOR && tileAt(tx, ty) !== T.PORT) best = { tx, ty };
            }
        if (best) npcs.push(Object.assign({}, list[i], { x: best.tx * TS + TS / 2, y: best.ty * TS + TS - 2 }));
    });
    // 🏺 떠돌이 상인 — 도시 어딘가에 숨어 있다
    if (G.unlock && G.unlock.merchant) {

}

function canWalk(x, y) {

function updateWorld(dt) {
    const sp = moveSpeed();

    const mag = Math.hypot(dx, dy);
    if (mag > 1) { dx /= mag; dy /= mag; }
    if (mag > 0.12) {
        P.dir = Math.atan2(dy, dx);
        P.walk += dt * (4 + mag * 7);
        const nx = P.x + dx * sp * dt, ny = P.y + dy * sp * dt;
        // 축별로 따로 밀어서 벽에 비벼도 매끄럽게 미끄러지도록
        if (canWalk(nx, P.y)) P.x = nx;
        if (canWalk(P.x, ny)) P.y = ny;
        if (Math.floor(P.walk) !== Math.floor(P.walk - dt * 6)) S.step();
        G.steps += mag * dt * 3;

        // 풀숲을 걸으면 몬스터가 나온다
        const t = tileAt(Math.floor(P.x / TS), Math.floor(P.y / TS));
        if (t === T.GRASS) {
            encounterGauge += dt * mag * (0.42 + Math.random() * 0.3);
            if (encounterGauge > 1.15) { encounterGauge = 0; startBattle(null); return; }
        } else encounterGauge = Math.max(0, encounterGauge - dt * 0.25);
    } else P.walk *= 0.9;

    G.px = P.x; G.py = P.y;
    G.playT += dt;

    // 재료 줍기
    for (let i = nodes.length - 1; i >= 0; i--) {
        const n = nodes[i];
        const d0 = Math.hypot(n.x - P.x, n.y - P.y);
        if (d0 < pickRadius()) {
            if (d0 > 12) {   // 자석 — 멀리 있는 건 빨려온다
                n.x += (P.x - n.x) * Math.min(1, dt * 7);
                n.y += (P.y - n.y) * Math.min(1, dt * 7);
                continue;
            }
            const got = pickCount();
            G.mats[n.mat.n] = (G.mats[n.mat.n] || 0) + got;
            nodes.splice(i, 1);
            S.pick();
            pop(n.x, n.y, n.mat.i + (got > 1 ? ' ×' + got : ''), n.mat.c);
        }
    }
    if (nodes.length < 26 && Math.random() < dt * 0.9) spawnNodes(city(), 26);
    // 알바생 — 멀리 있는 재료를 알아서 주워온다

        G.partT = (G.partT || 0) + dt * part;
        while (G.partT >= 4) {
            G.partT -= 4;
            const n2 = nodes.pop();

        }

            h.got = true; G.hearts[h.key] = true;
            S.levelup();
            const total = letterCount();
            pop(h.x, h.y, '💗', '#ff8fc7');
            const line = STORY.letter[total - 1] || '';
            const cg = cityHearts(city());
            msg('💗', '편지 조각 ' + total + '/15',
                '<b style="color:#c04a60">' + line + '</b><br><br>' +
                '동훈이가 수첩 뒷장에 적어둔 <b>하고 싶은 것</b> 목록이다.<br><br>' +
                (cg >= 3
                  ? '🎉 <b>' + city().name + '의 조각을 전부 찾았어요!</b><br>이제 랜드마크에서 보스에게 도전할 수 있어요.'
                  : '<b>' + city().name + '</b> 조각 ' + cg + ' / 3 — 세 개를 다 찾으면 보스에게 도전할 수 있어요.'));

    // 랜드마크 앞에 라이벌 커플이 서 있다
    const dl = Math.hypot((MW / 2) * TS - P.x, 3 * TS + 17 - P.y);

    }
    if (nearNpc) nx = { kind:'npc', i: nearNpc.merchant ? '🏺' : '💬', t:nearNpc.n, npc:nearNpc };
    else if (dl < 31 && !G.boss[city().id]) {
        const got = cityHearts(city());

    }

    }

    updateCusts(dt);
    updatePetTrail(dt);
    updatePops(dt);

let cam = { x:0, y:0 };

// 타일마다 "항상 같은" 난수 — 꽃/돌멩이가 프레임마다 떨리지 않게
function th(tx, ty, salt) {
    let h = (tx * 374761393 + ty * 668265263 + (salt || 0) * 1274126177) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function shade(hex, amt) {

    const r = cl((n >> 16) + amt), g = cl(((n >> 8) & 255) + amt), b = cl((n & 255) + amt);
    return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
// 도트 스프라이트: 먼저 실루엣을 외곽선 색으로 한 겹 깔고 그 위에 칠한다
function sprite(parts, out, s, ox, oy) {
    s = s || 1; ox = ox || 0; oy = oy || 0;
    for (const q of parts) R(ox + (q[0] - 1) * s, oy + (q[1] - 1) * s, (q[2] + 2) * s, (q[3] + 2) * s, out);
    for (const q of parts) R(ox + q[0] * s, oy + q[1] * s, q[2] * s, q[3] * s, q[4]);

// ───────── 바닥 타일 (16×16 도트) ─────────
let TH = THEME.paris;
function drawGroundTile(tx, ty, p) {
    const t = tileAt(tx, ty), X = tx * TS, Y = ty * TS;
    const isP = v => v === T.ROAD || v === T.PORT || v === T.DOOR;

    if (t === T.WATER) {
        R(X, Y, 16, 16, p.a1);
        for (let i = 0; i < 3; i++) {
            const wy = Y + 3 + i * 5, off = ((gameT * 6 + tx * 5 + i * 7) | 0) % 16;
            R(X + off, wy, 4, 1, p.a0);
            R(X + ((off + 8) % 16), wy + 2, 3, 1, p.a0);
        }
        if (tileAt(tx, ty - 1) !== T.WATER) R(X, Y, 16, 2, p.a2);
        if (tileAt(tx, ty + 1) !== T.WATER) R(X, Y + 14, 16, 2, p.a2);
        if (tileAt(tx - 1, ty) !== T.WATER) R(X, Y, 2, 16, p.a2);
        if (tileAt(tx + 1, ty) !== T.WATER) R(X + 14, Y, 2, 16, p.a2);
        return;
    }

    if (t === T.PLAZA) {   // 돌 광장 — 큼직한 판석
        R(X, Y, 16, 16, p.p0);
        R(X, Y, 16, 1, p.p2); R(X, Y, 1, 16, p.p2);
        R(X + 8, Y, 1, 16, shade(p.p0, -14)); R(X, Y + 8, 16, 1, shade(p.p0, -14));
        if (th(tx, ty, 31) > 0.7) R(X + 3, Y + 11, 3, 1, p.p2);
        return;
    }

    if (isP(t)) {
        if (TH.pave === 'asphalt') {
            R(X, Y, 16, 16, p.p1);
            for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++)
                if (th(tx * 4 + i, ty * 4 + j, 11) > 0.72) R(X + i * 4 + 1, Y + j * 4 + 1, 1, 1, p.p2);
            // 차선: 사방이 길인 '가운데 차선'에만. 교차로는 횡단보도.
            const mid = isP(tileAt(tx, ty - 1)) && isP(tileAt(tx, ty + 1)) && isP(tileAt(tx - 1, ty)) && isP(tileAt(tx + 1, ty));
            if (mid) {
                const vRoad = isP(tileAt(tx, ty - 2)) && isP(tileAt(tx, ty + 2));
                const hRoad = isP(tileAt(tx - 2, ty)) && isP(tileAt(tx + 2, ty));
                if (vRoad && hRoad) {   // 교차로 — 횡단보도
                    for (let k = 0; k < 4; k++) R(X + 1 + k * 4, Y + 1, 2, 14, shade(p.p0, 40));
                } else if (vRoad) { if ((ty & 1) === 0) R(X + 7, Y + 2, 2, 12, '#ffd43b'); }
                else if (hRoad) { if ((tx & 1) === 0) R(X + 2, Y + 7, 12, 2, '#ffd43b'); }
            }
        } else if (TH.pave === 'stone') {
            R(X, Y, 16, 16, p.p1);
            for (let j = 0; j < 4; j++) {          // 포석 엇갈리게
                const off = (j & 1) ? 2 : 0;
                for (let i = -1; i < 4; i++) {
                    const cx = X + off + i * 5, cy = Y + j * 4;
                    if (cx + 4 <= X || cx >= X + 16) continue;
                    R(Math.max(X, cx), cy, Math.min(4, X + 16 - cx), 3, th(tx * 7 + i, ty * 7 + j, 12) > 0.5 ? p.p0 : shade(p.p0, -16));
                }
            }
        } else if (TH.pave === 'gravel') {
            R(X, Y, 16, 16, p.p1);
            for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++)
                if (th(tx * 8 + i, ty * 8 + j, 13) > 0.62) R(X + i * 2, Y + j * 2, 2, 1, p.p0);
        } else {   // 모래길
            R(X, Y, 16, 16, p.p1);
            for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
                const r = th(tx * 4 + i, ty * 4 + j, 11);
                if (r > 0.6) { R(X + i * 4 + 1, Y + j * 4 + 1, 3, 1, p.p0); }
                else if (r < 0.22) R(X + i * 4 + 2, Y + j * 4 + 2, 1, 1, p.p2);
            }
        }
        if (!isP(tileAt(tx, ty - 1)) && tileAt(tx, ty - 1) !== T.PLAZA) R(X, Y, 16, 1, p.p2);
        if (!isP(tileAt(tx, ty + 1)) && tileAt(tx, ty + 1) !== T.PLAZA) R(X, Y + 15, 16, 1, p.p2);
        if (!isP(tileAt(tx - 1, ty)) && tileAt(tx - 1, ty) !== T.PLAZA) R(X, Y, 1, 16, p.p2);
        if (!isP(tileAt(tx + 1, ty)) && tileAt(tx + 1, ty) !== T.PLAZA) R(X + 15, Y, 1, 16, p.p2);
        return;
    }

    if (t === T.GRASS) {
        R(X, Y, 16, 16, TH.enc === 'dune' ? shade(p.g1, -18) : p.t2);
        if (TH.enc === 'bamboo') {          // 대나무숲
            for (let k = 0; k < 3; k++) {
                const bx = X + 2 + k * 5, sw = Math.sin(gameT * 1.6 + tx + k) > 0 ? 0 : 1;
                R(bx + sw, Y, 3, 16, p.t0);
                R(bx + sw, Y + 4, 3, 1, p.t1); R(bx + sw, Y + 11, 3, 1, p.t1);
                R(bx + sw, Y, 1, 16, p.t1);
            }
        } else if (TH.enc === 'dune') {     // 모래언덕 — 봉긋한 둔덕
            const dk = shade(p.g2, -22), md = p.g2, lt = shade(p.g2, 34);
            R(X, Y + 10, 16, 6, dk);
            R(X + 1, Y + 7, 14, 4, md);
            R(X + 3, Y + 5, 10, 3, md);
            R(X + 5, Y + 3, 6, 3, lt);
            R(X + 4, Y + 5, 8, 1, lt);
            R(X + 2, Y + 8, 5, 1, lt); R(X + 9, Y + 9, 5, 1, lt);
            R(X, Y + 13, 16, 1, dk);
            for (let k = 0; k < 3; k++) R(X + 1 + k * 6, Y + 11, 3, 1, shade(dk, -18));
        } else if (TH.enc === 'ruin') {     // 무너진 돌더미
            R(X + 1, Y + 7, 7, 6, p.w1); R(X + 8, Y + 4, 6, 9, p.w0);
            R(X + 1, Y + 7, 7, 1, p.w0); R(X + 8, Y + 4, 6, 1, '#ffffff');
            R(X + 2, Y + 13, 12, 2, p.w2);
            R(X + 4, Y + 9, 2, 2, p.t1);
        } else {                            // 수풀 / 덤불
            for (let k = 0; k < 2; k++) {
                const gx = X + 1 + k * 8, gy = Y + 5 + (k ? 3 : 0);
                const sw = Math.sin(gameT * 2 + tx + ty + k) > 0 ? 0 : 1;
                R(gx + sw, gy, 2, 3, p.t0); R(gx + 4 + sw, gy, 2, 3, p.t0);
                R(gx, gy + 3, 7, 4, p.t1);
                R(gx, gy + 6, 7, 1, p.t2);
                R(gx + 1, gy + 4, 2, 1, p.t0);
            }
        }
        return;
    }

    // 평지
    if (TH.ground === 'sand') {
        R(X, Y, 16, 16, p.g1);
        for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
            const r = th(tx * 4 + i, ty * 4 + j, 3);
            if (r > 0.78) R(X + i * 4, Y + j * 4 + 1, 4, 1, p.g0);
            else if (r < 0.16) R(X + i * 4 + 1, Y + j * 4 + 2, 2, 1, p.g2);
        }
        if (th(tx, ty, 7) > 0.93) {   // 작은 돌
            const sx = X + 4 + ((th(tx, ty, 8) * 7) | 0), sy = Y + 6 + ((th(tx, ty, 9) * 6) | 0);
            R(sx, sy, 4, 3, p.g2); R(sx, sy, 4, 1, shade(p.g2, 26));
        }
        return;
    }
    R(X, Y, 16, 16, p.g1);
    for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) {
        const r = th(tx * 4 + i, ty * 4 + j, 3);
        if (r > 0.8) R(X + i * 4 + 1, Y + j * 4 + 1, 2, 1, p.g0);
        else if (r < 0.14) { R(X + i * 4 + 1, Y + j * 4 + 2, 1, 1, p.g2); R(X + i * 4 + 2, Y + j * 4 + 1, 1, 1, p.g2); }
    }
    const d = th(tx, ty, 7);
    if (d > 0.9) {
        const fx = X + 3 + ((th(tx, ty, 8) * 9) | 0), fy = Y + 4 + ((th(tx, ty, 9) * 8) | 0);
        const col = d > 0.95 ? p.f0 : p.f1;
        R(fx, fy + 2, 1, 2, p.g2);
        R(fx - 1, fy, 3, 1, col); R(fx, fy - 1, 1, 3, col);
        R(fx, fy, 1, 1, '#ffffff');
    }
}

// ───────── 나무 (도시마다 수종이 다르다) ─────────
function drawTree(t, p) {
    const X = t.x * TS, Y = t.y * TS;
    R(X + 4, Y + 14, 8, 2, 'rgba(0,0,0,.25)');
    const sw = Math.sin(gameT * 1.1 + t.x) > 0 ? 0 : 1;
    if (TH.tree === 'palm') {
        sprite([[X + 6, Y - 4, 4, 19, '#a8834c'],
                [X - 2 + sw, Y - 10, 8, 3, p.tr1], [X + 10 - sw, Y - 10, 8, 3, p.tr1],
                [X - 3 + sw, Y - 7, 7, 3, p.tr1], [X + 12 - sw, Y - 7, 7, 3, p.tr1],
                [X + 3, Y - 14, 10, 4, p.tr1]], p.out);
        R(X + 6, Y - 11, 4, 3, '#c89a52');
        for (let k = 0; k < 3; k++) R(X + 5 + k * 2, Y + 2 + k * 4, 2, 2, '#8a6a3a');
    } else if (TH.tree === 'cypress') {
        sprite([[X + 6, Y + 6, 4, 9, '#7a5230'],
                [X + 5, Y - 20, 6, 8, p.tr1], [X + 4, Y - 13, 8, 9, p.tr1], [X + 5, Y - 5, 6, 7, p.tr1]], p.out);
        R(X + 5, Y - 18, 2, 6, p.tr0); R(X + 9, Y - 10, 2, 7, p.tr2);
    } else if (TH.tree === 'sakura') {
        sprite([[X + 6, Y + 1, 4, 14, '#6b4a2c'],
                [X + 4, Y - 17, 8, 4, '#ffb7d5'], [X + 2, Y - 14, 12, 5, '#ffb7d5'],
                [X + 1, Y - 10, 14, 6, '#ffb7d5'], [X + 3, Y - 5, 10, 5, '#ffb7d5']], p.out);
        R(X + 3, Y - 13, 4, 3, '#ffe0ee'); R(X + 10, Y - 4, 3, 3, '#f090b8');
        R(X + 4, Y - 16, 2, 2, '#ffe0ee');
        if (((gameT * 2 + t.x) | 0) % 5 === 0) R(X + 14, Y - 2, 2, 2, '#ffd0e4');
    } else if (TH.tree === 'pine') {
        sprite([[X + 6, Y + 6, 4, 9, '#5c4330'],
                [X + 6, Y - 20, 4, 5, p.tr1], [X + 4, Y - 16, 8, 5, p.tr1],
                [X + 2, Y - 11, 12, 5, p.tr1], [X + 1, Y - 6, 14, 6, p.tr1]], p.out);
        R(X + 5, Y - 15, 3, 3, p.tr0); R(X + 9, Y - 5, 4, 3, p.tr2);
    } else {
        sprite([[X + 6, Y + 1, 4, 14, '#7a5230'],
                [X + 4, Y - 18, 8, 4, p.tr1], [X + 2, Y - 15, 12, 5, p.tr1],
                [X + 1, Y - 11, 14, 7, p.tr1], [X + 2, Y - 5, 12, 5, p.tr1], [X + 4, Y - 1, 8, 3, p.tr1]], p.out);
        R(X + 3, Y - 14, 4, 3, p.tr0); R(X + 2, Y - 10, 3, 3, p.tr0); R(X + 5, Y - 17, 3, 2, p.tr0);
        R(X + 9, Y - 4, 4, 3, p.tr2); R(X + 10, Y - 10, 3, 3, p.tr2);
    }
    R(X + 7, Y + 5, 2, 9, '#5c3c22');
}

// ───────── 도시 장식물 ─────────
function drawDeco(d, p) {
    const X = d.x * TS, Y = d.y * TS;
    switch (d.kind) {
        case 'torii': {   // 길 위를 가로지르는 붉은 문
            const w = TS * 4;
            sprite([[X - 4, Y - 26, w + 8, 5, '#c92a2a'],
                    [X + 2, Y - 19, w - 4, 4, '#c92a2a'],
                    [X + 1, Y - 22, 5, 30, '#c92a2a'],
                    [X + w - 6, Y - 22, 5, 30, '#c92a2a']], p.out);
            R(X + 1, Y - 21, 2, 28, '#e86a6a'); R(X + w - 6, Y - 21, 2, 28, '#e86a6a');
            R(X - 6, Y - 29, w + 12, 3, '#8b1f1f');
            R(X - 4, Y - 26, w + 8, 1, '#e86a6a');
            break;
        }
        case 'fountain':
            sprite([[X - 2, Y + 2, 20, 12, p.w1], [X + 5, Y - 10, 6, 13, p.w0], [X + 2, Y - 14, 12, 4, p.w0]], p.out);
            R(X, Y + 4, 16, 7, p.a1);
            for (let k = 0; k < 3; k++) {
                const o = ((gameT * 8 + k * 3) | 0) % 6;
                R(X + 3 + k * 5, Y - 8 + o, 2, 3, p.a0);
            }
            R(X + 6, Y - 13, 4, 2, '#ffffff');
            break;
        case 'column':
            sprite([[X + 3, Y - 20, 10, 24, p.w0]], p.out);
            for (let k = 0; k < 5; k++) R(X + 5 + (k & 1) * 3, Y - 18 + k * 5, 2, 4, p.w2);
            R(X + 1, Y - 23, 14, 4, p.w1); R(X + 1, Y - 23, 14, 1, '#ffffff');
            R(X + 2, Y + 2, 12, 3, p.w1);
            break;
        case 'tent': {
            const col = ((d.x + d.y) & 1) ? '#c9553f' : '#3f7fa8';
            sprite([[X - 2, Y - 2, 20, 12, '#e8d9b0'], [X - 4, Y - 10, 24, 9, col]], p.out);
            for (let k = 0; k < 5; k++) R(X - 3 + k * 5, Y - 10, 2, 9, '#fff4e2');
            R(X - 2, Y + 2, 6, 6, '#b08848'); R(X + 10, Y + 2, 6, 6, '#b08848');
            break;
        }
        case 'lantern':
            sprite([[X + 5, Y - 2, 6, 8, '#f0c04a'], [X + 6, Y + 6, 4, 8, '#5c4330']], p.out);
            R(X + 5, Y, 6, 1, '#8a5a1a'); R(X + 5, Y + 3, 6, 1, '#8a5a1a');
            R(X + 6, Y - 1, 2, 2, '#fff0b0');
            break;
        case 'lamp':
            sprite([[X + 6, Y - 10, 4, 24, '#6c7a8c'], [X + 4, Y - 16, 8, 7, '#fff0b0']], p.out);
            R(X + 5, Y - 15, 3, 3, '#ffffff');
            break;
        case 'hydrant':
            sprite([[X + 5, Y + 4, 6, 10, '#d93b3b'], [X + 4, Y + 1, 8, 4, '#d93b3b'],
                    [X + 2, Y + 7, 12, 3, '#b02a2a']], p.out);
            R(X + 6, Y + 2, 2, 2, '#ff8a8a');
            break;
        case 'bench':
            sprite([[X + 2, Y + 7, 12, 3, '#b07a48'], [X + 2, Y + 2, 12, 2, '#b07a48'],
                    [X + 3, Y + 10, 2, 4, '#7a5230'], [X + 11, Y + 10, 2, 4, '#7a5230']], p.out);
            R(X + 2, Y + 7, 12, 1, '#d09a68');
            break;
        default:   // 화분
            sprite([[X + 5, Y + 8, 6, 6, '#c87a52'], [X + 6, Y + 3, 4, 5, p.tr1]], p.out);
            R(X + 5, Y + 8, 6, 1, '#e8a070');
            R(X + 6, Y + 2, 2, 2, p.f0); R(X + 9, Y + 3, 2, 2, p.f0);
    }
}

// ───────── NPC ─────────
function drawNpcPix(n) {
    const X = Math.round(n.x) - 6, Y = Math.round(n.y) - 18;
    const L = n.look, bob = (Math.sin(gameT * 1.8 + n.x) > 0.6) ? 1 : 0;
    R(X + 2, Y + 18, 8, 2, 'rgba(0,0,0,.22)');
    const kid = L.t === 'kid', oy = Y + (kid ? 4 : 0) + bob;
    const parts = [
        [X + 1, oy + 0, 10, 9, L.hair],
        [X + 2, oy + 3, 8, 6, SK.skin],
        [X + 1, oy + 0, 10, 4, L.hair],
        [X + 3, oy + 5, 2, 2, SK.eye], [X + 7, oy + 5, 2, 2, SK.eye],
        [X + 3, oy + 10, 6, 4, L.cloth],
        [X + 2, oy + 13, 8, 3, L.cloth],
        [X + 1, oy + 10, 2, 4, SK.skin], [X + 9, oy + 10, 2, 4, SK.skin],
        [X + 3, oy + 16, 2, 2, '#46304e'], [X + 7, oy + 16, 2, 2, '#46304e'],
    ];
    if (L.t === 'woman') { parts.push([X + 0, oy + 2, 2, 8, L.hair], [X + 10, oy + 2, 2, 8, L.hair]); }
    if (L.t === 'old') { parts.push([X + 2, oy + 8, 8, 2, '#dcdcdc'], [X + 11, oy + 10, 2, 8, '#8a6a4a']); }
    if (L.t === 'man') { parts.push([X + 1, oy + 0, 10, 2, shade(L.hair, -20)]); }
    sprite(parts, SK.out);
    R(X + 4, oy + 8, 4, 1, '#c08070');
    if (((gameT * 1.2 + n.x) | 0) % 7 === 0) { R(X + 11, oy - 4, 2, 4, '#fff8ef'); R(X + 10, oy - 5, 4, 2, '#fff8ef'); }
}

// ───────── 건물 ─────────
function drawBuilding(b, p, c, isShop) {
    const X = b.x * TS, Y = b.y * TS, Wd = b.w * TS, Hd = b.h * TS;
    const rh = 12;
    R(X + 2, Y + Hd, Wd, 2, 'rgba(0,0,0,.22)');
    // 벽
    R(X - 1, Y - 1, Wd + 2, Hd + 2, p.out);
    R(X, Y, Wd, Hd, p.w1);
    R(X, Y, Wd, 2, p.w0);
    R(X, Y, 2, Hd, p.w0);
    for (let j = 4; j < Hd - 2; j += 6) R(X + 1, Y + j, Wd - 2, 1, p.w2);
    // 지붕 — 줄마다 넓어지는 사다리꼴. 외곽선은 양 끝에만 찍어야 지붕색이 살아남는다
    const rowW = [], rowX = [];
    for (let i = 0; i < rh; i++) {
        const t = i / (rh - 1);
        rowW[i] = Math.round(Wd * 0.46 + (Wd + 8) * 0.54 * t);
        rowX[i] = Math.round(X + Wd / 2 - rowW[i] / 2);
    }
    R(rowX[0] - 1, Y - rh - 1, rowW[0] + 2, 1, p.out);
    for (let i = 0; i < rh; i++) {
        const ry = Y - rh + i;
        R(rowX[i], ry, rowW[i], 1, i < 2 ? p.r0 : (i >= rh - 2 ? p.r2 : p.r1));
        if (i % 3 === 2) for (let k = 3; k < rowW[i] - 3; k += 5) R(rowX[i] + k, ry, 2, 1, p.r2);
        R(rowX[i] - 1, ry, 1, 1, p.out);
        R(rowX[i] + rowW[i], ry, 1, 1, p.out);
    }
    R(rowX[rh - 1] - 1, Y, rowW[rh - 1] + 2, 1, p.out);
    // 창문
    const cols = Math.max(1, Math.floor(b.w / 2)), rows = Math.max(1, b.h - 1);
    for (let r2 = 0; r2 < rows; r2++) for (let i = 0; i < cols; i++) {
        const wx = Math.round(X + (Wd / cols) * (i + 0.5) - 4);
        const wy = Math.round(Y + 5 + r2 * ((Hd - 10) / Math.max(1, rows - 0.5)));
        if (wy + 9 > Y + Hd - 3) continue;
        const lit = th(b.x + i, b.y + r2, 5) > 0.42;
        R(wx - 1, wy - 1, 10, 11, p.out);
        R(wx, wy, 8, 9, lit ? '#ffe08c' : p.a0);
        R(wx, wy, 8, 1, lit ? '#fff4c4' : '#ffffff');
        R(wx + 3, wy, 2, 9, p.out); R(wx, wy + 4, 8, 1, p.out);
        R(wx - 2, wy + 9, 12, 2, p.w2);
    }
    if (isShop) {
        const d = MAP.door, DX = d.x * TS, DY = d.y * TS;
        // 차양
        for (let i = 0; i < 10; i++) R(DX - 4 + i * 2, DY - 6, 2, 5, i % 2 ? '#fff4e2' : p.r1);
        R(DX - 5, DY - 7, 22, 1, p.out);
        R(DX - 5, DY - 1, 22, 1, p.out);
        // 문
        R(DX + 3, DY + 2, 10, 14, p.out);
        R(DX + 4, DY + 3, 8, 13, '#8a5a34');
        R(DX + 5, DY + 4, 6, 4, p.a0);
        R(DX + 10, DY + 10, 1, 2, '#ffd43b');
    }
}

// ───────── 재료 / 하트 / 라이벌 커플 ─────────
function drawNode(n) {
    const b = (Math.sin(gameT * 3 + n.bob) * 1.5) | 0;
    const X = Math.round(n.x) - 5, Y = Math.round(n.y) - 6 + b;
    const col = n.mat.c, dk = shade(col, -55), lt = shade(col, 55);
    R(X + 1, Y + 12 - b, 8, 2, 'rgba(0,0,0,.22)');
    let parts;
    switch (n.k & 3) {
        case 0:  // 자루
            parts = [[X + 1, Y + 4, 9, 7, col], [X + 2, Y + 2, 7, 3, dk],
                     [X + 3, Y + 1, 5, 2, dk], [X + 2, Y + 5, 3, 3, lt]];
            break;
        case 1:  // 네모 덩어리 (버터·치즈 같은 것)
            parts = [[X + 1, Y + 3, 9, 8, col], [X + 1, Y + 3, 9, 2, lt],
                     [X + 1, Y + 9, 9, 2, dk], [X + 3, Y + 6, 2, 2, lt]];
            break;
        case 2:  // 둥근 열매
            parts = [[X + 2, Y + 3, 7, 8, col], [X + 1, Y + 5, 9, 5, col],
                     [X + 3, Y + 5, 3, 2, lt], [X + 4, Y, 3, 3, '#5c9e3c'], [X + 6, Y + 1, 2, 2, '#8ace6a']];
            break;
        default: // 조각/잎
            parts = [[X + 1, Y + 3, 9, 8, col], [X + 5, Y + 3, 5, 8, dk],
                     [X + 2, Y + 4, 3, 3, lt], [X + 1, Y + 7, 9, 1, dk]];
    }
    sprite(parts, '#2a1c18');
    if (((gameT * 3 + n.bob) | 0) % 4 === 0) { R(X + 8, Y, 2, 1, '#ffffff'); R(X + 8, Y - 1, 1, 3, '#ffffff'); }
}
function drawHeart(h) {
    const b = (Math.sin(gameT * 2.4 + h.x) * 1.6) | 0;
    const X = Math.round(h.x) - 4, Y = Math.round(h.y) - 5 + b;

    R(X + 1, Y + 2, 2, 2, '#ffc0da');
}
function drawCouple(c, bx, by) {

// ───────── 월드 ─────────
function drawWorld() {
    const c = city(), p = c.pal;
    px.fillStyle = p.sky; px.fillRect(0, 0, VW, VH);

    cam.x = Math.round(P.x - VW / 2);
    cam.y = Math.round(P.y - VH / 2);
    cam.x = Math.max(0, Math.min(MW * TS - VW, cam.x));
    cam.y = Math.max(0, Math.min(MH * TS - VH, cam.y));

    px.save();
    px.translate(-cam.x, -cam.y);

    const x0 = Math.max(0, (cam.x / TS | 0) - 1), x1 = Math.min(MW, ((cam.x + VW) / TS | 0) + 2);
    const y0 = Math.max(0, (cam.y / TS | 0) - 2), y1 = Math.min(MH, ((cam.y + VH) / TS | 0) + 3);

    for (let ty = y0; ty < y1; ty++) for (let tx = x0; tx < x1; tx++) drawGroundTile(tx, ty, p);

    drawLandmark(c, p);

    // 공항
    {
        const pt = MAP.port, X = pt.x * TS, Y = pt.y * TS;
        R(X - TS, Y, TS * 3, TS * 2, p.p0);
        R(X - TS, Y, TS * 3, 1, p.p2); R(X - TS, Y + TS * 2 - 1, TS * 3, 1, p.p2);
        for (let i = 0; i < 5; i++) R(X - TS + 3 + i * 9, Y + TS - 1, 5, 2, '#ffd43b');
        drawPlane(X + 2, Y + 4 + ((Math.sin(gameT * 2) * 1.5) | 0));
    }

    const items = [];
    const doorBlock = MAP.blocks.find(b => MAP.door.x >= b.x && MAP.door.x < b.x + b.w && MAP.door.y >= b.y && MAP.door.y < b.y + b.h);
    MAP.blocks.forEach(b => {
        if ((b.y + b.h) * TS < cam.y - TS * 3 || b.y * TS > cam.y + VH + TS * 3) return;
        items.push({ y: (b.y + b.h) * TS, f: () => drawBuilding(b, p, c, b === doorBlock) });
    });
    if (!doorBlock) items.push({ y: (MAP.door.y + 1) * TS, f: () => drawBuilding({ x: MAP.door.x - 1, y: MAP.door.y - 1, w: 3, h: 2 }, p, c, true) });
    (MAP.trees || []).forEach(t => {
        if (t.y * TS < cam.y - TS * 3 || t.y * TS > cam.y + VH + TS * 2) return;
        items.push({ y: (t.y + 1) * TS, f: () => drawTree(t, p) });
    });
    (MAP.decos || []).forEach(d => {
        if (d.y * TS < cam.y - TS * 3 || d.y * TS > cam.y + VH + TS * 2) return;
        items.push({ y: (d.y + 1) * TS, f: () => drawDeco(d, p) });
    });
    npcs.forEach(n => items.push({ y: n.y, f: () => drawNpcPix(n) }));
    custs.forEach(c2 => { if (c2.state === 'in') items.push({ y: c2.y, f: () => drawNpcPix({ x: c2.x, y: c2.y, look: c2.look }) }); });
    { const pp = petWorldPos();
      if (pp) items.push({ y: pp.y - 1, f: () => drawMobPix(G.pet, pp.x, pp.y + 4, 1, gameT, 0) }); }
    for (const n of nodes) items.push({ y: n.y + 4, f: () => drawNode(n) });
    for (const h of hearts) if (!h.got) items.push({ y: h.y + 4, f: () => drawHeart(h) });
    if (!G.boss[c.id]) {
        const bx = (MW / 2) * TS, by = 3 * TS + 17;
        items.push({ y: by, f: () => drawCouple(c, bx, by) });
    }
    items.push({ y: P.y, f: () => drawHeroPix(P.x, P.y, P.dir, P.walk) });
    items.sort((a, b) => a.y - b.y);
    items.forEach(i => i.f());

    px.restore();
    blit();

    // ── 여기부터는 선명하게 보여야 하는 것들이라 원래 해상도로 덧그린다
    const toScr = (wx, wy) => [(wx - cam.x) * Z, (wy - cam.y) * Z];
    ctx.textAlign = 'center';
    if (!G.boss[c.id]) {
        const [lx, ly] = toScr((MW / 2) * TS, 3 * TS + 17);
        label(lx, ly - 46, '⚔️ ' + c.boss.wife + ' & ' + c.boss.n, '#c04a60');
    }
    {
        const db = MAP.blocks.find(b => MAP.door.x >= b.x && MAP.door.x < b.x + b.w);
        const sy = db ? db.y * TS - 14 : MAP.door.y * TS - 14;
        const [lx, ly] = toScr((db ? (db.x + db.w / 2) : MAP.door.x + 0.5) * TS, sy);
        label(lx, ly, c.shop.i + ' ' + c.shop.n, '#8a5a34');
    }
    for (const pp of pops) {
        const [sx, sy] = toScr(pp.x, pp.y - 10);
        ctx.globalAlpha = Math.min(1, pp.life * 1.5);
        ctx.font = 'bold 15px sans-serif';
        ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(40,25,45,.75)';
        ctx.strokeText(pp.txt, sx, sy); ctx.fillStyle = pp.color; ctx.fillText(pp.txt, sx, sy);
        ctx.globalAlpha = 1;
    }
    drawStick();
    drawMiniMap();
}
function label(x, y, text, col) {
    ctx.font = 'bold 12px sans-serif';
    const w = ctx.measureText(text).width + 16;
    ctx.fillStyle = 'rgba(42,28,24,.85)';
    rr(x - w / 2, y - 15, w, 20, 7); ctx.fill();
    ctx.fillStyle = '#fff6ec'; ctx.fillText(text, x, y - 1);
}
function drawPlane(X, Y) {
    sprite([[X + 2, Y + 4, 12, 3, '#f0f4ff'], [X + 6, Y + 1, 3, 9, '#dde4f2'], [X + 12, Y + 2, 2, 3, '#dde4f2']], '#2a1c18');
    R(X + 3, Y + 5, 3, 1, '#7cc4f0');
}

// ───────── 조이스틱 / 미니맵 (원래 해상도) ─────────
function drawStick() {
    if (!stick.on) return;
    ctx.save();
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(stick.ox, stick.oy, STICK_R, 0, 7); ctx.fill();
    ctx.globalAlpha = 0.85; ctx.fillStyle = '#fff8ef';
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * STICK_R, stick.oy + stick.dy * STICK_R, 22, 0, 7); ctx.fill();
    ctx.globalAlpha = 1; ctx.strokeStyle = '#e8597a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(stick.ox + stick.dx * STICK_R, stick.oy + stick.dy * STICK_R, 22, 0, 7); ctx.stroke();
    ctx.restore();
}
function drawMiniMap() {
    const sc = 2.1, mw = MW * sc, mh = MH * sc, X = 12, Y = H - mh - (TK ? Math.min(150, H * 0.22) + 34 : 20);
    ctx.save();
    ctx.globalAlpha = 0.92;
    ctx.fillStyle = 'rgba(42,28,24,.8)';
    rr(X - 6, Y - 6, mw + 12, mh + 12, 10); ctx.fill();
    ctx.strokeStyle = '#fff6ec'; ctx.lineWidth = 2;
    rr(X - 6, Y - 6, mw + 12, mh + 12, 10); ctx.stroke();
    const p = city().pal;
    for (let ty = 0; ty < MH; ty++) for (let tx = 0; tx < MW; tx++) {
        const t = tileAt(tx, ty);
        if (t === T.GROUND) continue;
        ctx.fillStyle = t === T.WALL ? p.w2 : t === T.WATER ? p.a1 : t === T.TREE ? p.tr1
                      : t === T.GRASS ? p.t1 : t === T.ROAD ? p.p1 : '#ffd43b';
        ctx.fillRect(X + tx * sc, Y + ty * sc, sc, sc);
    }
    ctx.fillStyle = '#ff5c7a';
    ctx.fillRect(X + (P.x / TS) * sc - 2, Y + (P.y / TS) * sc - 2, 4.5, 4.5);
    ctx.restore();
}

// ───────── 도트 캐릭터 ─────────
const SK = { out:'#2a1c18', hair:'#5c3620', hairL:'#8a5434', skin:'#ffd2a6', skinD:'#d9a373',
             dress:'#ff7ab0', dressD:'#d44a86', shoe:'#46304e', eye:'#2a1c18', blush:'#ff9aa8' };
function mirror(parts, X, boxW) {
    return parts.map(q => [2 * X + boxW - q[0] - q[2], q[1], q[2], q[3], q[4]]);
}
function dir4(a) {
    if (a > Math.PI / 4 && a < 3 * Math.PI / 4) return 0;          // 아래
    if (a < -Math.PI / 4 && a > -3 * Math.PI / 4) return 1;        // 위
    if (Math.abs(a) >= 3 * Math.PI / 4) return 2;                  // 왼쪽
    return 3;                                                      // 오른쪽
}

// 소현이 (월드 이동) — 12×20 도트
function drawHeroPix(x, y, dir, walk) {
    const X = Math.round(x) - 6, Y = Math.round(y) - 19;
    const d = dir4(dir), f = Math.abs(walk) > 0.3 ? (Math.floor(walk) & 1) : 0;
    R(X + 2, Y + 19, 8, 2, 'rgba(0,0,0,.25)');
    const legs = f === 0
        ? [[X + 3, Y + 15, 2, 3, SK.skin], [X + 7, Y + 15, 2, 3, SK.skin],
           [X + 2, Y + 17, 3, 2, SK.shoe], [X + 7, Y + 17, 3, 2, SK.shoe]]
        : [[X + 2, Y + 15, 2, 3, SK.skin], [X + 8, Y + 15, 2, 3, SK.skin],
           [X + 2, Y + 17, 3, 2, SK.shoe], [X + 8, Y + 17, 3, 2, SK.shoe]];
    const body = [
        [X + 3, Y + 10, 6, 4, SK.dress],
        [X + 2, Y + 13, 8, 2, SK.dress],
        [X + 2, Y + 14, 8, 1, SK.dressD],
        [X + 1, Y + 10, 2, 4, SK.skin],
        [X + 9, Y + 10, 2, 4, SK.skin],
    ];
    let head;
    if (d === 1) {           // 뒤통수
        head = [[X + 1, Y + 0, 10, 10, SK.hair], [X + 0, Y + 2, 2, 7, SK.hair], [X + 10, Y + 2, 2, 7, SK.hair],
                [X + 4, Y + 3, 4, 7, SK.hairL]];
    } else if (d === 0) {    // 정면
        head = [[X + 1, Y + 0, 10, 9, SK.hair], [X + 2, Y + 3, 8, 6, SK.skin],
                [X + 1, Y + 0, 10, 4, SK.hair], [X + 0, Y + 2, 2, 7, SK.hair], [X + 10, Y + 2, 2, 7, SK.hair],
                [X + 3, Y + 5, 2, 2, SK.eye], [X + 7, Y + 5, 2, 2, SK.eye],
                [X + 2, Y + 7, 1, 1, SK.blush], [X + 9, Y + 7, 1, 1, SK.blush],
                [X + 8, Y + 1, 2, 1, '#ffd1e6']];
    } else {                 // 옆모습 (오른쪽 기준, 왼쪽은 뒤집기)
        head = [[X + 2, Y + 0, 9, 9, SK.hair], [X + 4, Y + 3, 6, 6, SK.skin],
                [X + 2, Y + 0, 9, 4, SK.hair], [X + 1, Y + 2, 2, 8, SK.hair],
                [X + 7, Y + 5, 2, 2, SK.eye], [X + 6, Y + 7, 1, 1, SK.blush]];
        if (d === 2) head = mirror(head, X, 12);
    }
    sprite(head.concat(body, legs), SK.out);
    R(X + 10, Y + 12, 2, 2, '#ffc93c');   // 손에 쥔 반지
    R(X + 11, Y + 12, 1, 1, '#fff6b8');
}

function drawMobPix(kind, cx, cy, s, t, hurt, legend) {
    t = t || 0;
    if (hurt > 0 && ((t * 24) | 0) % 2) return;
    const bob = (Math.sin(t * 2.2) * 1.2) | 0;
    const ox = Math.round(cx) - 10 * s, oy = Math.round(cy) - 21 * s + bob * s;
    R(ox + 2 * s, oy + 21 * s, 16 * s, 2 * s, 'rgba(0,0,0,.22)');

    if (legend) {   // 전설 — 금빛 반짝임
        for (let i = 0; i < 5; i++) {
            const a = t * 2 + i * 1.25;
            const sx2 = ox + 10 * s + Math.cos(a) * 15 * s, sy2 = oy + 10 * s + Math.sin(a) * 13 * s;
            if (((t * 6 + i) | 0) % 3) R(sx2, sy2, 2 * s, 2 * s, '#fff2a8');
        }

}

// ───────── 도시 랜드마크 (도트) ─────────
function drawLandmark(c, p) {
    const X = (MW / 2) * TS, Y = 3 * TS;
    const O = p.out;
    if (c.landmark === 'eiffel') {
        const col = '#c8ae84', colD = '#8a7352';
        R(X - 2, Y - 74, 4, 10, O); R(X - 1, Y - 73, 2, 9, col);
        const N = 20;
        for (let i = 0; i < N; i++) {
            const t = i / (N - 1);
            const w = Math.round(4 + 42 * t * t * 1.15);
            const yy = Y + 2 - (N - i) * 3.4;
            R(X - w / 2 - 1, yy, w + 2, 4, O);
            R(X - w / 2, yy, w, 3, i % 3 === 0 ? colD : col);
            if (w > 11) R(X - w / 2 + 4, yy, w - 8, 3, p.sky);   // 가운데를 비워 다리 모양

let B = null;
// 도시에 머무는 동안 오른 레벨만큼 몬스터도 강해진다
function mobScale(c) { return 1 + 0.11 * Math.max(0, G.lv - (c.lv0 || 1)); }
function hasAnimal(eff) { const a = CITIES.map(c => c.animal).find(a => G.animals.includes(a.id) && a.eff === eff); return a || null; }

function startBattle(bossOf) {
    const c = city();
    let e;
    if (bossOf) {
        const b = bossOf;
        const k = 1 + 0.08 * Math.max(0, G.lv - (c.lv0 + 6));   // 과하게 레벨 올리고 와도 긴장감 유지
        const hp = Math.round(b.hp * k);
        e = { n: b.n, draw: b.draw, hp, max: hp, atk: Math.round(b.atk * k), def: Math.round(b.def * k),
              exp: b.exp, gold: b.gold, boss: true, wife: b.wife };
    } else {
        const m = c.mobs[Math.floor(Math.random() * c.mobs.length)];
        const r = 0.88 + Math.random() * 0.3;
        const k = mobScale(c);

        const L = legend ? 2.8 : 1;
        const hp = Math.round(m.hp * r * k * L);
        e = { n: (legend ? LEGEND_PRE[(Math.random() * 3) | 0] : '') + m.n, draw: m.draw, legend,
              hp, max: hp, atk: Math.round(m.atk * k * (legend ? 1.5 : 1)), def: Math.round(m.def * k * (legend ? 1.4 : 1)),
              exp: Math.round(m.exp * (1 + (k - 1) * 0.5) * (legend ? 8 : 1)),
              gold: Math.round(m.gold * (1 + (k - 1) * 0.5) * (legend ? 10 : 1)), boss: false };
    }
    B = {

        say: null, fxT: 0, fxKind: '', flash: 0, pendDmg: null, pendHeal: 0,

function blog(s) { B.log.push(s); if (B.log.length > 3) B.log.shift(); }

function dmgCalc(a, pow, d, critBonus) {
    let v = a * pow * (0.9 + Math.random() * 0.2) - d * 0.35;
    v = Math.max(1, v);
    const cr = hasAnimal('crit');
    const isCrit = Math.random() < 0.06 + (critBonus || 0) + (cr ? cr.val : 0) + petBonus('crit');
    if (isCrit) v *= 1.85;
    return { d: Math.max(1, Math.round(v)), crit: isCrit };
}

function useSkill(sk) {
    if (B.busy > 0 || B.phase !== 'menu') return;
    if (G.mp < sk.mp) { S.deny(); blog('기력이 모자라요!'); return; }
    if (sk.costGold && G.gold < sk.costGold) { S.deny(); blog('던질 돈이 없어요! 😭'); return; }
    G.mp -= sk.mp;
    if (sk.costGold) { G.gold -= sk.costGold; blog('💸 ' + sk.costGold + '원을 던졌다!'); }
    B.phase = 'anim'; B.busy = 0.5; B.menu = 'root';

    let txt = '동훈이의 ' + sk.n + '!';
    const say = SAY[sk.id];
    if (say) B.say = { t: 1.4, s: say[(Math.random() * say.length) | 0] };
    B.fxKind = FX_OF[sk.id] || 'hit';
    B.fxT = 0.45;
    if (sk.pow > 0) {
        const hits = sk.hits || 1;
        let total = 0, anyCrit = false;
        for (let i = 0; i < hits; i++) {
            const r = dmgCalc(atkOf(), skPow(sk), B.e.def, sk.crit);
            total += r.d; anyCrit = anyCrit || r.crit;
        }
        const exP = petBonus('extra');
        if (exP && Math.random() < exP) {
            const r2 = dmgCalc(atkOf(), skPow(sk) * 0.5, B.e.def, 0);
            total += r2.d;
            txt += ' 🐾 펫의 추가타!';
        }
        const ex = hasAnimal('extra');
        if (ex && Math.random() < ex.val) {
            const r = dmgCalc(atkOf(), skPow(sk) * 0.5, B.e.def, 0);
            total += r.d;
            txt += ' ' + ex.i + ' 추가타!';
        }
        B.e.hp = Math.max(0, B.e.hp - total);
        B.hurtE = 0.45; B.shake = anyCrit ? 0.6 : 0.35;
        if (anyCrit) B.flash = 0.25;
        anyCrit ? S.crit() : S.hit();
        B.pendDmg = { v: total, crit: anyCrit, foe: true };
        txt += (anyCrit ? ' 💥치명타! ' : ' ') + total + ' 데미지!';
    }
    if (sk.healP) {
        const h = Math.round(maxHp() * sk.healP);
        G.hp = Math.min(maxHp(), G.hp + h);
        S.heal(); txt += ' HP ' + h + ' 회복!';
        B.pendHeal = h;
    }
    if (sk.guard) { B.guard = sk.guard; txt += ' 방어 태세!'; }
    if (sk.debuff) { B.edeb = sk.debuff; txt += ' ' + B.e.n + '의 공격력이 뚝 떨어졌다!'; }
    if (sk.stun) {
        if (Math.random() < sk.stun) { B.estun = 1; txt += ' ' + jo(B.e.n, '이', '가') + ' 당황했다!'; }
        else txt += ' ...하지만 안 통했다.';
    }
    blog(txt);
    syncHud();
}

function useItem(it) {
    if (B && (B.busy > 0 || B.phase !== 'menu')) return;
    if (!G.items[it.id]) { S.deny(); return; }
    G.items[it.id]--;
    if (it.id === 'candy') { G.hp = Math.min(maxHp(), G.hp + Math.round(maxHp() * 0.4)); }
    else { G.mp = Math.min(maxMp(), G.mp + Math.round(maxMp() * 0.5)); }
    S.heal(); syncHud();
    if (B) { blog(it.i + ' ' + it.n + ' 사용!'); B.phase = 'anim'; B.busy = 0.5; B.menu = 'root'; }
}

function tryRun() {
    if (B.e.boss) { S.deny(); blog('보스전에서는 도망칠 수 없어요!'); return; }
    if (Math.random() < 0.72) { blog('무사히 도망쳤다!'); B.result = 'run'; B.phase = 'end'; B.busy = 0.8; }
    else { blog('도망치지 못했다!'); B.phase = 'anim'; B.busy = 0.5; B.menu = 'root'; }
}

function enemyTurn() {
    if (B.e.hp <= 0) return;
    if (B.estun > 0) { B.estun--; blog(jo(B.e.n, '은', '는') + ' 멍하니 서 있다...'); return; }
    const deb = 1 - B.edeb;
    let d = B.e.atk * deb * (0.9 + Math.random() * 0.2) - defOf() * 0.35;
    if (B.guard > 0) d *= 0.52;
    const gd = hasAnimal('guard');
    if (gd) d *= (1 - gd.val);
    if (petBonus('def')) d *= (1 - petBonus('def'));
    d = Math.max(1, Math.round(d));
    G.hp = Math.max(0, G.hp - d);
    B.hurtP = 0.45; B.shake = 0.3;
    B.pendDmg = { v: d, crit: false, foe: false };
    S.hit();
    blog(B.e.n + '의 공격! ' + d + ' 데미지!');
    syncHud();
}

function turnEnd() {
    if (B.guard > 0) B.guard--;
    if (B.edeb > 0) { B.edeb = Math.max(0, B.edeb - 0.12); }
    const rg = hasAnimal('regen');
    if (rg && G.hp > 0 && G.hp < maxHp()) { G.hp = Math.min(maxHp(), G.hp + rg.val); }
    const mn = hasAnimal('mana');
    if (mn && G.mp < maxMp()) { G.mp = Math.min(maxMp(), G.mp + mn.val); }
    if (petBonus('heal') && G.hp > 0) G.hp = Math.min(maxHp(), G.hp + Math.ceil(maxHp() * petBonus('heal')));
    if (petBonus('mana')) G.mp = Math.min(maxMp(), G.mp + Math.ceil(maxMp() * petBonus('mana')));
    syncHud();
}

function winBattle() {
    const e = B.e, c = city();
    G.gold += Math.round(e.gold * (1 + petBonus('gold'))); G.exp += e.exp; G.kills++;

        drops.push(m.i + m.n);
    }
    S.win();
    let body = '💰 ' + e.gold + '원 &nbsp; ⭐ 경험치 ' + e.exp + '<br>🎁 ' + drops.join(' · ');
    let lvUp = '';
    while (G.exp >= expNeed()) {
        G.exp -= expNeed(); G.lv++;

    }
    if (e.boss) {
        G.boss[c.id] = true;

                     kyoto:['catch','🪄 몬스터 포획','전투에서 적 체력을 40% 밑으로 깎으면<br><b>반지를 던져 잡을 수</b> 있어요. 잡은 몬스터는 <b>펫</b>이 돼서 따라다녀요!'],
                     cairo:['merchant','🏺 떠돌이 상인','도시 어딘가에 <b>수상한 상인</b>이 나타나기 시작했어요.<br>희귀한 물건을 팝니다.'],
                     roma:['lucky','🍀 행운의 기운','<b>전설 몬스터</b> 출현 확률이 크게 올랐어요!'] }[c.id];
        if (UN && !G.unlock[UN[0]]) {
            G.unlock[UN[0]] = true;
            setTimeout(() => msg('🔓', UN[1] + ' 해금!', UN[2]), 900);
        }
        if (!G.animals.includes(c.animal.id)) {
            G.animals.push(c.animal.id);
            lvUp += '<br><br>' + c.animal.i + ' <b>' + c.animal.n + '</b>' + (jo(c.animal.n, '이', '가').slice(-1)) + ' 동료가 됐다!<br><span style="opacity:.7">' + c.animal.desc + '</span>';
        }
        const mem = STORY.memory[c.id];
        msg('🏆', c.boss.n + ' 격파!', c.boss.win + '<br><br>' + body + lvUp + '<br><br>✈️ 공항에서 다음 도시로 갈 수 있어요!');
        if (mem && !G.story[c.id]) {
            G.story[c.id] = true;
            const old = document.getElementById('mBtn').onclick;
            document.getElementById('mBtn').onclick = function () {
                document.getElementById('ovMsg').classList.remove('show');
                document.getElementById('mBtn').onclick = old;
                startCut(mem.em, mem.lines, checkEnding);
            };
        }
    } else {
        msg('🎉', e.n + ' 격파!', body + lvUp);
    }

}

function catchWin() {
    const e = B.e, c = city();
    const g = Math.round(e.gold * 0.4), x = Math.round(e.exp * 0.5);
    G.gold += g; G.exp += x;
    let lvUp = '';
    while (G.exp >= expNeed()) { G.exp -= expNeed(); G.lv++; G.hp = maxHp(); G.mp = maxMp(); lvUp = '<br>🎊 레벨 ' + G.lv + '!'; S.levelup(); }
    const pet = (G.pets || [])[G.pets.length - 1];
    const db = PET_DB[e.draw];
    S.win();
    msg('🪄', '포획 성공!', '<b style="color:#c04a60">' + (pet ? pet.n : e.n) + '</b> 이(가) 동료가 됐어요!<br>' +
        '<span style="opacity:.75">' + (db ? db.d : '') + '</span><br><br>💰 ' + g + '원 · ⭐ ' + x + lvUp +
        '<br><br><span style="opacity:.7">☰ 메뉴 → 펫 에서 바꿀 수 있어요.<br>같은 종류를 또 잡으면 레벨이 올라요!</span>');
    syncHud(); save();
}
function loseBattle() {
    const lost = Math.round(G.gold * 0.25);
    G.gold -= lost;
    G.hp = Math.round(maxHp() * 0.5); G.mp = Math.round(maxMp() * 0.5);
    S.lose();
    msg('😵', '동훈이가 쓰러졌다...', '소현이가 동훈이를 업고 돌아왔어요.<br>치료비로 💰 ' + lost + '원을 썼습니다.<br><br><span style="opacity:.7">레벨을 더 올리거나 아이템을 챙겨가요!</span>');
    P.x = MAP.start.x * TS + TS / 2; P.y = MAP.start.y * TS + TS / 2;
    syncHud(); save();
}

function updateBattle(dt) {
    B.t += dt;
    B.hurtP = Math.max(0, B.hurtP - dt);
    B.hurtE = Math.max(0, B.hurtE - dt);
    B.shake = Math.max(0, B.shake - dt);
    B.flash = Math.max(0, (B.flash || 0) - dt * 3);
    if (B.say) { B.say.t -= dt; if (B.say.t <= 0) B.say = null; }
    if (B.fxT > 0) B.fxT -= dt;
    updateFx(dt);
    // HP바가 뚝 떨어지지 않고 스르륵 줄어든다
    const et = B.e.hp / B.e.max, pt = G.hp / maxHp();
    B.eShow += (et - B.eShow) * Math.min(1, dt * 6);
    B.pShow += (pt - B.pShow) * Math.min(1, dt * 6);
    if (B.busy > 0) {
        B.busy -= dt;
        if (B.busy <= 0) {
            if (B.phase === 'end') {
                scene = 'world'; endBattleUi();
                if (B.result === 'win') winBattle();
                else if (B.result === 'lose') loseBattle();
                else if (B.result === 'catch') catchWin();
                B = null; return;
            }
            if (B.e.hp <= 0) { B.result = 'win'; B.phase = 'end'; B.busy = 0.6; blog(jo(B.e.n, '을', '를') + ' 쓰러뜨렸다!'); return; }
            enemyTurn();
            if (G.hp <= 0) { B.result = 'lose'; B.phase = 'end'; B.busy = 1.0; blog('동훈이가 쓰러졌다...'); return; }
            turnEnd();
            B.phase = 'menu';
        }
    }
    if (B.phase === 'intro') {
        B.ringT += dt;
        if (B.ringT > 1.25) { B.phase = 'menu'; blog('💍 "가라! 동훈!"'); }
    }
}

function battleTap(x, y) {
    if (!B || B.phase !== 'menu') return;
    for (const b of B.btns) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { S.open(); b.fn(); return; }
    }
}

function drawBattleScene(c, p, vPanelY) {
    const hor = Math.round(vPanelY * 0.52);
    // 하늘 — 그라데이션 대신 띠로 나눠서 도트 느낌 유지
    R(0, 0, VW, hor, p.a0);
    R(0, Math.round(hor * 0.34), VW, hor, shade(p.sky, 14));
    R(0, Math.round(hor * 0.58), VW, hor, p.sky);
    // 해
    const sx = Math.round(VW * 0.78), sy = Math.round(hor * 0.26);
    R(sx - 9, sy - 7, 18, 14, '#fff0a8'); R(sx - 7, sy - 9, 14, 18, '#fff0a8');
    R(sx - 6, sy - 5, 8, 6, '#fffce0');
    // 구름
    for (let i = 0; i < 3; i++) {
        const cx = Math.round(((gameT * (3 + i * 1.6) + i * 90) % (VW + 70)) - 35);
        const cy = Math.round(hor * (0.14 + i * 0.16));
        R(cx - 11, cy, 22, 5, '#ffffff'); R(cx - 7, cy - 4, 14, 5, '#ffffff');
        R(cx - 13, cy + 3, 26, 3, '#e6f2ff');
    }
    // 랜드마크 실루엣
    px.save(); px.translate(Math.round(VW * 0.22) - (MW / 2) * TS, hor - 3 * TS - 6);
    px.globalAlpha = 0.55; drawLandmark(c, p); px.globalAlpha = 1; px.restore();
    // 언덕 두 겹
    for (let x = 0; x < VW; x++) {
        const h1 = Math.round(Math.sin(x * 0.06) * 6 + 10);
        R(x, hor - h1, 1, h1 + 4, p.g2);
    }
    for (let x = 0; x < VW; x++) {
        const h2 = Math.round(Math.cos(x * 0.045 + 1.2) * 5 + 6);
        R(x, hor - h2 + 6, 1, h2 + 6, p.t1);
    }
    // 땅
    R(0, hor + 8, VW, vPanelY - hor, p.g1);
    R(0, hor + 8, VW, 2, p.g0);
    for (let j = 0; j < 20; j++) for (let i = 0; i < 24; i++) {
        const r = th(i, j, 21);
        const gx = Math.round(i * (VW / 24)) + 2, gy = hor + 14 + j * 7;
        if (gy > vPanelY - 2) continue;
        if (r > 0.86) { R(gx, gy, 2, 1, p.f0); R(gx + 1, gy - 1, 1, 1, p.f0); }
        else if (r > 0.6) R(gx, gy, 2, 1, p.g0);
        else if (r < 0.12) R(gx, gy, 1, 1, p.g2);
    }
}
function platformPix(x, y, w, p) {
    x = Math.round(x); y = Math.round(y);
    R(x - w / 2, y, w, 3, p.g2);
    R(x - w / 2 + 3, y - 2, w - 6, 3, p.g0);

}

function card(x, y, w, h, r, edge) {
    ctx.fillStyle = 'rgba(80,50,60,.22)';
    rr(x + 3, y + 4, w, h, r); ctx.fill();
    ctx.fillStyle = '#fff8ef';

function rr(x, y, w, h, r, fill) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function bar(x, y, w, h, p, c1, c2) {
    rr(x, y, w, h, h / 2, 'rgba(0,0,0,.5)');
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    rr(x, y, Math.max(2, w * Math.max(0, Math.min(1, p))), h, h / 2, null);
    ctx.fillStyle = g; ctx.fill();
}
// 로그는 줄바꿈이 생길 수 있어서, 앞 줄이 몇 줄을 썼는지 누적해서 y를 잡는다
let _wrapY = 0;
function wrapText(txt, x, y, maxW, idx) {
    if (idx === 0) _wrapY = y;
    const lines = [];
    let line = '';
    for (const ch of txt) {
        if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
        else line += ch;
    }
    lines.push(line);
    for (const l of lines) { ctx.fillText(l, x, _wrapY); _wrapY += 17; }
}

    if (lack.length) { S.deny(); toast('재료가 모자라요 — ' + lack.map(([k, v]) => k + ' ' + (G.mats[k] || 0) + '/' + v).join(', ')); return; }

    G.stock[m.n] = (G.stock[m.n] || 0) + 1;
