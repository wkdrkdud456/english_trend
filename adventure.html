// 동훈이 (배틀) — 16×26 도트, 배틀에선 확대해서 그린다
function donghoonParts(form, t) {
    const sw = Math.sin(t * 2.4) > 0 ? 0 : 1;
    const P0 = [
        [2, 0, 12, 6, '#3a2418'],
        [3, 3, 10, 7, SK.skin],
        [2, 0, 12, 4, '#3a2418'],
        [1, 2, 2, 6, '#3a2418'], [13, 2, 2, 6, '#3a2418'],
        [5, 6, 2, 2, SK.eye], [9, 6, 2, 2, SK.eye],
        [4, 8, 1, 1, SK.blush], [11, 8, 1, 1, SK.blush],
        [7, 9, 2, 1, '#a05848'],
        [3, 11, 10, 8, form.shirt],
        [1, 11 + sw, 2, 6, SK.skin], [13, 11 + (1 - sw), 2, 6, SK.skin],
        [4, 19, 3, 5, form.pants], [9, 19, 3, 5, form.pants],
        [3, 23, 4, 3, '#3a2a40'], [9, 23, 4, 3, '#3a2a40'],
    ];
    if (form.tool === 'briefcase') {
        P0.push([6, 11, 4, 2, '#ffffff'], [7, 12, 2, 6, '#d6435a'], [14, 15 + (1 - sw), 5, 5, '#6b4530']);
    } else if (form.tool === 'pan') {
        P0.push([4, 13, 8, 6, '#f3f4f6'], [3, -4, 10, 5, '#ffffff'], [4, -7, 8, 4, '#ffffff'],
                [14, 15 + (1 - sw), 6, 2, '#3f444b'], [17, 13 + (1 - sw), 4, 5, '#3f444b']);
    } else if (form.tool === 'ring') {
        P0.unshift([-1, 10, 4, 13, '#d84a5a']);
        P0.push([6, 13, 4, 4, '#ffd43b'], [14, 14 + (1 - sw), 5, 5, '#ffd43b']);
    } else if (form.tool === 'backpack') {          // 🎒 등에 멘 가방 — 어깨끈이 앞으로 넘어온다
        P0.unshift([-1, 11, 3, 8, '#2f4f4f'], [14, 11, 3, 8, '#2f4f4f']);
        P0.push([5, 11, 1, 8, '#24413d'], [10, 11, 1, 8, '#24413d'],
                [5, 15, 6, 2, '#24413d'], [14, 15 + (1 - sw), 4, 3, '#c8a86c']);
    } else if (form.tool === 'lantern') {           // 🧭 랜턴 — 불빛이 깜빡인다
        const on = ((t * 3) | 0) % 2;
        P0.push([3, 10, 10, 2, '#1d3b53'], [6, 12, 4, 3, '#e9d8a6'],
                [15, 12 + (1 - sw), 1, 4, '#6b4530'],
                [14, 16 + (1 - sw), 4, 5, '#3f444b'],
                [15, 17 + (1 - sw), 2, 3, on ? '#fff3a8' : '#ffd43b']);
    } else if (form.tool === 'camera') {            // 📷 목에 건 카메라
        P0.push([4, 11, 1, 4, '#6b705c'], [11, 11, 1, 4, '#6b705c'],
                [4, 14, 8, 5, '#343a40'], [5, 13, 3, 1, '#495057'],
                [6, 15, 4, 3, '#4dabf7'], [7, 16, 2, 1, '#cfe9f5'],
                [10, 15, 1, 1, ((t * 2) | 0) % 3 ? '#343a40' : '#ff6b6b'],
                [14, 15 + (1 - sw), 4, 3, SK.skin]);
    } else if (form.tool === 'ladle') {             // 🍚 앞치마와 주걱
        P0.push([3, 12, 10, 7, '#f8f9fa'], [3, 12, 10, 1, '#c8c0b4'],
                [5, 11, 1, 2, '#c8c0b4'], [10, 11, 1, 2, '#c8c0b4'],
                [6, 15, 4, 3, '#d9a441'],
                [15, 11 + (1 - sw), 1, 6, '#a8834c'], [14, 9 + (1 - sw), 3, 3, '#f1f3f5']);
    } else if (form.tool === 'echo') {              // 💫 기억 — 윤곽이 번지고 별빛이 돈다
        P0.unshift([0, 10, 16, 14, '#3a2a58']);
        P0.push([3, 11, 10, 4, '#8a6bc8'], [5, 15, 6, 4, '#6b4fa0'],
                [14, 15 + (1 - sw), 2, 2, '#ffd43b'],
                [((t * 3) | 0) % 2 ? 1 : 13, 7, 1, 1, '#ffffff'],
                [((t * 2) | 0) % 2 ? 14 : 2, 13, 1, 1, '#c0a8ff'],
                [7, 9, 2, 1, '#c0a8ff']);
    } else if (form.tool === 'bare') {              // 💍 아무것도 안 들었다. 반지만 남았다.
        P0.push([3, 11, 10, 3, '#e9ecef'], [7, 11, 2, 8, '#dee2e6'],

                [1, 15 + sw, 2, 2, SK.skin]);

    } else {
        P0.push([14, 15 + (1 - sw), 5, 4, '#ffe066'], [14, 15 + (1 - sw), 5, 2, '#51cf66']);
    }
    return P0;

function drawMobPix(kind, cx, cy, s, t, hurt, tier) {
    t = t || 0;
    if (hurt > 0 && ((t * 24) | 0) % 2) return;
    const T2 = tierOf(tier);
    const bob = (Math.sin(t * 2.2) * 1.2) | 0;
    const ox = Math.round(cx) - 10 * s, oy = Math.round(cy) - 21 * s + bob * s;
    const mx = ox + 10 * s, my = oy + 11 * s;
    if (T2) {       // 등급 오라 — 스프라이트 뒤에 먼저 깔린다
        const col = tierGlow(tier, t, 0);
        const aur = s >= 2 ? 1 : 0.68;               // 따라다니는 펫은 오라도 작게
        px.globalAlpha = 0.14 + T2.id * 0.035 + Math.sin(t * 4) * 0.04;
        const rr = Math.round((12 + T2.id) * aur);   // 은은하게 번지는 빛무리
        for (let yy = -rr; yy <= rr; yy++) {
            const w = Math.round(Math.sqrt(Math.max(0, 1 - (yy / rr) * (yy / rr))) * (rr - 1));
            if (w > 0) R(mx - w * s, my + yy * s, w * 2 * s, s, col);
        }
        px.globalAlpha = 1;
        for (let k = 0; k < T2.id; k++) {            // 도는 호 — 꽉 찬 원보다 훨씬 간지난다
            const r = (11 + k * 2.6) * s * aur + Math.sin(t * 3 - k * 0.9) * 1.3 * s;
            const sp = t * (1.6 + k * 0.7) * (k % 2 ? -1 : 1);
            const n2 = Math.max(10, (r / s * 1.6) | 0);
            for (let a = 0; a < n2; a++) {
                if ((a / n2 + 0.001) % 0.34 > 0.2) continue;   // 끊긴 호
                const an = a / n2 * Math.PI * 2 + sp;
                R(mx + Math.cos(an) * r, my + Math.sin(an) * r * 0.92, s, s, tierGlow(tier, t, k));
            }
        }
        const seg = 12 + T2.id * 4;                  // 발밑을 도는 등급 링
        for (let a = 0; a < seg; a++) {
            const an = a / seg * Math.PI * 2 + t * (1 + T2.id * 0.25);
            const sy3 = Math.sin(an);
            R(mx + Math.cos(an) * 14 * s * aur, oy + 21 * s + sy3 * 4 * s * aur, s, s + (sy3 > 0 ? s : 0), tierGlow(tier, t, a));
        }
    }
    R(ox + 2 * s, oy + 21 * s, 16 * s, 2 * s, 'rgba(0,0,0,.22)');
    sprite(mobParts(kind, t), T2 ? tierCol(tier, t) : (isEcho() ? '#2a1838' : SK.out), s, ox, oy);
    if (isEcho() && !T2) {                       // 기억 속 몬스터는 보랏빛이 얇게 돈다
        px.globalAlpha = 0.22 + Math.sin(t * 3) * 0.06;
        R(ox, oy - s, 20 * s, 23 * s, '#9b7bd4');
        px.globalAlpha = 1;
    }
    if (T2) {       // 등급 반짝임 — 높을수록 많고 빠르다
        const n = 4 + T2.id * 2;
        for (let i = 0; i < n; i++) {
            const a = t * (2 + T2.id * 0.5) + i * (Math.PI * 2 / n);
            const sx2 = ox + 10 * s + Math.cos(a) * 15 * s, sy2 = oy + 10 * s + Math.sin(a) * 13 * s;
            if (((t * 6 + i) | 0) % 3) {
                R(sx2, sy2, 2 * s, 2 * s, T2.spark);
                if (T2.id >= 2) R(sx2 + s * 0.5, sy2 - s, s, s, '#ffffff');
            }
        }
        if (T2.id >= 3) {
            pxStar(mx, oy - 2 * s, (3 + Math.abs(Math.sin(t * 4)) * 2) | 0, '#ffffff');
            pxStar(mx - 13 * s, oy + 3 * s, 2, T2.spark);
            pxStar(mx + 13 * s, oy + 6 * s, 2, T2.spark);
        } else if (T2.id >= 2) pxStar(mx, oy - 1 * s, (2 + Math.abs(Math.sin(t * 3)) * 1.5) | 0, '#fff6cf');
    }
}

let B = null;
// 도시에 머무는 동안 오른 레벨만큼 몬스터도 강해진다
function mobScale(c) { return 1 + 0.11 * Math.max(0, G.lv - (c.lv0 || 1)); }
function hasAnimal(eff) { const a = CITIES.map(c => c.animal).find(a => G.animals.includes(a.id) && a.eff === eff); return a || null; }

function startBattle(bossOf, forced, preset) {
    const c = city();
    let e;
    if (preset) { e = preset; }
    else if (forced) {                       // 비밀 장소에서 튀어나오는 지정 몬스터
        // 생김새만 가져오고 세기는 "지금 이 도시의 제일 단단한 놈" 기준으로 맞춘다.
        // 안 그러면 교토에서 로마 몬스터가 튀어나와 손도 못 댄다.
        const m = c.mobs[c.mobs.length - 1];
        const nm = (CITIES.flatMap(x => x.mobs).find(x => x.draw === forced.draw) || m).n;
        const T2 = tierOf(forced.tier), k = mobScale(c);
        const hp = Math.round(m.hp * k * T2.mul);
        e = { n: T2.pre + nm, draw: forced.draw, legend: true, tier: forced.tier,
              hp, max: hp, atk: Math.round(m.atk * k * T2.atk), def: Math.round(m.def * k * T2.def),
              exp: Math.round(m.exp * T2.exp), gold: Math.round(m.gold * T2.gold), boss: false };
    } else if (bossOf) {
        const b = bossOf;
        // 외전 보스는 echoMul()로 이미 지금 레벨에 맞춰져 있다. 또 보정하면 손도 못 댄다.
        const k = b.echo ? 1 : 1 + 0.08 * Math.max(0, G.lv - (c.lv0 + 6));   // 과하게 레벨 올리고 와도 긴장감 유지
        const hp = Math.round(b.hp * k);
        e = { n: b.n, draw: b.draw, hp, max: hp, atk: Math.round(b.atk * k), def: Math.round(b.def * k),
              exp: b.exp, gold: b.gold, boss: true, wife: b.wife, echo: !!b.echo };
    } else {
        const m = c.mobs[Math.floor(Math.random() * c.mobs.length)];
        const r = 0.88 + Math.random() * 0.3;
        const k = mobScale(c);
        const tier = Math.random() < legendRate() ? rollTier() : 0;
        const T2 = tierOf(tier);
        const E = isEcho() ? echoMuls() : null;
        // 외전에선 도시 안에서 레벨이 오른 만큼의 보정(k)을 쓰지 않는다. 겹치면 숫자가 터진다.
        const kk = E ? 1 : k;
        let hp = Math.round(m.hp * r * kk * (E ? E.hp : 1) * (T2 ? T2.mul : 1));
        if (E) hp = Math.max(hp, Math.round(atkOf() * 20 * (T2 ? T2.mul : 1)));
        e = { n: (E ? '기억 속의 ' : '') + (T2 ? T2.pre : '') + m.n, draw: m.draw,
              legend: tier > 0, tier, echo: !!E,
              hp, max: hp,
              atk: Math.round(m.atk * kk * (E ? E.atk : 1) * (T2 ? T2.atk : 1)),
              def: Math.round(m.def * kk * (E ? E.def : 1) * (T2 ? T2.def : 1)),
              exp: Math.round(m.exp * (1 + (kk - 1) * 0.5) * (T2 ? T2.exp : 1) * (E ? E.rew * 1.6 : 1)),
              gold: Math.round(m.gold * (1 + (kk - 1) * 0.5) * (T2 ? T2.gold : 1) * (E ? E.rew * 3.2 : 1)), boss: false };
    }
    B = {
        e, phase: 'intro', t: 0, ringT: 0, menu: 'root', btns: [],
        log: [bossOf ? bossOf.intro : '앗! ' + jo(e.n, '이', '가') + ' 나타났다!'],
        say: null, fxT: 0, fxKind: '', flash: 0, pendDmg: null, pendHeal: 0, masterT: 0, masterS: '',
        eShow: 1, pShow: 1,
        guard: 0, edeb: 0, estun: 0, hurtP: 0, hurtE: 0, shake: 0, busy: 0, result: null, tierT: 0,
    };
    scene = 'battle';
    if (e.legend) {
        const T3 = tierOf(e.tier);
        B.log = [(T3.id >= 3 ? '🌟 세상이 멈췄다...!! ' : T3.id >= 2 ? '👑 눈이 부시다...! ' : '⭐ 공기가 달라졌다... ') +
                 jo(e.n, '이', '가') + ' 나타났다!'];
        B.flash = 0.7 + T3.id * 0.25;
        B.tierT = 1.5 + T3.id * 0.35;
        const base = [523, 659, 784, 1047, 1319, 1568];
        base.slice(0, 3 + T3.id).concat(T3.id >= 3 ? [2093, 2637] : []).forEach((f, i) =>
            tone(f, 0.18 + T3.id * 0.03, { delay: i * 0.075, type: T3.id >= 3 ? 'square' : 'triangle', vol: 0.15 + T3.id * 0.02 }));
    } else if (!bossOf && MOB_SAY[e.draw]) B.log.push('💢 "' + MOB_SAY[e.draw] + '"');
    S.encount();
    document.getElementById('hud').style.opacity = '0';
    document.getElementById('bars').style.opacity = '0';
    document.getElementById('acts').style.opacity = '0';
    endStick();
}
function endBattleUi() {
    document.getElementById('hud').style.opacity = '1';
    document.getElementById('bars').style.opacity = '1';
    document.getElementById('acts').style.opacity = '1';
}

function blog(s) { B.log.push(s); if (B.log.length > 3) B.log.shift(); }

function dmgCalc(a, pow, d, critBonus) {
    let v = a * pow * (0.9 + Math.random() * 0.2) - d * 0.35;
    v = Math.max(1, v);
    const cr = hasAnimal('crit');
    const isCrit = Math.random() < 0.06 + (critBonus || 0) + (cr ? cr.val : 0) + petBonus('crit');
    if (isCrit) v *= 1.85;
    return { d: Math.max(1, Math.round(v)), crit: isCrit };
}

function useSkill(sk) {
    if (B.busy > 0 || B.phase !== 'menu') return;
    if (G.mp < sk.mp) { S.deny(); blog('기력이 모자라요!'); return; }
    if (sk.costGold && G.gold < sk.costGold) { S.deny(); blog('던질 돈이 없어요! 😭'); return; }
    G.mp -= sk.mp;
    if (sk.costGold) { G.gold -= sk.costGold; blog('💸 ' + sk.costGold + '원을 던졌다!'); }
    B.phase = 'anim'; B.busy = 0.5; B.menu = 'root';

    // 스킬 전용 이펙트 (레벨이 오르면 연출도 세진다)
    if (B.posP && B.posE) castEffect(sk.id, B.posP.x, B.posP.y, B.posE.x, B.posE.y, skLv(sk.id));
    // 숙련도 — 레벨이 오를수록 더 많이 써야 한다. Lv5가 만렙.
    if (!G.skUse) G.skUse = {};
    const curLv = skLv(sk.id);
    if (curLv < SK_MAX) {
        G.skUse[sk.id] = (G.skUse[sk.id] || 0) + 1;
        if (G.skUse[sk.id] >= skNeed(curLv)) {
            G.sk[sk.id] = curLv + 1; G.skUse[sk.id] = 0;
            const top = G.sk[sk.id] >= SK_MAX;
            B.masterT = top ? 2.4 : 1.8;
            B.masterS = sk.n + (top ? ' 만렙! ★★★★★' : ' 숙련! Lv' + G.sk[sk.id]);
            S.levelup();
            blog('🔥 ' + skNeed(curLv) + '번 사용! ' + sk.n + (top ? ' 이(가) 만렙이 됐다!!' : ' 이(가) Lv' + G.sk[sk.id] + ' 가 됐다!'));
            save();
        }
    }
    let txt = '동훈이의 ' + sk.n + '!';
    const say = SAY[sk.id];
    if (say) B.say = { t: 1.4, s: say[(Math.random() * say.length) | 0] };
    B.fxKind = FX_OF[sk.id] || 'hit';
    B.fxT = 0.45;
    if (sk.pow > 0) {
        const hits = sk.hits || 1;
        let total = 0, anyCrit = false;
        for (let i = 0; i < hits; i++) {
            const r = dmgCalc(atkOf(), skPow(sk), B.e.def, sk.crit);
            total += r.d; anyCrit = anyCrit || r.crit;
        }
        const exP = petBonus('extra');
        if (exP && Math.random() < exP) {
            const r2 = dmgCalc(atkOf(), skPow(sk) * 0.5, B.e.def, 0);
            total += r2.d;
            txt += ' 🐾 펫의 추가타!';
        }
        const ex = hasAnimal('extra');
        if (ex && Math.random() < ex.val) {
            const r = dmgCalc(atkOf(), skPow(sk) * 0.5, B.e.def, 0);
            total += r.d;
            txt += ' ' + ex.i + ' 추가타!';
        }
        B.e.hp = Math.max(0, B.e.hp - total);
        B.hurtE = 0.45; B.shake = anyCrit ? 0.6 : 0.35;
        if (anyCrit) B.flash = 0.25;
        anyCrit ? S.crit() : S.hit();
        B.pendDmg = { v: total, crit: anyCrit, foe: true };
        txt += (anyCrit ? ' 💥치명타! ' : ' ') + total + ' 데미지!';
    }
    if (sk.healP) {
        const h = Math.round(maxHp() * sk.healP);
        G.hp = Math.min(maxHp(), G.hp + h);
        S.heal(); txt += ' HP ' + h + ' 회복!';
        B.pendHeal = h;
    }
    if (sk.guard) { B.guard = sk.guard; txt += ' 방어 태세!'; }
    if (sk.debuff) { B.edeb = sk.debuff; txt += ' ' + B.e.n + '의 공격력이 뚝 떨어졌다!'; }
    if (sk.stun) {
        if (Math.random() < sk.stun) { B.estun = 1; txt += ' ' + jo(B.e.n, '이', '가') + ' 당황했다!'; }
        else txt += ' ...하지만 안 통했다.';
    }
    blog(txt);
    syncHud();
}

function useItem(it) {
    if (B && (B.busy > 0 || B.phase !== 'menu')) return;
    if (!G.items[it.id]) { S.deny(); return; }
    G.items[it.id]--;
    if (it.id === 'candy') { G.hp = Math.min(maxHp(), G.hp + Math.round(maxHp() * 0.4)); }
    else { G.mp = Math.min(maxMp(), G.mp + Math.round(maxMp() * 0.5)); }
    S.heal(); syncHud();
    if (B) { blog(it.i + ' ' + it.n + ' 사용!'); B.phase = 'anim'; B.busy = 0.5; B.menu = 'root'; }
}

function tryRun() {
    if (B.e.boss) { S.deny(); blog('보스전에서는 도망칠 수 없어요!'); return; }
    if (Math.random() < 0.72) { blog('무사히 도망쳤다!'); B.result = 'run'; B.phase = 'end'; B.busy = 0.8; }
    else { blog('도망치지 못했다!'); B.phase = 'anim'; B.busy = 0.5; B.menu = 'root'; }
}

function enemyTurn() {
    if (B.e.hp <= 0) return;
    if (B.estun > 0) { B.estun--; blog(jo(B.e.n, '은', '는') + ' 멍하니 서 있다...'); return; }
    const deb = 1 - B.edeb;
    let d = B.e.atk * deb * (0.9 + Math.random() * 0.2) - defOf() * 0.35;
    if (B.guard > 0) d *= 0.52;
    const gd = hasAnimal('guard');
    if (gd) d *= (1 - gd.val);
    if (petBonus('def')) d *= (1 - petBonus('def'));
    d = Math.max(1, Math.round(d));
    G.hp = Math.max(0, G.hp - d);
    B.hurtP = 0.45; B.shake = 0.3;
    B.pendDmg = { v: d, crit: false, foe: false };
    S.hit();
    blog(B.e.n + '의 공격! ' + d + ' 데미지!');
    syncHud();
}

function turnEnd() {
    if (B.guard > 0) B.guard--;
    if (B.edeb > 0) { B.edeb = Math.max(0, B.edeb - 0.12); }
    const rg = hasAnimal('regen');
    if (rg && G.hp > 0 && G.hp < maxHp()) { G.hp = Math.min(maxHp(), G.hp + rg.val); }
    const mn = hasAnimal('mana');
    if (mn && G.mp < maxMp()) { G.mp = Math.min(maxMp(), G.mp + mn.val); }
    if (petBonus('heal') && G.hp > 0) G.hp = Math.min(maxHp(), G.hp + Math.ceil(maxHp() * petBonus('heal')));
    if (petBonus('mana')) G.mp = Math.min(maxMp(), G.mp + Math.ceil(maxMp() * petBonus('mana')));
    syncHud();
}

function winBattle() {
    const e = B.e, c = city();
    // 승리 시 소폭 회복 — 전투마다 가게로 돌아가지 않아도 되게
    G.hp = Math.min(maxHp(), G.hp + Math.ceil(maxHp() * 0.09));
    G.mp = Math.min(maxMp(), G.mp + Math.ceil(maxMp() * 0.06));
    G.gold += Math.round(e.gold * (1 + petBonus('gold'))); G.exp += e.exp; G.kills++;
    const drops = [];
    const n = (e.boss ? 5 : 1 + (Math.random() < 0.4 ? 1 : 0)) + (Math.random() < petBonus('mat') ? 2 : 0);
    for (let i = 0; i < n; i++) {
        const m = c.mats[Math.floor(Math.random() * c.mats.length)];
        G.mats[m.n] = (G.mats[m.n] || 0) + 1;
        drops.push(m.i + m.n);
    }

    const gd = gearDrop(e);

            ? '<br><br>' + sl.i + ' <b style="color:#c04a60">' + gd.g.n + '</b> 획득! 바로 착용했어요 (' + sl.d + ' +' + gd.g.v + '%)' +
              (gd.back ? '<br><span style="opacity:.7">쓰던 ' + gd.old.n + '은(는) 팔아서 ' + gd.back.toLocaleString() + '원</span>' : '')
            : '<br><br>' + sl.i + ' ' + gd.g.n + ' — 쓰던 게 더 좋아서 팔았어요 (+' + gd.money.toLocaleString() + '원)';
    }
    let lvUp = '';

        if (ns) lvUp += '<br>새 기술 <b>' + ns.n + '</b> 습득!';
        if (f.lv === G.lv) {
            lvUp += '<br>✨ <b>' + f.n + '</b>(으)로 진화했다!';
            if (f.note) lvUp += '<br><span style="opacity:.75;font-size:.9em">' + f.note + '</span>';
        }
        S.levelup();
    }
    if (e.boss && e.echo) {                 // 🌙 외전 보스
        G.echo.boss[c.id] = true;
        save();
        msg('🌙', '그림자 ' + c.boss.n + ' 을(를) 보냈다',
            '<b style="color:#9b7bd4;font-size:1.05em">' + ECHO_WORD[c.id] + '</b><br><br>' +
            '<span style="opacity:.75">그림자는 아무 말 없이 고개를 끄덕이고 사라졌다.</span><br><br>' +
            body + lvUp + '<br><br>🌙 못 한 말 <b>' + echoCount() + ' / 10</b>');
        syncHud(); save(); checkEchoEnd();
        return;
    }
    if (e.boss) {
        G.boss[c.id] = true;
        const UN = { paris:['stall','🧺 이동식 가판대','이제 ☰ 메뉴에서 <b>어디서든 가게를 열 수</b> 있어요!'],
                     kyoto:['catch','🪄 몬스터 포획','전투에서 적 체력을 40% 밑으로 깎으면<br><b>반지를 던져 잡을 수</b> 있어요. 잡은 몬스터는 <b>펫</b>이 돼서 따라다녀요!'],
                     cairo:['merchant','🏺 떠돌이 상인','도시 어딘가에 <b>수상한 상인</b>이 나타나기 시작했어요.<br>희귀한 물건을 팝니다.'],
                     roma:['lucky','🍀 행운의 기운','<b>전설 몬스터</b> 출현 확률이 크게 올랐어요!'] }[c.id];
        if (UN && !G.unlock[UN[0]]) {

        }
        if (!G.animals.includes(c.animal.id)) {
            G.animals.push(c.animal.id);

        }

        msg('🎉', e.n + ' 격파!', body + lvUp);
    }
    syncHud(); save();
}

function catchWin() {
    const e = B.e, c = city();
    const g = Math.round(e.gold * 0.4), x = Math.round(e.exp * 0.5);
    G.gold += g; G.exp += x;
    let lvUp = '';
    while (G.exp >= expNeed()) { G.exp -= expNeed(); G.lv++; G.hp = maxHp(); G.mp = maxMp(); lvUp = '<br>🎊 레벨 ' + G.lv + '!'; S.levelup(); }
    const pet = (G.pets || [])[G.pets.length - 1];
    const db = PET_DB[e.draw];
    S.win();
    msg('🪄', '포획 성공!', '<b style="color:#c04a60">' + (pet ? pet.n : e.n) + '</b> 이(가) 동료가 됐어요!<br>' +
        '<span style="opacity:.75">' + (db ? db.d : '') + '</span><br><br>💰 ' + g + '원 · ⭐ ' + x + lvUp +
        '<br><br><span style="opacity:.7">☰ 메뉴 → 펫 에서 바꿀 수 있어요.<br>같은 종류를 또 잡으면 레벨이 올라요!</span>');
    syncHud(); save();
}
function loseBattle() {
    const lost = Math.round(G.gold * 0.25);
    G.gold -= lost;
    G.hp = Math.round(maxHp() * 0.5); G.mp = Math.round(maxMp() * 0.5);
    S.lose();
    msg('😵', '동훈이가 쓰러졌다...', '소현이가 동훈이를 업고 돌아왔어요.<br>치료비로 💰 ' + lost + '원을 썼습니다.<br><br><span style="opacity:.7">레벨을 더 올리거나 아이템을 챙겨가요!</span>');
    P.x = MAP.start.x * TS + TS / 2; P.y = MAP.start.y * TS + TS / 2;
    syncHud(); save();
}

function updateBattle(dt) {
    B.t += dt;
    B.hurtP = Math.max(0, B.hurtP - dt);
    B.hurtE = Math.max(0, B.hurtE - dt);
    B.shake = Math.max(0, B.shake - dt);
    B.flash = Math.max(0, (B.flash || 0) - dt * 3);
    if (B.say) { B.say.t -= dt; if (B.say.t <= 0) B.say = null; }
    if (B.fxT > 0) B.fxT -= dt;
    updateFx(dt);
    updateEF(dt);
    if (B.masterT > 0) B.masterT -= dt;
    if (B.tierT > 0) B.tierT -= dt;
    // HP바가 뚝 떨어지지 않고 스르륵 줄어든다
    const et = B.e.hp / B.e.max, pt = G.hp / maxHp();
    B.eShow += (et - B.eShow) * Math.min(1, dt * 6);
    B.pShow += (pt - B.pShow) * Math.min(1, dt * 6);
    if (B.busy > 0) {
        B.busy -= dt;
        if (B.busy <= 0) {
            if (B.phase === 'end') {
                if (ARENA) {                       // 투기장은 결과창 없이 바로 다음 층
                    if (B.result === 'win') { arenaNext(); return; }
                    ARENA_LAST_EXP = ARENA.exp; arenaStop(true); return;
                }
                scene = 'world'; endBattleUi();
                if (B.result === 'win') winBattle();
                else if (B.result === 'lose') loseBattle();
                else if (B.result === 'catch') catchWin();
                B = null; return;
            }
            if (B.e.hp <= 0) { B.result = 'win'; B.phase = 'end'; B.busy = 0.6; blog(jo(B.e.n, '을', '를') + ' 쓰러뜨렸다!'); return; }
            enemyTurn();
            if (G.hp <= 0) { B.result = 'lose'; B.phase = 'end'; B.busy = 1.0; blog('동훈이가 쓰러졌다...'); return; }
            turnEnd();
            B.phase = 'menu';
        }
    }
    if (B.phase === 'intro') {
        B.ringT += dt;
        if (B.ringT > 1.25) { B.phase = 'menu'; blog('💍 "가라! 동훈!"'); }
    }
    if (ARENA && B && B.phase === 'menu' && B.busy <= 0) {
        ARENA.actT -= dt * ARENA.speed;
        if (ARENA.actT <= 0) { ARENA.actT = 0.75; arenaAct(); }
    }
}

function battleTap(x, y) {
    if (!B || B.phase !== 'menu') return;
    for (const b of B.btns) {
        if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { S.open(); b.fn(); return; }
    }
}

function drawBattleScene(c, p, vPanelY) {
    const hor = Math.round(vPanelY * 0.52);
    // 하늘 — 그라데이션 대신 띠로 나눠서 도트 느낌 유지
    R(0, 0, VW, hor, p.a0);
    R(0, Math.round(hor * 0.34), VW, hor, shade(p.sky, 14));
    R(0, Math.round(hor * 0.58), VW, hor, p.sky);
    // 해
    const sx = Math.round(VW * 0.78), sy = Math.round(hor * 0.26);
    R(sx - 9, sy - 7, 18, 14, '#fff0a8'); R(sx - 7, sy - 9, 14, 18, '#fff0a8');
    R(sx - 6, sy - 5, 8, 6, '#fffce0');
    // 구름
    for (let i = 0; i < 3; i++) {
        const cx = Math.round(((gameT * (3 + i * 1.6) + i * 90) % (VW + 70)) - 35);
        const cy = Math.round(hor * (0.14 + i * 0.16));
        R(cx - 11, cy, 22, 5, '#ffffff'); R(cx - 7, cy - 4, 14, 5, '#ffffff');
        R(cx - 13, cy + 3, 26, 3, '#e6f2ff');
    }
    // 랜드마크 실루엣
    px.save(); px.translate(Math.round(VW * 0.22) - (MW / 2) * TS, hor - 3 * TS - 6);
    px.globalAlpha = 0.55; drawLandmark(c, p); px.globalAlpha = 1; px.restore();
    // 언덕 두 겹
    for (let x = 0; x < VW; x++) {
        const h1 = Math.round(Math.sin(x * 0.06) * 6 + 10);
        R(x, hor - h1, 1, h1 + 4, p.g2);
    }
    for (let x = 0; x < VW; x++) {
        const h2 = Math.round(Math.cos(x * 0.045 + 1.2) * 5 + 6);
        R(x, hor - h2 + 6, 1, h2 + 6, p.t1);
    }
    // 땅
    R(0, hor + 8, VW, vPanelY - hor, p.g1);
    R(0, hor + 8, VW, 2, p.g0);
    for (let j = 0; j < 20; j++) for (let i = 0; i < 24; i++) {
        const r = th(i, j, 21);
        const gx = Math.round(i * (VW / 24)) + 2, gy = hor + 14 + j * 7;
        if (gy > vPanelY - 2) continue;

function rr(x, y, w, h, r, fill) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function bar(x, y, w, h, p, c1, c2) {
    rr(x, y, w, h, h / 2, 'rgba(0,0,0,.5)');
    const g = ctx.createLinearGradient(x, 0, x + w, 0);
    g.addColorStop(0, c1); g.addColorStop(1, c2);
    rr(x, y, Math.max(2, w * Math.max(0, Math.min(1, p))), h, h / 2, null);
    ctx.fillStyle = g; ctx.fill();
}
// 로그는 줄바꿈이 생길 수 있어서, 앞 줄이 몇 줄을 썼는지 누적해서 y를 잡는다
let _wrapY = 0;
function wrapText(txt, x, y, maxW, idx) {
    if (idx === 0) _wrapY = y;
    const lines = [];
    let line = '';
    for (const ch of txt) {
        if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
        else line += ch;
    }
    lines.push(line);
    for (const l of lines) { ctx.fillText(l, x, _wrapY); _wrapY += 17; }
}

function tickShop(dt) {
    if (stockTotal() <= 0) return;

    const period = shopPeriod();
    while (G.shopAt >= period) {
        G.shopAt -= period;
        if (custs.length < 4) spawnCustomer();   // 손님이 직접 걸어와서 사 간다
        else sellOne(P.x, P.y);

function sellOne(px2, py2) {
    const keys = Object.keys(G.stock).filter(k => G.stock[k] > 0);
    if (!keys.length) return;
    const k = keys[Math.floor(Math.random() * keys.length)];
    G.stock[k]--;
    if (G.stock[k] <= 0) delete G.stock[k];
    let price = 0, icon = '🍽️';
    for (const c of CITIES) for (const m of c.shop.menu) if (m.n === k) { price = m.price; icon = m.i; }

}

function cook(i) {
    const m = city().shop.menu[i];
    if ((m.t || 0) > upLv('shop')) { S.deny(); toast('🔒 가게를 확장해야 만들 수 있어요'); return; }
    const lack = Object.entries(m.need).filter(([k, v]) => (G.mats[k] || 0) < v);
    if (lack.length) { S.deny(); toast('재료가 모자라요 — ' + lack.map(([k, v]) => k + ' ' + (G.mats[k] || 0) + '/' + v).join(', ')); return; }
    for (const [k, v] of Object.entries(m.need)) G.mats[k] -= v;
    G.stock[m.n] = (G.stock[m.n] || 0) + 1;
    S.pick();
    toast(m.i + ' ' + m.n + ' 완성! 진열대에 올렸어요 (' + stockTotal() + '개)');
    syncHud(); save(); openShop();
}
function buy(i) {
    const it = ITEMS[i];
    const pr = itemPrice(it);
    if (G.gold < pr) { S.deny(); toast('💰 돈이 ' + (pr - G.gold).toLocaleString() + '원 모자라요'); return; }
    G.gold -= pr;
    G.items[it.id] = (G.items[it.id] || 0) + 1;
    S.coin();
    toast(it.i + ' ' + it.n + ' 구매! (보유 ' + G.items[it.id] + '개)');
    syncHud(); save(); openShop();
}
function restCost() { return Math.round(220 * (1 + G.cityIdx * 2.4)); }
function restHere() {
    const c2 = restCost();
    if (G.gold < c2) { S.deny(); toast('💰 돈이 ' + (c2 - G.gold).toLocaleString() + '원 모자라요'); return; }
    if (G.hp >= maxHp() && G.mp >= maxMp()) { S.deny(); return; }
    G.gold -= c2; G.hp = maxHp(); G.mp = maxMp();
    S.heal(); toast('🛏️ 푹 쉬었어요! 체력·기력 회복');
    syncHud(); save(); openShop();
}
function buyUp(i) {
    const u = UPGRADES[i];
    if (upLv(u.id) >= u.max || G.gold < upCost(u)) { S.deny(); return; }
    G.gold -= upCost(u);
    G.up[u.id] = upLv(u.id) + 1;
    S.levelup();
    const lv = G.up[u.id];
    toast((u.id === 'ride' ? RIDE_I[lv] : u.i) + ' ' + u.n + ' Lv' + lv + ' 획득!');
    if (u.id === 'shop') {
        const unlocked = city().shop.menu.filter(m => (m.t || 0) === lv);
        if (unlocked.length) msg('🍞', '새 메뉴 해금!', unlocked.map(m => m.i + ' <b>' + m.n + '</b>').join('<br>') + '<br><br>더 비싼 걸 팔 수 있게 됐어요!');
    }

}
function buyBook(id) {
    const sk = SKILLS.find(x => x.id === id);
    if (skMaxed(id)) { S.deny(); toast('★ ' + sk.n + ' 은(는) 이미 만렙이에요'); return; }
    const cost = skBookCost(sk);
    if (G.gold < cost) { S.deny(); toast('💰 돈이 ' + (cost - G.gold).toLocaleString() + '원 모자라요'); return; }
    const was = skLv(id);
    G.gold -= cost;
    G.sk[id] = Math.min(SK_MAX, was + 1); skReset(id);
    S.levelup();
    toast('📕 ' + sk.n + ' Lv' + was + ' → Lv' + G.sk[id] + (skMaxed(id) ? ' — 만렙!' : ' (위력 +35%)'));
    syncHud(); save(); openShop();
}
// 아직 레벨이 안 되는 기술을 책으로 미리 배운다
function learnSkill(id) {
    const sk = SKILLS.find(x => x.id === id);
    const cost = skBookCost(sk) * 3;
    if (G.gold < cost) { S.deny(); toast('💰 돈이 ' + (cost - G.gold).toLocaleString() + '원 모자라요'); return; }
    G.gold -= cost;
    G.learned[id] = true;
    G.sk[id] = Math.max(1, skLv(id));
    S.levelup();
    msg('📕', '새 기술 습득!', '<b>' + sk.n + '</b><br><span style="opacity:.75">' + sk.d + '</span><br><br>레벨 제한 없이 책으로 배웠어요!');
    syncHud(); save(); openShop();
}

                 : '새로운 재료와 몬스터가 기다리고 있어요.<br>가게도 새로 열었습니다!');
}


// ───────── 떠돌이 상인 (비밀 상점) ─────────
const MERCH = [
    { id:'charm', i:'🔮', n:'포획 부적',   d:'포획 확률 +12%, 전설 몬스터 출현 +5% (영구)', c:8000 },
    { id:'ring',  i:'💍', n:'강화 반지',   d:'공격력 +8% (영구 · 살 때마다 누적)',          c:6000 },
    { id:'book',  i:'📗', n:'희귀 스킬북', d:'배운 기술 하나가 한 번에 +2 레벨',            c:9000 },
    { id:'feed',  i:'🍖', n:'펫 먹이',     d:'지금 데리고 다니는 펫의 레벨 +1',             c:5000 },
    { id:'egg',   i:'🥚', n:'수상한 알',   d:'랜덤 펫 한 마리 (이미 있으면 레벨업)',        c:20000 },
];
function merchCost(m) { return Math.round(m.c * (1 + G.cityIdx * 2.1)); }
function merchKey(m) { return city().id + '_' + m.id; }
function openMerch() {
    let h = '<div class="rd" style="margin:2px 0 10px;opacity:.8">"…조용히 하게. 이건 아무한테나 안 파는 거야."<br>도시마다 한 번씩만 살 수 있네.</div>';
    MERCH.forEach((m, i) => {
        const sold = G.merch[merchKey(m)];
        const cost = merchCost(m);
        h += rowHtml(sold ? '✅' : m.i, m.n + (sold ? ' <span style="opacity:.6;font-size:.8em">구매함</span>' : ''),
            m.d + (m.id === 'ring' && G.ringLv ? '<br><b>현재 +' + (G.ringLv * 8) + '%</b>' : ''),
            sold ? '—' : cost.toLocaleString() + '원',
            sold ? '' : 'buyMerch(' + i + ')', sold || G.gold < cost);
    });
    panelOpen('🏺 떠돌이 상인', '💰 ' + G.gold.toLocaleString() + '원', h);
}
function buyMerch(i) {
    const m = MERCH[i], cost = merchCost(m);
    if (G.merch[merchKey(m)]) { S.deny(); return; }
    if (G.gold < cost) { S.deny(); toast('💰 돈이 ' + (cost - G.gold).toLocaleString() + '원 모자라요'); return; }
    G.gold -= cost; G.merch[merchKey(m)] = true;
    S.levelup();
    if (m.id === 'charm') { G.charm = true; toast('🔮 포획 부적을 얻었다!'); }
    else if (m.id === 'ring') { G.ringLv = (G.ringLv || 0) + 1; toast('💍 공격력 +' + (G.ringLv * 8) + '%'); }
    else if (m.id === 'book') {
        const list = mySkills().filter(x => !skMaxed(x.id));
        if (!list.length) { G.gold += cost; G.merch[merchKey(m)] = false; S.deny(); toast('★ 기술이 전부 만렙이에요'); return; }
        const sk = list[(Math.random() * list.length) | 0];
        G.sk[sk.id] = Math.min(SK_MAX, skLv(sk.id) + 2); skReset(sk.id);
        msg('📗', '희귀 스킬북!', '<b>' + sk.n + '</b> 이(가) Lv' + G.sk[sk.id] +
            (skMaxed(sk.id) ? ' — 만렙이 됐어요!' : ' 가 됐어요!'));
    } else if (m.id === 'feed') {
        const ap = (G.pets || []).find(x => x.kind === party()[0]);
        if (!ap) { toast('데리고 다니는 펫이 없어요'); }
        else { ap.lv++; toast('🍖 ' + ap.n + ' Lv' + ap.lv + '!'); }
    } else {
        const kinds = Object.keys(PET_DB);
        const k = kinds[(Math.random() * kinds.length) | 0];
        const have = (G.pets || []).find(x => x.kind === k);
        if (have) { have.lv++; msg('🥚', '알이 부화했다!', '<b>' + have.n + '</b> 이(가) Lv' + have.lv + ' 가 됐어요!'); }
        else {
            const np = { kind:k, n: PET_DB[k].n, lv:1, legend:false, tier:0 };
            G.pets.push(np); if (party().length < PARTY_MAX) party().push(k);
            msg('🥚', '알이 부화했다!', '<b>' + np.n + '</b> 이(가) 동료가 됐어요!<br><span style="opacity:.75">' + PET_DB[k].d + '</span>');
        }
    }
    syncHud(); save(); openMerch();
}

// ───────── 공용 UI ─────────
let toastTimer = null;
function toast(s) {
    const t = document.getElementById('toast');
    t.innerHTML = s; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}
function msg(em, title, body) {
    document.getElementById('mEm').textContent = em;
    document.getElementById('mTitle').textContent = title;
    document.getElementById('mBody').innerHTML = body;
    document.getElementById('ovMsg').classList.add('show');
}
function closeMsg() { document.getElementById('ovMsg').classList.remove('show'); S.open(); }
// confirm()은 아티팩트 같은 샌드박스 환경에서 막히므로 직접 만든다
function ask(em, title, body, yesLabel, onYes) {
    document.getElementById('aEm').textContent = em;
    document.getElementById('aTitle').textContent = title;
    document.getElementById('aBody').innerHTML = body;
    const btn = document.getElementById('aYes');
    btn.textContent = yesLabel;
    btn.onclick = function () { closeAsk(); onYes(); };
    document.getElementById('ovAsk').classList.add('show');
    S.open();
}
function closeAsk() { document.getElementById('ovAsk').classList.remove('show'); }

function syncHud() {
    if (!G) return;
    document.getElementById('hGold').textContent = G.gold;
    document.getElementById('hForm').textContent = formOf().n + ' Lv' + G.lv;
    document.getElementById('bHp').style.width = Math.max(0, G.hp / maxHp() * 100) + '%';
    document.getElementById('bMp').style.width = Math.max(0, G.mp / maxMp() * 100) + '%';
    document.getElementById('bXp').style.width = Math.min(100, G.exp / expNeed() * 100) + '%';
}

// ───────── 저장 / 시작 ─────────
function save() { if (G) sSave(SAVE_KEY, G); }
let saveT = 0;

function startGame() {
    G = newGame();
    document.getElementById('ovStart').classList.remove('show');
    enterCity(0);
    scene = 'world'; running = true; lastT = performance.now();
    ac(); save();
    requestAnimationFrame(loop);
    startCut(STORY.prologue.em, STORY.prologue.lines, () => toast('🕹️ 화면을 눌러서 밀면 걸어가요!'));
}
function continueGame() {
    const s = sLoad(SAVE_KEY, null);
    if (!s) return startGame();
    G = Object.assign(newGame(), s);
    document.getElementById('ovStart').classList.remove('show');
    enterCity(G.cityIdx, true);
    P.x = G.px || P.x; P.y = G.py || P.y;
    scene = 'world'; running = true; lastT = performance.now();
    ac();
    requestAnimationFrame(loop);
}

// ───────── 메인 루프 ─────────
function loop(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts; gameT += dt;
    if (CUT) { cutTick(dt); requestAnimationFrame(loop); return; }
    if (scene === 'world') {
        if (TK) {
            const full = TK.npc.lines[TK.i];
            if (TK.ch < full.length) TK.ch = Math.min(full.length, TK.ch + dt * 42);
            updatePops(dt);
            document.getElementById('acts').style.display = 'none';
        } else updateWorld(dt);
        drawWorld();
        if (TK) drawTalkBox();
    }
    else if (scene === 'battle') { updateBattle(dt); if (B) drawBattle(); }
    saveT += dt;
    if (saveT > 6) { saveT = 0; save(); }
    requestAnimationFrame(loop);
}

// 이어하기 버튼은 저장이 있을 때만
if (sLoad(SAVE_KEY, null)) document.getElementById('btnContinue').style.display = '';
</script>
