<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#9ad468}canvas{display:block}</style>
<canvas id=cv width=432 height=864></canvas><script src="data.js"></script><script>
const W=432,H=864,g=document.getElementById('cv').getContext('2d');
const cream="#fff8e8",ink="#294b46",muted="#788277",gold="#e5b96f",rose="#cf8d77";
const CITY_LOOK=[["f08898","c85068","4a5570","","39415e"],["d696ac","","5e6b8a","","3b3f52"],["e8c27a","f3e6c4","c9a66b","f3e6c4","7a6a4c"],["b76c59","","6d8a62","","4a4a52"],["36495c","","2f3542","c85068","23262e"],["a4dce4","c85068","e6edf1","4a8a9c","4d5d70"],["fcf8ee","e4c783","5688b6","","e8e2d2"],["b68e7e","","3e4d57","2c343a","2c343a"],["f2a65a","","74bcb7","","3f6a8a"],["e9b4c5","","68747b","","3a4250"]];
function look(girl,city,gear){const r=CITY_LOOK[city],skin="#ffd2a6";
 if(girl)return{O:"#2a1c18",S:skin,G:skin,H:"#8a5434",C:r[1]?"#"+r[1]:"#8a5434",T:"#"+r[0],D:"#3a4a6a",E:"#46304e"};
 let top="#"+r[2]; if(gear[1]>0)top="#"+["","f3a6c0","c8553d","7a5fc0"][gear[1]];
 let glove=skin; if(gear[0]>0)glove="#"+["","9aa4ad","ff5f8f","ffcf3a"][gear[0]];
 return{O:"#2a1c18",S:skin,G:glove,H:"#5c3620",C:r[3]?"#"+r[3]:"#5c3620",T:top,D:"#"+r[4],E:"#"+["46304e","f2f2f2","8a5a2c","ffd84a"][gear[2]]}}
function sprite(rows,foot,s,pal){const ox=Math.round(foot.x-rows[0].length*s/2),oy=Math.round(foot.y-rows.length*s);
 for(let y=0;y<rows.length;y++){const row=rows[y];let st=-1,key="";
  for(let x=0;x<=row.length;x++){const k=x<row.length?row[x]:"";if(k===key)continue;
   if(st>=0&&pal[key]){g.fillStyle=pal[key];g.fillRect(ox+st*s,oy+y*s,(x-st)*s,s)}key=k;st=x}}}
function mobSize(art){let lo=[999,999],hi=[-999,-999];for(const p of PARTS[art]){lo=[Math.min(lo[0],p[0]),Math.min(lo[1],p[1])];hi=[Math.max(hi[0],p[0]+p[2]),Math.max(hi[1],p[1]+p[3])]}return{lo,size:[hi[0]-lo[0],hi[1]-lo[1]]}}
function mob(art,foot,s){const m=mobSize(art),o={x:Math.round(foot.x-m.size[0]*s/2),y:Math.round(foot.y-m.size[1]*s)};
 for(const p of PARTS[art]){g.fillStyle=p[4];g.fillRect(o.x+(p[0]-m.lo[0])*s,o.y+(p[1]-m.lo[1])*s,p[2]*s,p[3]*s)}}
function txt(t,x,y,size,col,wid,al){g.font="bold "+size+"px sans-serif";g.fillStyle=col;g.textAlign=al==="c"?"center":"left";g.fillText(t,al==="c"?x+wid/2:x,y)}
const u=25.6,s=Math.max(2,Math.round(u*0.075));
// 1) 도시별 옷 (기본 장비)
txt("도시별 옷차림 (소현 / 동훈)",10,18,12,ink);
for(let c=0;c<10;c++){const x=26+c*41;sprite(GIRL,{x:x,y:74},s,look(true,c,[0,0,0]));sprite(BOY,{x:x,y:124},s,look(false,c,[0,0,0]));txt(String(c+1),x-10,138,10,ink,20,"c")}
// 2) 장비 단계별 동훈
txt("장비 단계 0~3 (장갑·옷·신발)",10,162,12,ink);
for(let t=0;t<4;t++){sprite(BOY,{x:40+t*56,y:214},s,look(false,0,[t,t,t]))}
// 3) 펫 3마리 + 보스
txt("펫(오버월드 크기) / 보스",10,240,12,ink);
const arts=Object.keys(PARTS);
arts.slice(0,30).forEach((a,i)=>{mob(a,{x:22+(i%15)*28,y:280+Math.floor(i/15)*36},u*0.055)});
arts.slice(30).forEach((a,i)=>{mob(a,{x:30+i*42,y:420},u*0.085)});
// 실제 장면: 줄지어 걷기
sprite(GIRL,{x:120,y:500},s,look(true,0,[0,0,0]));sprite(BOY,{x:150,y:508},s,look(false,0,[3,1,3]));
["ghost","fox","koala"].forEach((a,i)=>mob(a,{x:176+i*26,y:510},u*0.055));
mob("pierre",{x:300,y:510},u*0.085);
// 4) 아이콘
function panel(x,y,w,h,c,r){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r||0);g.fill()}
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function C(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function icon(kind,p,tier){tier=tier||0;panel(p.x-22,p.y-22,44,44,"#f1e6cf",10);
 if(kind==="candy"){R(p.x-17,p.y-5,8,10,"#ff9ec8");R(p.x+9,p.y-5,8,10,"#ff9ec8");C(p.x,p.y,9,"#e8548c");C(p.x-3,p.y-3,3,"#ffd0e2")}
 else if(kind==="drink"){R(p.x-8,p.y-14,16,28,"#3f8fa8");R(p.x-8,p.y-14,16,5,"#c9d6dc");R(p.x-2,p.y-6,5,7,"#ffe36c");R(p.x-4,p.y,5,7,"#ffe36c")}
 else if(kind==="treat"){R(p.x-10,p.y-3,20,6,"#e9dcc0");for(const q of[[-11,-4],[-11,4],[11,-4],[11,4]])C(p.x+q[0],p.y+q[1],5,"#e9dcc0")}
 else if(kind==="film"){R(p.x-15,p.y-11,30,22,"#3a3f4a");R(p.x-9,p.y-6,18,12,"#a6d8e8");for(let i=0;i<4;i++){R(p.x-13+i*8,p.y-10,3,3,cream);R(p.x-13+i*8,p.y+7,3,3,cream)}}
 else if(kind==="meal"){R(p.x-15,p.y-4,30,14,"#c8553d");R(p.x-15,p.y-9,30,6,"#e9dcc0");R(p.x-3,p.y-14,6,6,"#7a5230")}
 else if(kind==="slot0"){
  if(tier===0){R(p.x-14,p.y-8,28,16,"#f0d04a");R(p.x-14,p.y-8,28,6,"#5fa55a")}
  else if(tier===1){g.strokeStyle="#8f9aa5";g.lineWidth=2;for(let i=0;i<4;i++){g.beginPath();g.arc(p.x,p.y,4+i*3.4,0,7);g.stroke()}}
  else{const gl=tier===2?"#ff5f8f":"#ffcf3a";R(p.x-9,p.y-2,18,16,gl);for(let i=0;i<4;i++)R(p.x-9+i*5,p.y-14,4,13,gl);R(p.x-15,p.y,7,5,gl);R(p.x-9,p.y+10,18,4,"rgba(0,0,0,.25)");
   if(tier===3){R(p.x+10,p.y-18,3,9,"#fff4b0");R(p.x+7,p.y-15,9,3,"#fff4b0")}}}
 else if(kind==="slot1"){const cl=["#e9e4d8","#f3a6c0","#c8553d","#7a5fc0"][tier];R(p.x-9,p.y-11,18,24,cl);R(p.x-16,p.y-11,8,9,cl);R(p.x+8,p.y-11,8,9,cl);R(p.x-4,p.y-11,8,4,"#f1e6cf");
  if(tier===1)for(const q of[[-4,-1],[4,4],[-3,8]])C(p.x+q[0],p.y+q[1],2,"#fff4b0");
  else if(tier===3)for(const q of[[-4,0],[4,6]])R(p.x+q[0]-2,p.y+q[1]-2,4,4,"#ffe36c")}
 else{const sh=["#3a4a6a","#f6f6f6","#8a5a2c","#5fbf6a"][tier];R(p.x-14,p.y+2,28,8,sh);R(p.x-14,p.y-8,13,11,sh);R(p.x-14,p.y+9,28,3,"#2a1c18");
  if(tier===0)for(let i=0;i<3;i++)R(p.x-2+i*5,p.y+3,2,6,cream); else if(tier===3){R(p.x-20,p.y-6,7,4,cream);R(p.x-22,p.y-11,8,4,cream)}}}
txt("아이콘",10,560,12,ink);
["candy","drink","treat","film","meal"].forEach((k,i)=>icon(k,{x:34+i*52,y:596}));
for(let sl=0;sl<3;sl++)for(let t=0;t<4;t++)icon("slot"+sl,{x:34+t*52,y:650+sl*52},t);
</script>
